<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    :root{
      --gap: 12px;

      /* slideshow speeds */
      --speedTop: 26s;
      --speedBottom: 30s;

      /* layout min heights */
      --minLogoBlock: 240px;
      --minSlideBlock: 260px;

      --shadow: 0 18px 55px rgba(0,0,0,0.18);
      --radius: 18px;
    }

    *{ box-sizing: border-box; }
    html{ height: -webkit-fill-available; }
    body{
      margin: 0;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      height: -webkit-fill-available;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fff;
    }

    /* subtle background */
    .bg{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 25% 10%, rgba(255,192,203,0.18), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(255,182,193,0.14), transparent 60%),
        #ffffff;
      z-index: -2;
    }

    .page{
      position: fixed;
      inset: 0;
      display: grid;
      gap: var(--gap);
      padding:
        calc(10px + env(safe-area-inset-top))
        12px
        calc(10px + env(safe-area-inset-bottom))
        12px;

      /* 2/3 slideshow + 1/3 bottom area */
      grid-template-rows:
        minmax(var(--minSlideBlock), 2fr)
        minmax(var(--minLogoBlock), 1fr);
    }

    /* =========================================================
       SLIDESHOW — CHANGED ONLY HERE (no frames/borders/cards)
       ========================================================= */

    .slideshow{
      /* remove card/frame look */
      border-radius: 0;
      overflow: hidden;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;

      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 10px;         /* keep separation between the 2 lanes */
      padding: 0;        /* no inner padding */
      min-height: 0;
    }

    .lane{
      position: relative;
      overflow: hidden;

      /* remove lane frames */
      border-radius: 0;
      background: transparent;
      border: none;
    }

    .track{
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      display: flex;

      /* remove spacing between photos */
      gap: 0;
      padding: 0;

      width: max-content;
      will-change: transform;
      align-items: center;
    }

    .lane.top .track{ animation: moveLeft var(--speedTop) linear infinite; }
    .lane.bottom .track{ animation: moveRight var(--speedBottom) linear infinite; }

    @keyframes moveLeft{
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-1 * var(--shift))); }
    }
    @keyframes moveRight{
      from { transform: translateX(calc(-1 * var(--shift))); }
      to   { transform: translateX(0); }
    }

    .slide{
      flex: 0 0 auto;
      height: 100%;

      /* remove card look */
      width: auto;
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
      background: transparent;
    }

    .slide img{
      height: 100%;
      width: auto;
      display: block;

      /* keep no zoom / no crop */
      object-fit: contain;
      object-position: center;

      background: transparent;
    }

    /* ===== BOTTOM AREA: FULL WHITE, NO CARD/BORDER ===== */
    .bottomBar{
      width: 100%;
      height: 100%;
      background: #ffffff;     /* full white bottom */
      border-radius: 0;        /* no rounded card */
      box-shadow: none;        /* no shadow */
      border: none;            /* no border */
      padding: 0;              /* flush */
      margin: 0;

      display: grid;
      grid-template-rows: 1fr auto;
      align-items: center;
      justify-items: center;
      gap: 10px;
      min-height: 0;
    }

    /* logo should fill the available area of the bottom bar */
    .logoWrap{
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: 0;
      min-height: 0;
    }

    .logoWrap img{
      width: 100%;
      height: 100%;
      object-fit: contain; /* logo complete */
      display: block;
    }

    /* contact "imprinted" button on white background */
    .contactRow{
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 12px 10px 12px;
    }

    .contactBtn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(520px, 100%);
      padding: 14px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 900;
      color: rgba(10,10,10,0.92);

      /* “imprinted” look on white */
      background: #ffffff;
      border: none;
      box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.08),
        0 10px 24px rgba(0,0,0,0.10);
    }
    .contactBtn:active{ transform: scale(0.985); }

    /* smaller heights */
    @media (max-height: 700px){
      :root{
        --minLogoBlock: 210px;
        --minSlideBlock: 240px;
      }
      .contactBtn{ padding: 12px 14px; }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="page">

    <!-- Slideshow 2 lines (top left, bottom right) -->
    <section class="slideshow" aria-label="Slideshow">
      <div class="lane top">
        <div class="track" id="trackTop"></div>
      </div>

      <div class="lane bottom">
        <div class="track" id="trackBottom"></div>
      </div>
    </section>

    <!-- Bottom: FULL WHITE, no border/card -->
    <section class="bottomBar" aria-label="Logo and contacts">
      <div class="logoWrap">
        <img src="./background.png" alt="Little Things" />
      </div>

      <div class="contactRow">
        <a class="contactBtn" href="./qr_contact/">Contactos / Contacts</a>
      </div>
    </section>

  </div>

  <script>
    // Adjust extensions/paths if needed
    const topPhotos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
    ];

    const bottomPhotos = [
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg",
    ];

    function makeSlide(src){
      const wrap = document.createElement("div");
      wrap.className = "slide";

      const img = document.createElement("img");
      img.src = src;
      img.alt = "Little Things";

      wrap.appendChild(img);
      return wrap;
    }

    function fillTrack(trackEl, photos){
      trackEl.innerHTML = "";

      // Duplicate sequence for seamless loop
      const seq = photos.concat(photos);
      seq.forEach(src => trackEl.appendChild(makeSlide(src)));

      // compute shift distance after layout
      requestAnimationFrame(() => {
        const fullWidth = trackEl.scrollWidth;
        const shift = fullWidth / 2; // because duplicated
        trackEl.style.setProperty("--shift", shift + "px");
      });
    }

    function init(){
      fillTrack(document.getElementById("trackTop"), topPhotos);
      fillTrack(document.getElementById("trackBottom"), bottomPhotos);
    }

    init();
    window.addEventListener("resize", init);
  </script>
</body>
</html>
