<!DOCTYPE html>
<html lang="pt">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YQN46F71DS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YQN46F71DS');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">

  <style>
    :root{
      --btnFont: "Caveat Brush", system-ui, sans-serif;

      /* 🔧 TAMANHO ÚNICO DO TEXTO (muda só aqui se quiseres) */
      --btnTextSize: 24px;
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      background:#fff;
      font-family: system-ui, sans-serif;
    }

    .bottomBar{
      width:100%;
      padding: 16px 12px 20px;
      background:#fff;
    }

    .contactGroup{
      display:flex;
      gap:14px;
      justify-content:center;
      flex-wrap:wrap;
    }

    .contactBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      padding:14px 18px;
      border-radius:999px;
      background:#fff;
      border:none;
      cursor:pointer;
      text-decoration:none;

      box-shadow:
        inset 0 2px 6px rgba(0,0,0,.08),
        0 10px 24px rgba(0,0,0,.10);

      transition: transform .1s ease;
    }

    .contactBtn:active{
      transform: scale(.97);
    }

    /* 🔧 FORÇA ABSOLUTA DO TEXTO */
    .contactBtn span{
      font-family: var(--btnFont);
      font-weight: 400;
      font-size: var(--btnTextSize);
      line-height: 1;
      white-space: nowrap;
    }

    /* 🔧 email NÃO pode herdar nada diferente */
    #emailText{
      font-size: var(--btnTextSize);
      font-family: var(--btnFont);
      font-weight: 400;
    }

    .icon{
      width:18px;
      height:18px;
      flex-shrink:0;
    }
  </style>
</head>

<body>

  <section class="bottomBar">
    <div class="contactGroup">

      <!-- Instagram -->
      <a class="contactBtn"
         href="https://www.instagram.com/little.things.artdecor"
         target="_blank">
        <svg class="icon" viewBox="0 0 24 24">
          <path fill="currentColor"
            d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Z"/>
        </svg>
        <span>Instagram</span>
      </a>

      <!-- Contactos -->
      <a class="contactBtn" href="./qr_contact/">
        <svg class="icon" viewBox="0 0 24 24">
          <path fill="currentColor"
            d="M12 12a4 4 0 1 0-4-4a4 4 0 0 0 4 4Z"/>
        </svg>
        <span>Contactos / Contacts</span>
      </a>

      <!-- Email -->
      <button class="contactBtn" id="emailBtn" type="button">
        <svg class="icon" viewBox="0 0 24 24">
          <path fill="currentColor"
            d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6Z"/>
        </svg>
        <span id="emailText">info@littlethings.events</span>
      </button>

    </div>
  </section>

  <script>
    const emailBtn = document.getElementById("emailBtn");
    const emailText = document.getElementById("emailText");
    const original = emailText.textContent;
    const email = "info@littlethings.events";

    emailBtn.addEventListener("click", async () => {
      try{
        await navigator.clipboard.writeText(email);
        emailText.textContent = "Copiado / Copied";
        setTimeout(() => emailText.textContent = original, 1500);
      }catch{
        emailText.textContent = "Erro";
        setTimeout(() => emailText.textContent = original, 1500);
      }
    });
  </script>

</body>
</html>
