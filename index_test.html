<!DOCTYPE html>
<html lang="pt">
<head>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YQN46F71DS"></script>
<script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    :root{
      --gap: 12px;

      /* speeds */
      --speedTop: 26s;
      --speedBottom: 30s;

      /* layout */
      --minLogoBlock: 240px;
      --minSlideBlock: 260px;

      --shadow: 0 18px 55px rgba(0,0,0,0.18);
      --radiusOuter: 26px;
      --radiusInner: 18px;
    }

    *{ box-sizing: border-box; }
    html{ height: -webkit-fill-available; }
    body{
      margin: 0;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      height: -webkit-fill-available;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fff;
    }

    /* subtle background */
    .bg{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 25% 10%, rgba(255,192,203,0.18), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(255,182,193,0.14), transparent 60%),
        #ffffff;
      z-index: -2;
    }

    .page{
      position: fixed;
      inset: 0;
      display: grid;
      gap: var(--gap);
      padding:
        calc(10px + env(safe-area-inset-top))
        12px
        calc(10px + env(safe-area-inset-bottom))
        12px;

      grid-template-rows:
        minmax(var(--minSlideBlock), 2fr)
        minmax(var(--minLogoBlock), 1fr);
    }

    /* ===== SLIDESHOW: COM MOLDURA ===== */
    .slideshow{
      border-radius: var(--radiusOuter);
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      padding: 10px;
      min-height: 0;
    }

    .lane{
      position: relative;
      overflow: hidden;
      border-radius: var(--radiusInner);
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.45);
    }

    .track{
      position: absolute;
      inset: 0;
      display: flex;
      gap: 10px;        /* espaço entre fotos */
      padding: 10px;    /* padding dentro da lane */
      width: max-content;
      align-items: center;
      will-change: transform;
    }

    .lane.top .track{ animation: moveLeft var(--speedTop) linear infinite; }
    .lane.bottom .track{ animation: moveRight var(--speedBottom) linear infinite; }

    @keyframes moveLeft{
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-1 * var(--shift))); }
    }
    @keyframes moveRight{
      from { transform: translateX(calc(-1 * var(--shift))); }
      to   { transform: translateX(0); }
    }

    .slide{
      flex: 0 0 auto;
      height: 100%;
      width: min(46vw, 420px);
      border-radius: var(--radiusInner);
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      background: transparent;
    }

    /* ✅ Preenche a moldura toda (sem branco) */
    .slide img{
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;        /* <--- isto remove as “partes brancas” */
      object-position: center;
    }

    /* ===== BOTTOM: branco total, sem border/card ===== */
    .bottomBar{
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      margin: 0;

      display: grid;
      grid-template-rows: 1fr auto;
      align-items: center;
      justify-items: center;
      gap: 10px;
      min-height: 0;
    }

    .logoWrap{
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      min-height: 0;
    }

    .logoWrap img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .contactRow{
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 12px 10px 12px;
    }

    .contactBtn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(520px, 100%);
      padding: 14px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 900;
      color: rgba(10,10,10,0.92);
      background: #ffffff;
      border: none;
      box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.08),
        0 10px 24px rgba(0,0,0,0.10);
    }
    .contactBtn:active{ transform: scale(0.985); }

    @media (max-height: 700px){
      :root{
        --minLogoBlock: 210px;
        --minSlideBlock: 240px;
      }
      .slide{ width: min(52vw, 380px); }
      .contactBtn{ padding: 12px 14px; }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="page">

    <section class="slideshow" aria-label="Slideshow">
      <div class="lane top">
        <div class="track" id="trackTop"></div>
      </div>

      <div class="lane bottom">
        <div class="track" id="trackBottom"></div>
      </div>
    </section>

    <section class="bottomBar" aria-label="Logo and contacts">
      <div class="logoWrap">
        <img src="./background.png" alt="Little Things" />
      </div>

      <div class="contactRow">
        <a class="contactBtn" href="./qr_contact/">Contactos / Contacts</a>
      </div>
    </section>

  </div>

  <script>
    const topPhotos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
    ];

    const bottomPhotos = [
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg",
    ];

    function makeSlide(src){
      const wrap = document.createElement("div");
      wrap.className = "slide";

      const img = document.createElement("img");
      img.src = src;
      img.alt = "Little Things";
      img.loading = "eager"; // ajuda a carregar cedo

      wrap.appendChild(img);
      return { wrap, img };
    }

    function restartAnimation(trackEl){
      // força reinício suave da animação (para garantir autoplay)
      const anim = getComputedStyle(trackEl).animationName;
      trackEl.style.animation = "none";
      // força reflow
      trackEl.offsetHeight; // eslint-disable-line no-unused-expressions
      trackEl.style.animation = "";
      // mantém o nome original
      // (as classes .top/.bottom continuam a aplicar a animação correcta)
    }

    function recalcShift(trackEl){
      const fullWidth = trackEl.scrollWidth;
      const shift = fullWidth / 2; // duplicado
      trackEl.style.setProperty("--shift", shift + "px");
      restartAnimation(trackEl);
    }

    function fillTrack(trackEl, photos){
      trackEl.innerHTML = "";

      // duplicar para loop perfeito
      const seq = photos.concat(photos);

      const imgs = [];
      seq.forEach(src => {
        const { wrap, img } = makeSlide(src);
        imgs.push(img);
        trackEl.appendChild(wrap);
      });

      // calcula shift quando TODAS as imagens estiverem prontas (corrige o “só anda após refresh”)
      let pending = imgs.length;

      const doneOne = () => {
        pending--;
        if (pending <= 0) {
          requestAnimationFrame(() => recalcShift(trackEl));
        }
      };

      imgs.forEach(img => {
        if (img.complete) doneOne();
        else {
          img.addEventListener("load", doneOne, { once: true });
          img.addEventListener("error", doneOne, { once: true });
        }
      });

      // fallback rápido (caso alguma imagem demore muito)
      setTimeout(() => recalcShift(trackEl), 1200);
    }

    function init(){
      fillTrack(document.getElementById("trackTop"), topPhotos);
      fillTrack(document.getElementById("trackBottom"), bottomPhotos);
    }

    // ✅ garante autoplay mesmo no primeiro load
    window.addEventListener("load", init);
    window.addEventListener("resize", init);
  </script>
</body>
</html>
