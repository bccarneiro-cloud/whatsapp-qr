<!DOCTYPE html>
<html lang="pt">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YQN46F71DS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YQN46F71DS');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    :root{
      --gap: 12px;

      /* speeds */
      --speedTop: 26s;
      --speedBottom: 30s;

      /* layout */
      --minLogoBlock: 240px;
      --minSlideBlock: 260px;

      --shadow: 0 18px 55px rgba(0,0,0,0.18);
      --radiusOuter: 26px;
      --radiusInner: 18px;
    }

    *{ box-sizing: border-box; }
    html{ height: -webkit-fill-available; }
    body{
      margin: 0;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      height: -webkit-fill-available;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fff;
    }

    /* subtle background */
    .bg{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 25% 10%, rgba(255,192,203,0.18), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(255,182,193,0.14), transparent 60%),
        #ffffff;
      z-index: -2;
    }

    .page{
      position: fixed;
      inset: 0;
      display: grid;
      gap: var(--gap);
      padding:
        calc(10px + env(safe-area-inset-top))
        12px
        calc(10px + env(safe-area-inset-bottom))
        12px;

      grid-template-rows:
        minmax(var(--minSlideBlock), 2fr)
        minmax(var(--minLogoBlock), 1fr);
    }

    /* ===== SLIDESHOW: COM MOLDURA ===== */
    .slideshow{
      border-radius: var(--radiusOuter);
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      padding: 10px;
      min-height: 0;
    }

    .lane{
      position: relative;
      overflow: hidden;
      border-radius: var(--radiusInner);
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.45);
    }

    .track{
      position: absolute;
      inset: 0;
      display: flex;
      gap: 10px;
      padding: 10px;
      width: max-content;
      align-items: center;
      will-change: transform;
    }

    .lane.top .track{ animation: moveLeft var(--speedTop) linear infinite; }
    .lane.bottom .track{ animation: moveRight var(--speedBottom) linear infinite; }

    @keyframes moveLeft{
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-1 * var(--shift))); }
    }
    @keyframes moveRight{
      from { transform: translateX(calc(-1 * var(--shift))); }
      to   { transform: translateX(0); }
    }

    .slide{
      flex: 0 0 auto;
      height: 100%;
      width: min(46vw, 420px);
      border-radius: var(--radiusInner);
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      background: transparent;
    }

    .slide img{
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    /* ===== BOTTOM: branco total, sem border/card ===== */
    .bottomBar{
      width: 100%;
      height: 100%;
      background: #ffffff;
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0;
      margin: 0;

      display: grid;
      grid-template-rows: 1fr auto;
      align-items: center;
      justify-items: center;
      gap: 10px;
      min-height: 0;
    }

    .logoWrap{
      width: 100%;
      height: 100%;
      display: flex;
      align-items: stretch;
      justify-content: center;
      min-height: 0;
    }

    .logoWrap img{
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ===== CONTACTOS (2 botões) ===== */
    .contactRow{
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 12px 12px 12px;
    }

    .contactGroup{
      width: min(820px, 100%);
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .contactBtn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      flex: 1 1 260px;
      max-width: 420px;

      padding: 14px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 900;

      color: rgba(10,10,10,0.92);
      background: #ffffff;
      border: none;

      box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.08),
        0 10px 24px rgba(0,0,0,0.10);

      -webkit-tap-highlight-color: transparent;
      user-select: none;
      cursor: pointer;

      transition: transform .10s ease, filter .12s ease;
    }

    .contactBtn:hover{ filter: brightness(1.02); }
    .contactBtn:active{ transform: scale(0.985); }

    /* ✅ IMPORTANT: garantir que <button> herda cor e não fica "em branco" */
    button.contactBtn{
      -webkit-appearance: none;
      appearance: none;
      font: inherit;
      color: inherit;
      background: #ffffff;
    }

    .icon{
      width: 20px;
      height: 20px;
      display: inline-block;
      flex: 0 0 auto;
      opacity: .9;
    }

    /* ===== BRILHO sincronizável ===== */
    .glow{
      position: relative;
      animation-name: glowPulse;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    @keyframes glowPulse{
      0%{
        box-shadow:
          inset 0 2px 6px rgba(0,0,0,0.08),
          0 10px 24px rgba(0,0,0,0.10);
      }
      50%{
        box-shadow:
          inset 0 2px 6px rgba(0,0,0,0.08),
          0 14px 34px rgba(255,105,180,0.26);
      }
      100%{
        box-shadow:
          inset 0 2px 6px rgba(0,0,0,0.08),
          0 10px 24px rgba(0,0,0,0.10);
      }
    }

    @media (max-height: 700px){
      :root{
        --minLogoBlock: 210px;
        --minSlideBlock: 240px;
      }
      .slide{ width: min(52vw, 380px); }
      .contactBtn{ padding: 12px 14px; }
      .icon{ width: 19px; height: 19px; }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="page">

    <section class="slideshow" aria-label="Slideshow">
      <div class="lane top">
        <div class="track" id="trackTop"></div>
      </div>

      <div class="lane bottom">
        <div class="track" id="trackBottom"></div>
      </div>
    </section>

    <section class="bottomBar" aria-label="Logo and contacts">
      <div class="logoWrap">
        <img src="./background.png" alt="Little Things" />
      </div>

      <div class="contactRow">
        <div class="contactGroup">

          <!-- Instagram -->
          <a class="contactBtn glow" id="btnInsta"
             href="https://www.instagram.com/little.things.artdecor"
             target="_blank" rel="noopener">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9Zm11.25 1.75a1 1 0 1 1 0 2a1 1 0 0 1 0-2ZM12 7a5 5 0 1 1 0 10a5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6a3 3 0 0 0 0-6Z"/>
            </svg>
            <span>Instagram</span>
          </a>

          <!-- Email (copia) -->
          <button class="contactBtn glow" id="emailBtn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4.2l-8 5.3l-8-5.3V6l8 5.3L20 6v2.2Z"/>
            </svg>
            <span id="emailText">info@littlethings.events</span>
          </button>

        </div>
      </div>
    </section>

  </div>

  <script>
    // ✅ resolve paths corretamente mesmo em subpastas (ex: /site/ )
    const u = (p) => new URL(p, document.baseURI).href;

    const topPhotos = [
      u("./assets/photo01.jpg"),
      u("./assets/photo02.jpg"),
      u("./assets/photo03.jpg"),
      u("./assets/photo04.jpg"),
      u("./assets/photo05.jpg"),
      u("./assets/photo06.jpg"),
      u("./assets/photo07.jpg"),
      u("./assets/photo08.jpg"),
    ];

    const bottomPhotos = [
      u("./assets/photo09.jpg"),
      u("./assets/photo10.jpg"),
      u("./assets/photo11.jpg"),
      u("./assets/photo12.jpg"),
      u("./assets/photo13.jpg"),
      u("./assets/photo14.jpg"),
    ];

    function makeSlide(src){
      const wrap = document.createElement("div");
      wrap.className = "slide";

      const img = document.createElement("img");
      img.src = src;
      img.alt = "Little Things";
      img.loading = "eager";

      wrap.appendChild(img);
      return { wrap, img };
    }

    function restartAnimation(trackEl){
      trackEl.style.animation = "none";
      trackEl.offsetHeight; // force reflow
      trackEl.style.animation = "";
    }

    function recalcShift(trackEl){
      const fullWidth = trackEl.scrollWidth;
      const shift = fullWidth / 2; // duplicado
      trackEl.style.setProperty("--shift", shift + "px");
      restartAnimation(trackEl);
    }

    function fillTrack(trackEl, photos){
      trackEl.innerHTML = "";

      const seq = photos.concat(photos); // duplicar para loop perfeito
      const imgs = [];

      seq.forEach(src => {
        const { wrap, img } = makeSlide(src);
        imgs.push(img);
        trackEl.appendChild(wrap);
      });

      let pending = imgs.length;

      const doneOne = () => {
        pending--;
        if (pending <= 0) requestAnimationFrame(() => recalcShift(trackEl));
      };

      imgs.forEach(img => {
        if (img.complete) doneOne();
        else{
          img.addEventListener("load", doneOne, { once: true });
          img.addEventListener("error", doneOne, { once: true });
        }
      });

      // fallback
      setTimeout(() => recalcShift(trackEl), 1200);
    }

    function parseSeconds(val){
      const s = String(val).trim();
      if (s.endsWith("ms")) return parseFloat(s) / 1000;
      if (s.endsWith("s")) return parseFloat(s);
      const num = parseFloat(s);
      return Number.isFinite(num) ? num : 3.5;
    }

    function syncGlow(){
      const root = getComputedStyle(document.documentElement);
      const speedTop = parseSeconds(root.getPropertyValue("--speedTop")) || 26;

      const btnInsta = document.getElementById("btnInsta");
      const emailBtn = document.getElementById("emailBtn");

      if (!btnInsta || !emailBtn) return;

      btnInsta.style.animationDuration = speedTop + "s";
      emailBtn.style.animationDuration = speedTop + "s";

      // desfasado para parecer orgânico
      btnInsta.style.animationDelay = "0s";
      emailBtn.style.animationDelay = (speedTop / 2) + "s";

      // reiniciar para alinhar
      btnInsta.style.animationName = "none";
      emailBtn.style.animationName = "none";
      btnInsta.offsetHeight;
      emailBtn.offsetHeight;
      btnInsta.style.animationName = "glowPulse";
      emailBtn.style.animationName = "glowPulse";
    }

    function init(){
      const tTop = document.getElementById("trackTop");
      const tBottom = document.getElementById("trackBottom");

      if (tTop) fillTrack(tTop, topPhotos);
      if (tBottom) fillTrack(tBottom, bottomPhotos);

      syncGlow();
      setTimeout(syncGlow, 1300); // após cálculo do shift
    }

    window.addEventListener("load", init);
    window.addEventListener("resize", init);

    // ===== Email: copiar + feedback (sem quebrar slideshow se falhar) =====
    (function bindEmailCopy(){
      const emailBtn = document.getElementById("emailBtn");
      const emailText = document.getElementById("emailText");
      if (!emailBtn || !emailText) return;

      const email = "info@littlethings.events";
      const original = emailText.textContent;

      emailBtn.addEventListener("click", async () => {
        try{
          await navigator.clipboard.writeText(email);
          emailText.textContent = "Copiado / Copied";
          setTimeout(() => { emailText.textContent = original; }, 1600);
        }catch{
          emailText.textContent = "Erro";
          setTimeout(() => { emailText.textContent = original; }, 1600);
        }
      });
    })();
  </script>
</body>
</html>
