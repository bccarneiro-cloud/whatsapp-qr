<!DOCTYPE html>
<html lang="pt">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YQN46F71DS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YQN46F71DS');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">

  <style>
    :root{
      --gap: 12px;
      --speedTop: 26s;
      --speedBottom: 30s;

      --minLogoBlock: 240px;
      --minSlideBlock: 260px;

      --shadow: 0 18px 55px rgba(0,0,0,0.18);
      --radiusOuter: 26px;
      --radiusInner: 18px;

      --btnFont: "Caveat Brush", system-ui, sans-serif;
      --btnSize: 22px;
    }

    *{
      box-sizing: border-box;
    }

    body{
      margin: 0;
      overflow: hidden;
      background: #fff;
      font-family: system-ui, sans-serif;
    }

    .bg{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 25% 10%, rgba(255,192,203,0.18), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(255,182,193,0.14), transparent 60%),
        #ffffff;
      z-index: -2;
    }

    .page{
      position: fixed;
      inset: 0;
      display: grid;
      gap: var(--gap);
      padding: 12px;

      grid-template-rows:
        minmax(var(--minSlideBlock), 2fr)
        minmax(var(--minLogoBlock), 1fr);
    }

    .slideshow{
      border-radius: var(--radiusOuter);
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: var(--shadow);

      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }

    .lane{
      position: relative;
      overflow: hidden;
      border-radius: var(--radiusInner);
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.45);
    }

    .track{
      position: absolute;
      inset: 0;
      display: flex;
      gap: 10px;
      padding: 10px;
      width: max-content;
      align-items: center;
      will-change: transform;
    }

    .lane.top .track{
      animation: moveLeft var(--speedTop) linear infinite;
    }

    .lane.bottom .track{
      animation: moveRight var(--speedBottom) linear infinite;
    }

    @keyframes moveLeft{
      from { transform: translateX(0); }
      to { transform: translateX(calc(-1 * var(--shift))); }
    }

    @keyframes moveRight{
      from { transform: translateX(calc(-1 * var(--shift))); }
      to { transform: translateX(0); }
    }

    .slide{
      position: relative;
      flex: 0 0 auto;
      height: 100%;
      width: min(46vw, 420px);
      border-radius: var(--radiusInner);
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      background: #f3f3f3;
    }

    .slide .bgBlur{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(18px);
      transform: scale(1.08);
      opacity: 0.55;
    }

    .slide .mainImg{
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center;
    }

    .bottomBar{
      width: 100%;
      height: 100%;
      background: #ffffff;

      display: grid;
      grid-template-rows: 1fr auto;
      align-items: center;
      justify-items: center;
      gap: 10px;
    }

    .logoWrap{
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
    }

    .logoWrap img{
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .contactRow{
      width: 100%;
      display: flex;
      justify-content: center;
      padding-bottom: 10px;
    }

    .contactGroup{
      width: min(980px, 100%);
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .contactBtn{
      flex: 1 1 240px;
      max-width: 520px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 14px 16px;
      border-radius: 999px;

      text-decoration: none;
      color: rgba(10,10,10,0.92);
      background: #ffffff;
      border: none;

      font-family: var(--btnFont);
      font-size: var(--btnSize);

      box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.08),
        0 10px 24px rgba(0,0,0,0.10);

      cursor: pointer;
    }

    .icon{
      width: 18px;
      height: 18px;
    }
  </style>
</head>

<body>

<div class="bg"></div>

<div class="page">

  <section class="slideshow">

    <div class="lane top">
      <div class="track" id="trackTop"></div>
    </div>

    <div class="lane bottom">
      <div class="track" id="trackBottom"></div>
    </div>

  </section>

  <section class="bottomBar">

    <div class="logoWrap">
      <img src="./background.png" alt="Little Things">
    </div>

    <div class="contactRow">

      <div class="contactGroup">

        <a class="contactBtn"
           href="https://www.instagram.com/little.things.artdecor"
           target="_blank">

          <span>Instagram</span>
        </a>

        <a class="contactBtn" href="./qr_contact/">
          <span>Contactos / Contacts</span>
        </a>

        <button class="contactBtn" id="emailBtn">
          <span id="emailText">info@littlethings.events</span>
        </button>

      </div>

    </div>

  </section>

</div>

<script>

const topPhotos = [
  "./assets/photo01.jpg",
  "./assets/photo02.jpg",
  "./assets/photo03.jpg",
  "./assets/photo04.jpg",
  "./assets/photo05.jpg",
  "./assets/photo06.jpg",
  "./assets/photo07.jpg",
  "./assets/photo08.jpg",
  "./assets/photo09.jpg",
  "./assets/photo10.jpg",
  "./assets/photo11.jpg",
  "./assets/photo12.jpg",
  "./assets/photo13.jpg",
  "./assets/photo14.jpg",
  "./assets/photo15.jpg",
  "./assets/photo16.jpg",
  "./assets/photo17.jpg",
  "./assets/photo18.jpg",
  "./assets/photo19.jpg",
  "./assets/photo20.jpg",
  "./assets/photo21.jpg",
  "./assets/photo22.jpg",
  "./assets/photo23.jpg",
];

const bottomPhotos = [
  "./assets/photo24.jpg",
  "./assets/photo25.jpg",
  "./assets/photo26.jpg",
  "./assets/photo27.jpg",
  "./assets/photo28.jpg",
  "./assets/photo29.jpg",
  "./assets/photo30.jpg",
  "./assets/photo31.jpg",
  "./assets/photo32.jpg",
  "./assets/photo33.jpg",
  "./assets/photo34.jpg",
  "./assets/photo35.jpg",
  "./assets/photo36.jpg",
  "./assets/photo37.jpg",
  "./assets/photo38.jpg",
  "./assets/photo39.jpg",
  "./assets/photo40.jpg",
  "./assets/photo41.jpg",
  "./assets/photo42.jpg",
  "./assets/photo43.jpg",
  "./assets/photo44.jpg",
  "./assets/photo45.jpg",
  "./assets/photo46.jpg",
];

function shuffleArray(array){
  return array
    .map(value => ({ value, sort: Math.random() }))
    .sort((a, b) => a.sort - b.sort)
    .map(({ value }) => value);
}

function makeSlide(src){

  const wrap = document.createElement("div");
  wrap.className = "slide";

  const bg = document.createElement("img");
  bg.src = src;
  bg.className = "bgBlur";

  const img = document.createElement("img");
  img.src = src;
  img.className = "mainImg";

  wrap.appendChild(bg);
  wrap.appendChild(img);

  return { wrap, img };
}

function restartAnimation(trackEl){
  trackEl.style.animation = "none";
  trackEl.offsetHeight;
  trackEl.style.animation = "";
}

function recalcShift(trackEl){
  const fullWidth = trackEl.scrollWidth;
  const shift = fullWidth / 2;

  trackEl.style.setProperty("--shift", shift + "px");

  restartAnimation(trackEl);
}

function fillTrack(trackEl, photos){

  trackEl.innerHTML = "";

  const randomPhotos = shuffleArray(photos);
  const seq = randomPhotos.concat(randomPhotos);

  const imgs = [];

  seq.forEach(src => {

    const { wrap, img } = makeSlide(src);

    imgs.push(img);

    trackEl.appendChild(wrap);
  });

  let pending = imgs.length;

  const doneOne = () => {

    pending--;

    if (pending <= 0){

      requestAnimationFrame(() => recalcShift(trackEl));
    }
  };

  imgs.forEach(img => {

    if (img.complete){

      doneOne();

    }else{

      img.addEventListener("load", doneOne, { once: true });
      img.addEventListener("error", doneOne, { once: true });
    }
  });

  setTimeout(() => recalcShift(trackEl), 1200);
}

function init(){

  fillTrack(document.getElementById("trackTop"), topPhotos);

  fillTrack(document.getElementById("trackBottom"), bottomPhotos);
}

window.addEventListener("load", init);

window.addEventListener("resize", init);

</script>

</body>
</html>
