<!DOCTYPE html>
<html lang="pt">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YQN46F71DS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YQN46F71DS');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">

  <style>
    :root{
      --gap: 12px;

      --speedTop: 26s;
      --speedBottom: 30s;

      --minLogoBlock: 240px;
      --minSlideBlock: 260px;

      --shadow: 0 18px 55px rgba(0,0,0,0.18);
      --radiusOuter: 26px;
      --radiusInner: 18px;

      --btnFont: "Caveat Brush", system-ui, sans-serif;
    }

    *{ box-sizing: border-box; }
    html{ height: -webkit-fill-available; }

    body{
      margin: 0;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      height: -webkit-fill-available;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background: #fff;
    }

    .bg{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 25% 10%, rgba(255,192,203,0.18), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(255,182,193,0.14), transparent 60%),
        #ffffff;
      z-index: -2;
    }

    .page{
      position: fixed;
      inset: 0;
      display: grid;
      gap: var(--gap);
      padding:
        calc(10px + env(safe-area-inset-top))
        12px
        calc(10px + env(safe-area-inset-bottom))
        12px;

      grid-template-rows:
        minmax(var(--minSlideBlock), 2fr)
        minmax(var(--minLogoBlock), 1fr);
    }

    /* ===== SLIDESHOW ===== */
    .slideshow{
      border-radius: var(--radiusOuter);
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.45);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      padding: 10px;
    }

    .lane{
      position: relative;
      overflow: hidden;
      border-radius: var(--radiusInner);
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.45);
    }

    .track{
      position: absolute;
      inset: 0;
      display: flex;
      gap: 10px;
      padding: 10px;
      width: max-content;
      align-items: center;
      will-change: transform;
    }

    .lane.top .track{ animation: moveLeft var(--speedTop) linear infinite; }
    .lane.bottom .track{ animation: moveRight var(--speedBottom) linear infinite; }

    @keyframes moveLeft{
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-1 * var(--shift))); }
    }
    @keyframes moveRight{
      from { transform: translateX(calc(-1 * var(--shift))); }
      to   { transform: translateX(0); }
    }

    .slide{
      flex: 0 0 auto;
      height: 100%;
      width: min(46vw, 420px);
      border-radius: var(--radiusInner);
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
    }

    .slide img{
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ===== BOTTOM ===== */
    .bottomBar{
      background: #fff;
      display: grid;
      grid-template-rows: 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .logoWrap img{
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .contactRow{
      display: flex;
      justify-content: center;
      padding: 0 12px 10px;
    }

    .contactGroup{
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .contactBtn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      padding: 14px 18px;
      border-radius: 999px;
      background: #fff;
      border: none;
      cursor: pointer;
      text-decoration: none;

      font-family: var(--btnFont);
      font-weight: 400;
      font-size: 22px;
      line-height: 1.05;

      box-shadow:
        inset 0 2px 6px rgba(0,0,0,.08),
        0 10px 24px rgba(0,0,0,.10);
    }

    /* 🔧 AJUSTE APENAS DO EMAIL (visual) */
    #emailText{
      font-size: 24px;
    }

    .icon{
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .glow{
      animation: glowPulse 26s ease-in-out infinite;
    }

    @keyframes glowPulse{
      0%,100%{
        box-shadow:
          inset 0 2px 6px rgba(0,0,0,.08),
          0 10px 24px rgba(0,0,0,.10);
      }
      50%{
        box-shadow:
          inset 0 2px 6px rgba(0,0,0,.08),
          0 14px 34px rgba(255,105,180,.22);
      }
    }
  </style>
</head>

<body>
<div class="bg"></div>

<div class="page">

  <section class="slideshow">
    <div class="lane top"><div class="track" id="trackTop"></div></div>
    <div class="lane bottom"><div class="track" id="trackBottom"></div></div>
  </section>

  <section class="bottomBar">
    <div class="logoWrap">
      <img src="./background.png" alt="Little Things">
    </div>

    <div class="contactRow">
      <div class="contactGroup">

        <a class="contactBtn glow"
           href="https://www.instagram.com/little.things.artdecor"
           target="_blank">
          <span>Instagram</span>
        </a>

        <a class="contactBtn glow" href="./qr_contact/">
          <span>Contactos / Contacts</span>
        </a>

        <button class="contactBtn glow" id="emailBtn">
          <span id="emailText">info@littlethings.events</span>
        </button>

      </div>
    </div>
  </section>

</div>

<script>
  const topPhotos = [
    "./assets/photo01.jpg","./assets/photo02.jpg","./assets/photo03.jpg",
    "./assets/photo04.jpg","./assets/photo05.jpg","./assets/photo06.jpg",
    "./assets/photo07.jpg","./assets/photo08.jpg"
  ];
  const bottomPhotos = [
    "./assets/photo09.jpg","./assets/photo10.jpg","./assets/photo11.jpg",
    "./assets/photo12.jpg","./assets/photo13.jpg","./assets/photo14.jpg"
  ];

  function fillTrack(track, photos){
    track.innerHTML = "";
    const seq = photos.concat(photos);
    seq.forEach(src=>{
      const d=document.createElement("div");
      d.className="slide";
      const i=document.createElement("img");
      i.src=src;
      d.appendChild(i);
      track.appendChild(d);
    });
    track.style.setProperty("--shift", track.scrollWidth/2+"px");
  }

  fillTrack(trackTop, topPhotos);
  fillTrack(trackBottom, bottomPhotos);

  const emailBtn = document.getElementById("emailBtn");
  const emailText = document.getElementById("emailText");
  const original = emailText.textContent;

  emailBtn.onclick = async () => {
    try{
      await navigator.clipboard.writeText(original);
      emailText.textContent = "Copiado / Copied";
      setTimeout(()=>emailText.textContent=original,1500);
    }catch{}
  };
</script>
</body>
</html>
