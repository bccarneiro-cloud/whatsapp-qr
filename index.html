<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    :root{
      --speed: 60s;         /* velocidade do loop (menor = mais rápido) */
      --topH: 67vh;         /* slideshow 2/3 */
      --bottomH: 33vh;      /* logo 1/3 */
      --gap: 0px;           /* distância entre fotos */
      --tileW-desktop: 25vw;/* largura de cada “tile” no desktop */
      --tileW-mobile: 50vw; /* largura de cada “tile” no mobile */
    }

    *{ margin:0; padding:0; box-sizing:border-box; }
    html,body{ width:100%; height:100%; overflow:hidden; background:#fff; }

    .page{
      height:100vh;
      display:flex;
      flex-direction:column;
      background:#fff;
    }

    /* ================= TOP (2 linhas) ================= */
    .slides{
      height: var(--topH);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:#fff;
    }

    .row{
      height:50%;
      overflow:hidden;
      background:#fff;
    }

    .track{
      display:flex;
      width:max-content;
      gap: var(--gap);
      animation: scroll var(--speed) linear infinite;
      will-change: transform;
    }

    .row.reverse .track{
      animation-direction: reverse;
    }

    /* ✅ cada tile tem largura fixa -> imagem pode “caber” sem crop */
    .tile{
      height:100%;
      flex: 0 0 auto;
      width: var(--tileW-desktop);
      display:flex;
      align-items:stretch;
      justify-content:stretch;
      background: transparent;
      line-height:0;
    }

    /* ✅ SEM ZOOM / SEM CORTE */
    .tile img{
      width:100% !important;
      height:100% !important;
      display:block;
      background: transparent;

      object-fit: contain !important;  /* mostra a foto inteira */
      object-position: center center;
      transform: none !important;      /* mata qualquer scale */
      filter: none !important;
    }

    @keyframes scroll{
      from{ transform: translateX(0); }
      to{ transform: translateX(-50%); }
    }

    /* Mobile: tiles maiores (2 por ecrã) */
    @media (max-width: 768px){
      .tile{ width: var(--tileW-mobile); }
    }

    /* ================= BOTTOM (logo + botão) ================= */
    .logoWrap{
      height: var(--bottomH);
      background:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      /* ✅ safe area (iPhone) para não cortar em baixo */
      padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
      overflow: visible; /* ✅ não cortar o botão */
      gap: 10px;
    }

    /* logo ocupa o máximo possível sem empurrar o botão para fora */
    .logo{
      flex: 1 1 auto;
      width: 100%;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 0; /* importante para flex não “rebentar” */
    }

    .logo img{
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      display:block;
    }

    /* botão sempre visível */
    .cta{
      flex: 0 0 auto;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 800;
      background: #ffd6e6;
      color: #6a1b4d;
      text-decoration: none;
      animation: flash 1.2s infinite;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
    }

    @keyframes flash{
      0%,100%{ opacity:1; }
      50%{ opacity:.6; }
    }
  </style>
</head>
