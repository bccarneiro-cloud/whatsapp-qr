<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    :root{
      /* Proporções */
      --slideshowRatio: 0.66;  /* ~2/3 */
      --logoRatio: 0.34;       /* ~1/3 */

      /* Ajustes visuais */
      --gap: 12px;
      --radius: 18px;
      --shadow: 0 18px 55px rgba(0,0,0,0.18);

      /* Velocidades */
      --speedTop: 26s;
      --speedBottom: 30s;

      /* Altura mínima do bloco de logo+botão (para não ficar esmagado) */
      --minLogoBlock: 240px;

      /* Altura mínima slideshow (se o ecrã for pequeno, isto manda) */
      --minSlideBlock: 260px;

      --glassBg: rgba(255,255,255,0.35);
      --glassBorder: rgba(255,255,255,0.55);
    }

    *{ box-sizing: border-box; }
    html{ height: -webkit-fill-available; }
    body{
      margin: 0;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      height: -webkit-fill-available;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fff;
    }

    /* Fundo leve para não “matar” o logo */
    .bg{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 25% 10%, rgba(255,192,203,0.18), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(255,182,193,0.14), transparent 60%),
        #ffffff;
      z-index: -2;
    }

    /* Layout total: slideshow em cima, logo+botão em baixo */
    .page{
      position: fixed;
      inset: 0;
      display: grid;
      gap: var(--gap);
      padding:
        calc(10px + env(safe-area-inset-top))
        12px
        calc(10px + env(safe-area-inset-bottom))
        12px;

      /* Vamos usar “fr” mas com travões por min-height */
      grid-template-rows:
        minmax(var(--minSlideBlock), 2fr)
        minmax(var(--minLogoBlock), 1fr);
    }

    /* ======= SLIDESHOW (2 linhas) ======= */
    .slideshow{
      border-radius: 26px;
      overflow: hidden;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 10px;
      padding: 10px;
      min-height: 0;
    }

    .lane{
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: rgba(255,255,255,0.25);
      border: 1px solid rgba(255,255,255,0.45);
    }

    .track{
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      display: flex;
      gap: 10px;
      padding: 10px;
      width: max-content;
      will-change: transform;
      align-items: center;
    }

    /* Animações: topo vai para a esquerda */
    .lane.top .track{
      animation: moveLeft var(--speedTop) linear infinite;
    }

    /* baixo vai para a direita */
    .lane.bottom .track{
      animation: moveRight var(--speedBottom) linear infinite;
    }

    @keyframes moveLeft{
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-1 * var(--shift))); }
    }
    @keyframes moveRight{
      from { transform: translateX(calc(-1 * var(--shift))); }
      to   { transform: translateX(0); }
    }

    /* Cada foto: queremos ver a foto “normal” sem zoom */
    .slide{
      flex: 0 0 auto;
      height: 100%;
      width: min(46vw, 420px); /* “cartões” largos, ajusta se quiseres */
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0,0,0,0.18);
      background: #fff;
    }

    .slide img{
      width: 100%;
      height: 100%;
      display: block;

      /* IMPORTANT: sem zoom / sem cortar */
      object-fit: contain;
      object-position: center;
      background: #fff; /* evita “faixas” com transparência estranha */
    }

    /* ======= LOGO (1/3) + BOTÃO ABAIXO ======= */
    .logoBlock{
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 10px;
      min-height: 0;
    }

    .logoCard{
      border-radius: 26px;
      overflow: hidden;
      background: var(--glassBg);
      border: 1px solid var(--glassBorder);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px; /* se quiseres mesmo colado mete 0 */
      min-height: 0;
    }

    .logoCard img{
      width: 100%;
      height: 100%;
      object-fit: contain;   /* logo completo */
      display: block;
    }

    .contactRow{
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contactBtn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: min(520px, 100%);
      padding: 14px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 900;
      color: rgba(10,10,10,0.92);
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.55);
      box-shadow: 0 14px 40px rgba(0,0,0,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .contactBtn:active{ transform: scale(0.985); }

    /* Em ecrãs muito baixos, garantimos que o botão não sai fora */
    @media (max-height: 700px){
      :root{
        --minLogoBlock: 210px;
        --minSlideBlock: 240px;
      }
      .slide{ width: min(52vw, 380px); }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="page">

    <!-- Slideshow 2 linhas (2/3 do ecrã) -->
    <section class="slideshow" aria-label="Slideshow">
      <div class="lane top">
        <div class="track" id="trackTop"></div>
      </div>

      <div class="lane bottom">
        <div class="track" id="trackBottom"></div>
      </div>
    </section>

    <!-- Logo 1/3 + caixa contactos imediatamente abaixo -->
    <section class="logoBlock" aria-label="Logo e contactos">
      <div class="logoCard">
        <img src="./background.png" alt="Little Things" />
      </div>

      <div class="contactRow">
        <a class="contactBtn" href="./qr_contact/">Contactos / Contacts</a>
      </div>
    </section>

  </div>

  <script>
    // Ajusta aqui se os teus ficheiros não forem .jpg
    const topPhotos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
    ];

    const bottomPhotos = [
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg",
    ];

    function makeSlide(src){
      const wrap = document.createElement("div");
      wrap.className = "slide";

      const img = document.createElement("img");
      img.src = src;
      img.alt = "Little Things";

      wrap.appendChild(img);
      return wrap;
    }

    function fillTrack(trackEl, photos){
      trackEl.innerHTML = "";

      // Duplicamos a sequência para rolar em loop
      const seq = photos.concat(photos);

      seq.forEach(src => trackEl.appendChild(makeSlide(src)));

      // depois de render, calculamos quanto tem de “andar”
      requestAnimationFrame(() => {
        const fullWidth = trackEl.scrollWidth;
        const shift = fullWidth / 2; // metade porque duplicámos
        trackEl.style.setProperty("--shift", shift + "px");
      });
    }

    function init(){
      fillTrack(document.getElementById("trackTop"), topPhotos);
      fillTrack(document.getElementById("trackBottom"), bottomPhotos);
    }

    init();

    // Recalcular em resize/orientação
    window.addEventListener("resize", init);
  </script>

</body>
</html>
