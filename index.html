<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    html { height: -webkit-fill-available; }
    body{
      margin:0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#fff;
    }

    /* Slideshow por cima (fotos 100% opacas) */
    .slideshow{
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background:#fff;
    }

    .slide{
      position:absolute;
      inset:0;
      opacity: 0;
      transition: opacity 1.2s ease;
      will-change: opacity;
    }
    .slide.active{ opacity: 1; }

    .slide img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      /* ✅ sem zoom / sem animação */
      transform: none;
      animation: none;
      filter: none;
    }

    /* Logo fixo em baixo (sem esticar) */
    .logo-fixed-bottom{
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom) + 10px);
      height: min(32vh, 280px);     /* ocupa só parte inferior */
      z-index: 2;
      pointer-events: none;

      background-image: url("./background.png");
      background-repeat: no-repeat;
      background-position: center bottom;
      background-size: contain;

      /* Para ficar bem “limpo” por cima das fotos */
      filter: none;
    }

    /* Um gradiente leve para dar contraste ao logo sem “apagar” as fotos */
    .logo-fade{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 38vh;
      z-index: 2;
      pointer-events: none;

      background: linear-gradient(
        to top,
        rgba(255,255,255,0.85),
        rgba(255,255,255,0.35),
        rgba(255,255,255,0)
      );
    }

    /* Botão no topo */
    .corner{
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      z-index: 10;
    }

    .corner a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 12px 14px;
      border-radius: 999px;
      text-decoration:none;
      font-weight: 900;
      font-size: 13px;
      color: rgba(10,10,10,.92);
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 14px 40px rgba(0,0,0,.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .corner a:active{ transform: scale(.98); }

    /* Evitar flash inicial */
    .loadingCover{
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #fff;
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events:none;
    }
    .loadingCover.show{ opacity: 1; }
  </style>
</head>

<body>
  <div class="slideshow" id="slideshow" aria-hidden="true"></div>

  <!-- leve “fade” inferior para o logo ficar sempre legível -->
  <div class="logo-fade" aria-hidden="true"></div>
  <!-- logo fixo em baixo -->
  <div class="logo-fixed-bottom" aria-hidden="true"></div>

  <div class="corner">
    <a href="./qr_contact/">Contactos / Contacts</a>
  </div>

  <div class="loadingCover" id="loadingCover"></div>

  <script>
    // 14 fotos (em /assets/) com nomes EXACTOS: photo01.jpg ... photo14.jpg
    const photos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg"
    ];

    const container = document.getElementById("slideshow");
    const loadingCover = document.getElementById("loadingCover");

    function preload(src){
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(src);
        img.onerror = () => reject(src);
        img.src = src;
      });
    }

    function createSlides(list){
      return list.map((src, idx) => {
        const s = document.createElement("div");
        s.className = "slide";
        const img = document.createElement("img");
        img.src = src;
        img.alt = "Work " + (idx + 1);
        s.appendChild(img);
        container.appendChild(s);
        return s;
      });
    }

    function startSlideshow(slides){
      let idx = 0;
      const INTERVAL = 4500;

      const show = (i) => {
        slides.forEach(s => s.classList.remove("active"));
        slides[i].classList.add("active");
      };

      show(idx);

      setInterval(() => {
        idx = (idx + 1) % slides.length;
        show(idx);
      }, INTERVAL);
    }

    (async function init(){
      loadingCover.classList.add("show");

      // garante que pelo menos uma imagem carrega antes de começar
      try{
        await preload(photos[0]);
      }catch(e){
        // tenta encontrar uma que carregue
        for (let i = 1; i < photos.length; i++){
          try{
            await preload(photos[i]);
            const ok = photos.splice(i,1)[0];
            photos.unshift(ok);
            break;
          }catch(_){}
        }
      }

      const slides = createSlides(photos);

      // preload das próximas 2 (suave)
      Promise.allSettled([preload(photos[1]), preload(photos[2])]);

      loadingCover.classList.remove("show");
      startSlideshow(slides);
    })();
  </script>
</body>
</html>
