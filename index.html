<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Little Things</title>

<style>
:root{
  --speed: 52s;          /* +15% vs 60s */
  --tileW: 320px;        /* largura de cada foto (desktop) */
  --tileWMobile: 240px;  /* largura de cada foto (mobile) */
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont}

.page{
  display:grid;
  grid-template-rows: 2fr 1fr;
  height:100vh;
  background:#000;
}

/* ================= SLIDES ================= */
.slides{
  overflow:hidden;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:0;
}

.row{
  overflow:hidden;
  white-space:nowrap;
  height:50%;
}

.track{
  display:flex;
  width:max-content;
  animation: scroll var(--speed) linear infinite;
}

.row.reverse .track{
  animation-direction: reverse;
}

/* TILE = evita cortes/zoom: foto inteira dentro de um bloco fixo */
.tile{
  width:var(--tileW);
  height:100%;
  flex:0 0 var(--tileW);
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;  /* sem “linhas”/separações */
}

.tile img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;   /* foto inteira, SEM crop */
  display:block;
}

/* animação */
@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* ================= LOGO ================= */
.logoWrap{
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:0;
}

.logoWrap img{
  max-height:100%;
  max-width:100%;
  object-fit:contain;
}

/* BOTÃO CONTACTOS */
.cta{
  margin-top:10px;
  border:0;
  border-radius:999px;
  padding:14px 22px;
  font-size:18px;
  font-weight:800;
  letter-spacing:.3px;
  color:#0f3d2e;
  background:#ffd6e6;
  box-shadow:0 18px 45px rgba(0,0,0,.12);
  text-decoration:none;
  animation:flash 1.2s infinite;
}

@keyframes flash{
  0%,100%{opacity:1}
  50%{opacity:.55}
}

/* ================= MOBILE ================= */
@media (max-width:768px){
  .page{
    grid-template-rows: 2.2fr 0.8fr;
  }

  .logoWrap{
    padding-bottom:6vh; /* evita corte no fundo */
  }

  .tile{
    width:var(--tileWMobile);
    flex-basis:var(--tileWMobile);
  }
}
</style>
</head>

<body>
<div class="page">

  <!-- SLIDES -->
  <div class="slides">

    <!-- LINHA 1 -->
    <div class="row">
      <div class="track">

        <div class="tile"><img src="assets/photo01.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo02.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo03.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo04.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo05.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo06.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo07.jpg" alt=""></div>

        <!-- DUPLICADO PARA LOOP -->
        <div class="tile"><img src="assets/photo01.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo02.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo03.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo04.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo05.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo06.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo07.jpg" alt=""></div>

      </div>
    </div>

    <!-- LINHA 2 -->
    <div class="row reverse">
      <div class="track">

        <div class="tile"><img src="assets/photo08.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo09.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo10.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo11.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo12.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo13.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo14.jpg" alt=""></div>

        <!-- DUPLICADO PARA LOOP -->
        <div class="tile"><img src="assets/photo08.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo09.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo10.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo11.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo12.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo13.jpg" alt=""></div>
        <div class="tile"><img src="assets/photo14.jpg" alt=""></div>

      </div>
    </div>

  </div>

  <!-- LOGO -->
  <div class="logoWrap">
    <img src="background.png" alt="Little Things">
    <a class="cta" href="https://www.littlethings.events/qr_contact/">
      Contactos / Contacts
    </a>
  </div>

</div>
</body>
</html>
