<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      touch-action: none;
    }

    .page {
      height: 100svh;
      height: 100dvh;
      display: grid;
      grid-template-rows: 2fr 1fr;
    }

    /* ===== STRIPS ===== */
    .strips {
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .strip {
      height: 50%;
      overflow: hidden;
      position: relative;
      user-select: none;
      touch-action: pan-x;
      background: #000;
    }

    .track {
      height: 100%;
      display: flex;
      gap: 0;
      will-change: transform;
      transform: translate3d(0,0,0);
      backface-visibility: hidden;
    }

    .item {
      height: 100%;
      flex: 0 0 auto;
    }

    .item img {
      height: 100%;
      width: auto;
      display: block;
      object-fit: cover;
      transform: translateZ(0);
    }

    /* ===== LOGO ===== */
    .logoArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      background: #fff;
      overflow: hidden;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
      padding-top: 10px;
      gap: 14px;
    }

    .logoArea img {
      max-height: 78%;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* ===== CONTACT BUTTON ===== */
    .contactBtn {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 22px;
      border: 1px solid currentColor;
      background: transparent;
      color: #000;
      cursor: pointer;
      animation: flash 2.5s ease-in-out infinite;
    }

    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {
      .logoArea {
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 36px);
      }

      .logoArea img {
        max-height: 72%;
      }

      .contactBtn {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
<div class="page">

  <div class="strips">

    <!-- STRIP 1 -->
    <div class="strip" data-strip="0">
      <div class="track" id="track1">
        <!-- A -->
        <div class="item"><img src="assets/photo01.jpg"></div>
        <div class="item"><img src="assets/photo02.jpg"></div>
        <div class="item"><img src="assets/photo03.jpg"></div>
        <div class="item"><img src="assets/photo04.jpg"></div>
        <div class="item"><img src="assets/photo05.jpg"></div>
        <div class="item"><img src="assets/photo06.jpg"></div>
        <div class="item"><img src="assets/photo07.jpg"></div>
        <!-- B -->
        <div class="item"><img src="assets/photo01.jpg"></div>
        <div class="item"><img src="assets/photo02.jpg"></div>
        <div class="item"><img src="assets/photo03.jpg"></div>
        <div class="item"><img src="assets/photo04.jpg"></div>
        <div class="item"><img src="assets/photo05.jpg"></div>
        <div class="item"><img src="assets/photo06.jpg"></div>
        <div class="item"><img src="assets/photo07.jpg"></div>
      </div>
    </div>

    <!-- STRIP 2 (⚠️ photo14 duplicada EXTRA) -->
    <div class="strip" data-strip="1">
      <div class="track" id="track2">
        <!-- A -->
        <div class="item"><img src="assets/photo08.jpg"></div>
        <div class="item"><img src="assets/photo09.jpg"></div>
        <div class="item"><img src="assets/photo10.jpg"></div>
        <div class="item"><img src="assets/photo11.jpg"></div>
        <div class="item"><img src="assets/photo12.jpg"></div>
        <div class="item"><img src="assets/photo13.jpg"></div>
        <div class="item"><img src="assets/photo14.jpg"></div>

        <!-- B -->
        <div class="item"><img src="assets/photo08.jpg"></div>
        <div class="item"><img src="assets/photo09.jpg"></div>
        <div class="item"><img src="assets/photo10.jpg"></div>
        <div class="item"><img src="assets/photo11.jpg"></div>
        <div class="item"><img src="assets/photo12.jpg"></div>
        <div class="item"><img src="assets/photo13.jpg"></div>
        <div class="item"><img src="assets/photo14.jpg"></div>

        <!-- EXTRA anti-gap -->
        <div class="item"><img src="assets/photo14.jpg"></div>
      </div>
    </div>

  </div>

  <!-- LOGO + CONTACT -->
  <div class="logoArea">
    <img src="background.png" alt="Little Things logo">
    <button class="contactBtn">Contactos / Contacts</button>
  </div>

</div>

<script>
  /* ===== Movimento contínuo + drag ===== */
  const strips = [
    { el: track1, dir: -1, speed: 60, x: 0, halfW: 0, dragging:false, lastX:0, lastTs:0 },
    { el: track2, dir:  1, speed: 60, x: 0, halfW: 0, dragging:false, lastX:0, lastTs:0 }
  ];

  function measureHalf(el){
    const items = [...el.children];
    const half = Math.floor(items.length / 2);
    return items.slice(0, half).reduce((w,i)=>w+i.getBoundingClientRect().width,0);
  }

  function measure(){
    strips.forEach(s=>{
      s.halfW = Math.round(measureHalf(s.el));
    });
  }

  function render(s){
    const tx = s.dir === -1 ? -s.x : -(s.halfW - s.x);
    s.el.style.transform = `translate3d(${Math.round(tx)}px,0,0)`;
  }

  let last = performance.now();
  function loop(t){
    const dt = (t-last)/1000; last=t;
    strips.forEach(s=>{
      if(!s.dragging && (t-s.lastTs)>1000){
        s.x = (s.x + s.speed*dt) % s.halfW;
        render(s);
      }
    });
    requestAnimationFrame(loop);
  }

  document.querySelectorAll('.strip').forEach((strip,i)=>{
    const s = strips[i];
    strip.addEventListener('pointerdown',e=>{
      s.dragging=true; s.lastX=e.clientX; s.lastTs=performance.now();
      strip.setPointerCapture(e.pointerId);
    });
    strip.addEventListener('pointermove',e=>{
      if(!s.dragging) return;
      const dx=e.clientX-s.lastX; s.lastX=e.clientX;
      s.x=(s.x-dx*s.dir)%s.halfW; s.lastTs=performance.now();
      render(s);
    });
    strip.addEventListener('pointerup',()=>{s.dragging=false; s.lastTs=performance.now();});
    strip.addEventListener('pointercancel',()=>{s.dragging=false; s.lastTs=performance.now();});
  });

  window.addEventListener('load',()=>{
    setTimeout(()=>{ measure(); requestAnimationFrame(loop); },120);
  });
  window.addEventListener('resize',()=>setTimeout(measure,80));
</script>
</body>
</html>
