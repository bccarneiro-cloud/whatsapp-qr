<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    html { height: -webkit-fill-available; }
    body{
      margin:0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fff;
    }

    /* Fundo base suave */
    .base{
      position: fixed;
      inset: 0;
      z-index: -5;
      background:
        radial-gradient(900px 600px at 20% 25%, rgba(255,120,180,.10), transparent 60%),
        radial-gradient(900px 600px at 80% 30%, rgba(90,220,255,.08), transparent 58%),
        #ffffff;
    }

    /* LOGO ORIGINAL (sem deturpar) */
    .logo-bg{
      position: fixed;
      inset: 0;
      z-index: -4;
      background: url("./background.png") center/contain no-repeat;
      opacity: .95;              /* logo bem visível */
      pointer-events:none;
    }

    /* Slideshow por cima */
    .slideshow{
      position: fixed;
      inset: 0;
      z-index: -3;
      overflow: hidden;
    }

    .slide{
      position:absolute;
      inset:0;
      opacity: 0;
      transition: opacity 1.2s ease;
      will-change: opacity, transform;
    }

    /* Foto ocupa a tela mas sem “puxar” o logo */
    .slide::before{
      content:"";
      position:absolute;
      inset:0;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;

      /* Ken Burns suave (zoom muito leve) */
      transform: scale(1.05);
      animation: kenburns 10s ease-in-out infinite;
      filter: saturate(1.02) contrast(1.02);
    }

    @keyframes kenburns{
      0%   { transform: scale(1.05) translate3d(0,0,0); }
      50%  { transform: scale(1.10) translate3d(-1%, -1%, 0); }
      100% { transform: scale(1.05) translate3d(0,0,0); }
    }

    .slide.active{
      opacity: 1;
    }

    /* Overlay para manter o logo sempre legível */
    .overlay{
      position: fixed;
      inset:0;
      z-index: -2;
      background:
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.35), rgba(255,255,255,.55)),
        linear-gradient(to bottom, rgba(255,255,255,.18), rgba(255,255,255,.30));
      pointer-events:none;
    }

    /* Um brilho muito leve para ficar premium */
    .glass{
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events:none;
      background: radial-gradient(circle at 50% 55%, rgba(255,255,255,.12), transparent 55%);
    }

    /* (Opcional) Link pequeno para o QR */
    .corner{
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      z-index: 5;
    }

    .corner a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 10px 12px;
      border-radius: 999px;
      text-decoration:none;
      font-weight: 800;
      font-size: 12px;
      color: rgba(10,10,10,.92);
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 14px 40px rgba(0,0,0,.10);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
  </style>
</head>

<body>
  <div class="base"></div>
  <div class="logo-bg" aria-hidden="true"></div>

  <div class="slideshow" id="slideshow" aria-hidden="true"></div>

  <div class="overlay" aria-hidden="true"></div>
  <div class="glass" aria-hidden="true"></div>

  <!-- Se NÃO quiseres isto, apaga esta div inteira -->
  <div class="corner">
    <a href="./qr_contact/">WhatsApp QR</a>
  </div>

  <script>
    // 14 fotos (em /assets/)
    const photos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg"
    ];

    const container = document.getElementById("slideshow");

    // criar slides
    const slides = photos.map((src) => {
      const s = document.createElement("div");
      s.className = "slide";
      s.style.setProperty("--img", `url("${src}")`);
      s.style.setProperty("opacity", "0");
      s.style.setProperty("transform", "translateZ(0)");

      // aplicar imagem no ::before
      s.style.setProperty("--bg", `url("${src}")`);
      s.style.setProperty("pointer-events", "none");
      s.style.setProperty("will-change", "opacity");

      // hack: set background no ::before via style sheet inline
      s.style.setProperty("--src", src);
      s.style.setProperty("display", "block");
      s.style.setProperty("position", "absolute");

      // define background da pseudo-element via style tag em runtime (mais simples)
      s.dataset.src = src;
      container.appendChild(s);
      return s;
    });

    // Inject CSS backgrounds para os ::before (para manter o HTML simples)
    const style = document.createElement("style");
    style.textContent = slides.map((s, i) => {
      const src = s.dataset.src.replace(/"/g, '\\"');
      return `.slide:nth-child(${i+1})::before{ background-image: url("${src}"); }`;
    }).join("\n");
    document.head.appendChild(style);

    let idx = 0;
    const INTERVAL = 4500; // tempo entre fotos

    function show(i){
      slides.forEach((s) => s.classList.remove("active"));
      slides[i].classList.add("active");
    }

    show(idx);

    setInterval(() => {
      idx = (idx + 1) % slides.length;
      show(idx);
    }, INTERVAL);
  </script>
</body>
</html>
