<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things • Art & Decor</title>

  <style>
    :root{
      --text: rgba(18,18,18,.92);
      --glass: rgba(255,255,255,.22);
      --glassBorder: rgba(255,255,255,.35);
      --shadow: 0 18px 55px rgba(0,0,0,.20);
      --overlayTop: rgba(255,255,255,.06);
      --overlayBottom: rgba(0,0,0,.18);
    }

    html { height: -webkit-fill-available; }
    body{
      margin:0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: #fff;
      overflow-x:hidden;
    }

    /* ----- BG: slideshow fotos ----- */
    .hero{
      position: fixed;
      inset: 0;
      z-index: -5;
      overflow: hidden;
      background: #fff;
    }

    .hero .slide{
      position:absolute;
      inset:0;
      background-position:center;
      background-size: cover;
      background-repeat:no-repeat;
      opacity:0;
      transform: scale(1.04);
      transition: opacity 1.35s ease;
      will-change: opacity, transform;
      filter: saturate(1.05) contrast(1.02);
    }
    .hero .slide.active{ opacity:1; }

    /* ----- BG: marca (background.png) sempre presente ----- */
    .brand{
      position: fixed;
      inset:0;
      z-index:-4;
      background: url("./background.png") center / cover no-repeat;
      opacity:.55;
      pointer-events:none;
    }

    /* no desktop evita “esticado” do logo */
    @media (min-width: 980px){
      .brand{
        background: url("./background.png") center / contain no-repeat;
        opacity:.55;
      }
    }

    /* overlay para manter legível sem apagar o logo */
    .overlay{
      position: fixed;
      inset:0;
      z-index:-3;
      background: radial-gradient(
        circle at 50% 30%,
        var(--overlayTop),
        rgba(255,255,255,.05) 48%,
        var(--overlayBottom) 100%
      );
      pointer-events:none;
    }

    /* ----- Top bar ----- */
    header{
      position: sticky;
      top: 0;
      z-index: 10;
      padding: calc(14px + env(safe-area-inset-top)) 14px 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(255,255,255,.40), rgba(255,255,255,.10));
      border-bottom: 1px solid rgba(255,255,255,.25);
    }

    .topbar{
      width: min(1100px, 96vw);
      margin: 0 auto;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
    }

    .brandName{
      display:flex;
      flex-direction: column;
      gap: 2px;
    }

    .brandName h1{
      margin:0;
      font-size: 18px;
      letter-spacing: .2px;
      font-weight: 900;
    }

    .brandName p{
      margin:0;
      font-size: 12px;
      opacity: .78;
    }

    .actions{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content:flex-end;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      text-decoration:none;
      font-weight: 900;
      border: 1px solid rgba(255,255,255,.40);
      box-shadow: 0 10px 22px rgba(0,0,0,.10);
      background: rgba(255,255,255,.45);
      color: rgba(10,10,10,.92);
      transition: transform .08s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      white-space: nowrap;
    }
    .btn:hover{ filter: brightness(1.03); }
    .btn:active{ transform: scale(.985); }

    .btn-primary{
      background: rgba(37, 211, 102, .88);
      color:#fff;
      box-shadow: 0 10px 22px rgba(37, 211, 102, .20);
    }

    .ig-icon{
      width: 18px;
      height: 18px;
      object-fit: contain;
      border-radius: 5px;
      animation: igspin 2.8s linear infinite;
    }
    @keyframes igspin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }

    /* ----- Conteúdo ----- */
    main{
      padding: 16px 14px calc(24px + env(safe-area-inset-bottom));
    }

    .wrap{
      width: min(1100px, 96vw);
      margin: 0 auto;
      display:flex;
      flex-direction: column;
      gap: 14px;
    }

    .heroCard{
      background: var(--glass);
      border: 1px solid var(--glassBorder);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .heroCard h2{
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 950;
    }

    .heroCard p{
      margin:0;
      opacity:.82;
      line-height: 1.35;
      font-size: 14px;
      max-width: 70ch;
    }

    /* ----- Galeria ----- */
    .grid{
      display:grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }

    .tile{
      border-radius: 16px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.30);
      background: rgba(255,255,255,.18);
      box-shadow: 0 12px 26px rgba(0,0,0,.12);
      aspect-ratio: 1 / 1;
      position:relative;
      cursor:pointer;
    }

    .tile img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.02);
      transition: transform .25s ease, filter .25s ease;
      filter: saturate(1.04);
    }

    .tile:hover img{
      transform: scale(1.06);
      filter: saturate(1.12);
    }

    /* ----- Modal ----- */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 50;
      padding: 16px;
    }
    .modal.open{ display:flex; }
    .modalBox{
      width: min(980px, 96vw);
      border-radius: 18px;
      overflow:hidden;
      background: rgba(255,255,255,.94);
      box-shadow: 0 24px 80px rgba(0,0,0,.40);
    }
    .modalBar{
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 10px 12px;
      font-weight: 900;
    }
    .close{
      border:none;
      background: rgba(0,0,0,.07);
      padding: 8px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 900;
    }
    .modalBox img{
      width:100%;
      height:auto;
      display:block;
    }

    /* ----- Responsivo ----- */
    @media (max-width: 980px){
      .grid{ grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 520px){
      .grid{ grid-template-columns: repeat(2, 1fr); }
      .brandName h1{ font-size: 16px; }
    }
  </style>
</head>

<body>

  <!-- Background slideshow -->
  <div class="hero" aria-hidden="true">
    <div class="slide active" id="slideA"></div>
    <div class="slide" id="slideB"></div>
  </div>

  <!-- Brand watermark -->
  <div class="brand" aria-hidden="true"></div>

  <!-- Overlay -->
  <div class="overlay" aria-hidden="true"></div>

  <header>
    <div class="topbar">
      <div class="brandName">
        <h1>Little Things</h1>
        <p>Art & Decor • peças personalizadas</p>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="./qr_contact/" title="Abrir WhatsApp QR">WhatsApp QR</a>

        <a class="btn" href="https://www.instagram.com/little.things.artdecor" target="_blank">
          <img class="ig-icon" src="./qr_contact/instagram.gif" alt="Instagram">
          Instagram
        </a>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <div class="heroCard">
        <h2>Decoração com detalhe ✨</h2>
        <p>
          Explora alguns trabalhos recentes. Para encomendas ou informações, abre o WhatsApp QR (botão no topo).
        </p>
      </div>

      <div class="grid" id="grid"></div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modalBox">
      <div class="modalBar">
        <span>Preview</span>
        <button class="close" id="closeBtn">Fechar</button>
      </div>
      <img id="modalImg" alt="Preview">
    </div>
  </div>

  <script>
    // ✅ 14 fotos (mete-as em /assets/ e troca nomes aqui se precisares)
    const photos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg"
    ];

    // ----- Grelha -----
    const grid = document.getElementById("grid");
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const closeBtn = document.getElementById("closeBtn");

    photos.forEach((src) => {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.innerHTML = `<img src="${src}" alt="Work">`;
      tile.addEventListener("click", () => {
        modalImg.src = src;
        modal.classList.add("open");
      });
      grid.appendChild(tile);
    });

    closeBtn.addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("open");
    });

    // ----- Slideshow de fundo -----
    const slideA = document.getElementById("slideA");
    const slideB = document.getElementById("slideB");

    let idx = 0;
    let showingA = true;

    function setBg(el, src){
      el.style.backgroundImage = `url('${src}')`;
    }

    // preload
    setBg(slideA, photos[0]);
    setBg(slideB, photos[1 % photos.length]);

    const intervalMs = 5200;

    setInterval(() => {
      idx = (idx + 1) % photos.length;
      const next = photos[idx];

      if (showingA) {
        setBg(slideB, next);
        slideB.classList.add("active");
        slideA.classList.remove("active");
      } else {
        setBg(slideA, next);
        slideA.classList.add("active");
        slideB.classList.remove("active");
      }
      showingA = !showingA;
    }, intervalMs);
  </script>

</body>
</html>
