<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    :root{
      --glass: rgba(255,255,255,.10);
      --glassBorder: rgba(255,255,255,.18);
      --shadow: 0 22px 70px rgba(0,0,0,.28);
      --shadow2: 0 14px 40px rgba(0,0,0,.22);
      --text: rgba(20,20,20,.92);
      --glow: rgba(255, 80, 170, .22);
      --glow2: rgba(60, 210, 255, .18);
    }

    html{ height: -webkit-fill-available; }
    body{
      margin:0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow:hidden;
      background:#fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      position: relative;
    }

    /* Fundo dinâmico suave */
    .bg{
      position: fixed;
      inset: 0;
      z-index: -6;
      background:
        radial-gradient(1200px 600px at 18% 22%, rgba(255,110,180,.16), transparent 60%),
        radial-gradient(900px 520px at 78% 30%, rgba(90,220,255,.14), transparent 58%),
        radial-gradient(900px 700px at 50% 85%, rgba(255,255,255,.24), transparent 60%),
        #ffffff;
    }

    /* Marca: background.png como watermark (não estica feio no desktop) */
    .brand{
      position: fixed;
      inset: 0;
      z-index: -5;
      background: url("./background.png") center/cover no-repeat;
      opacity: .55;
      pointer-events:none;
      filter: saturate(1.02);
    }
    @media (min-width: 980px){
      .brand{
        background: url("./background.png") center/contain no-repeat;
        opacity: .55;
      }
    }

    /* Glass overlay p/ “futurista” mas sem apagar o laço */
    .overlay{
      position: fixed;
      inset:0;
      z-index:-4;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.06), rgba(0,0,0,.12));
      pointer-events:none;
    }

    /* Container geral (sem header) */
    .stage{
      position: relative;
      width: 100%;
      height: 100%;
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
      box-sizing: border-box;
      display:flex;
      align-items:flex-end;
      justify-content:center;
    }

    /* “Plataforma” onde as cards flutuam */
    .deck{
      width: min(1200px, 96vw);
      height: min(820px, 92svh);
      position: relative;

      border-radius: 26px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      overflow:hidden;
    }

    /* brilho subtil */
    .deck::before{
      content:"";
      position:absolute;
      inset:-40px;
      background:
        radial-gradient(500px 220px at 18% 20%, var(--glow), transparent 65%),
        radial-gradient(520px 240px at 84% 30%, var(--glow2), transparent 65%);
      filter: blur(6px);
      opacity:.85;
      pointer-events:none;
    }

    /* titulo minimal */
    .title{
      position:absolute;
      left: 18px;
      right: 18px;
      top: 14px;
      display:flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 3;
      pointer-events:none;
    }

    .title .left{
      display:flex;
      flex-direction: column;
      gap: 3px;
    }

    .title h1{
      margin:0;
      font-size: 18px;
      letter-spacing: .2px;
      font-weight: 900;
      text-shadow: 0 8px 20px rgba(0,0,0,.08);
    }
    .title p{
      margin:0;
      font-size: 12px;
      opacity:.80;
    }

    /* botão discreto (não é a “caixa” que tinhas) */
    .qrLink{
      pointer-events:auto;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 10px 12px;
      border-radius: 999px;
      text-decoration:none;
      font-weight: 900;
      font-size: 12px;
      color: rgba(10,10,10,.92);
      background: rgba(255,255,255,.35);
      border: 1px solid rgba(255,255,255,.35);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    /* Grid futurista */
    .grid{
      position:absolute;
      left: 14px;
      right: 14px;
      top: 64px;
      bottom: 14px;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      z-index: 2;
    }

    @media (max-width: 980px){
      .grid{ grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 520px){
      .grid{ grid-template-columns: repeat(2, 1fr); }
      .title{ top: 10px; }
      .grid{ top: 58px; }
    }

    .card{
      position: relative;
      border-radius: 18px;
      overflow:hidden;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: var(--shadow2);
      transform: translate3d(0,0,0);
      will-change: transform, filter;
      cursor: pointer;
    }

    /* “futuristic glass highlight” */
    .card::after{
      content:"";
      position:absolute;
      inset:-30%;
      background: linear-gradient(135deg, rgba(255,255,255,.45), transparent 55%);
      transform: translateX(-40%) rotate(8deg);
      opacity: .20;
      pointer-events:none;
    }

    .card img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.05);
      filter: saturate(1.06) contrast(1.03);
      transition: transform .35s ease, filter .35s ease;
    }

    .card:hover img{
      transform: scale(1.10);
      filter: saturate(1.15) contrast(1.06);
    }

    /* movimento contínuo (cada card tem variações via CSS vars) */
    .floaty{
      animation: drift var(--dur, 7.5s) ease-in-out infinite;
    }
    @keyframes drift{
      0%   { transform: translate3d(calc(var(--x,0px) * -1), calc(var(--y,0px) * -1), 0) rotate(calc(var(--r, 0deg) * -1)); }
      50%  { transform: translate3d(var(--x,0px), var(--y,0px), 0) rotate(var(--r,0deg)); }
      100% { transform: translate3d(calc(var(--x,0px) * -1), calc(var(--y,0px) * -1), 0) rotate(calc(var(--r, 0deg) * -1)); }
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.58);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 50;
      padding: 16px;
    }
    .modal.open{ display:flex; }

    .modalBox{
      width: min(980px, 96vw);
      border-radius: 18px;
      overflow:hidden;
      background: rgba(255,255,255,.94);
      box-shadow: 0 24px 80px rgba(0,0,0,.40);
    }
    .modalBar{
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 10px 12px;
      font-weight: 900;
    }
    .close{
      border:none;
      background: rgba(0,0,0,.07);
      padding: 8px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 900;
    }
    .modalBox img{
      width:100%;
      height:auto;
      display:block;
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="brand" aria-hidden="true"></div>
  <div class="overlay" aria-hidden="true"></div>

  <div class="stage">
    <div class="deck" id="deck">
      <div class="title">
        <div class="left">
          <h1>Little Things</h1>
          <p>Art & Decor</p>
        </div>

        <!-- link discreto para o teu WhatsApp QR (sem “caixa” grande no topo) -->
        <a class="qrLink" href="./qr_contact/" title="Abrir WhatsApp QR">WhatsApp QR</a>
      </div>

      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modalBox">
      <div class="modalBar">
        <span>Preview</span>
        <button class="close" id="closeBtn">Fechar</button>
      </div>
      <img id="modalImg" alt="Preview">
    </div>
  </div>

  <script>
    // 14 fotos (em /assets/)
    const photos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg"
    ];

    const grid = document.getElementById("grid");
    const deck = document.getElementById("deck");

    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const closeBtn = document.getElementById("closeBtn");

    // cria cards com variações de movimento
    photos.forEach((src, i) => {
      const card = document.createElement("div");
      card.className = "card floaty";

      // variações “futuristas” de movimento (px/deg/duração)
      const x = 6 + (i % 5) * 2;            // 6..14
      const y = 5 + ((i * 3) % 7);          // 5..11
      const r = (-1 + (i % 3)) * 1.2;       // -1.2..+1.2
      const dur = 6.5 + (i % 7) * 0.65;     // 6.5..11.0

      card.style.setProperty("--x", x + "px");
      card.style.setProperty("--y", y + "px");
      card.style.setProperty("--r", r + "deg");
      card.style.setProperty("--dur", dur + "s");

      card.innerHTML = `<img src="${src}" alt="Work ${i+1}">`;

      card.addEventListener("click", () => {
        modalImg.src = src;
        modal.classList.add("open");
      });

      grid.appendChild(card);
    });

    closeBtn.addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("open");
    });

    // Parallax “futurista” (move tudo suavemente com o dedo/rato)
    // Sem libraries, suave, funciona em mobile e desktop.
    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;

    function setTargetFromEvent(clientX, clientY){
      const rect = deck.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      // range aproximado -1..1
      targetX = (clientX - cx) / (rect.width / 2);
      targetY = (clientY - cy) / (rect.height / 2);

      // limita
      targetX = Math.max(-1, Math.min(1, targetX));
      targetY = Math.max(-1, Math.min(1, targetY));
    }

    deck.addEventListener("mousemove", (e) => setTargetFromEvent(e.clientX, e.clientY), { passive:true });
    deck.addEventListener("touchmove", (e) => {
      if(!e.touches || !e.touches[0]) return;
      setTargetFromEvent(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive:true });

    function animate(){
      // lerp para ficar “suave”
      curX += (targetX - curX) * 0.06;
      curY += (targetY - curY) * 0.06;

      // aplica ao grid como um todo
      const moveX = curX * 10; // px
      const moveY = curY * 10; // px
      grid.style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
