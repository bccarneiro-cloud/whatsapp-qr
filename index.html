<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    :root{
      /* velocidade: mais baixo = mais rápido */
      --speed-top: 60s;
      --speed-bottom: 60s;

      --logo-height: 33vh; /* 1/3 do ecrã */
      --rows-height: 67vh; /* 2/3 do ecrã */
    }

    *{ box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body{
      overflow:hidden;
      background:#fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .page{
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* TOP: 2/3 com 2 linhas */
    .rows{
      height: var(--rows-height);
      display:flex;
      flex-direction:column;
    }

    .row{
      flex:1;
      position:relative;
      overflow:hidden;
      background:#fff;
    }

    /* Track que anda */
    .track{
      height:100%;
      display:flex;
      flex-wrap:nowrap;
      gap:0;              /* sem espaçamento */
      will-change: transform;
    }

    /* Cada tile ocupa a altura toda da linha */
    .tile{
      height:100%;
      flex: 0 0 auto;     /* sem encolher */
      background:#fff;    /* evita “pretos” se falhar algo */
    }

    /*
      IMPORTANTE:
      - Sem “zoom”: nada de scale()
      - Sem branco em baixo: height 100% + display:block
      - Sem cortar a meio: object-fit: cover (preenche sempre o tile)
    */
    .tile img{
      width:100%;
      height:100%;
      display:block;
      object-fit: cover;
      object-position: center;
      transform: none !important;  /* mata qualquer scale() que tenhas por acidente */
      animation: none !important;  /* mata animações tipo "ken burns" */
    }

    /*
      Largura dos tiles:
      Ajusta a quantidade de fotos visíveis por linha.
      (mantém-se sem gaps)
    */
    .tile{
      width: 33.3333vw;          /* desktop: 3 por ecrã aprox */
      max-width: 520px;
      min-width: 240px;
    }

    @media (max-width: 900px){
      .tile{ width: 50vw; min-width: 180px; }
    }
    @media (max-width: 520px){
      .tile{ width: 70vw; min-width: 160px; }
    }

    /* Animações (loop infinito suave) */
    .row.top .track{
      animation: scroll-left var(--speed-top) linear infinite;
    }
    .row.bottom .track{
      animation: scroll-right var(--speed-bottom) linear infinite;
    }

    /* Anda 50% porque duplicamos o conteúdo (list + list) */
    @keyframes scroll-left{
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    @keyframes scroll-right{
      from { transform: translateX(-50%); }
      to   { transform: translateX(0); }
    }

    /* BOTTOM: logo 1/3 */
    .logo-area{
      height: var(--logo-height);
      position:relative;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .logo-area img{
      height: 100%;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display:block;
    }

    /* Botão contactos (se já tens, mantém; se não quiseres, apaga este bloco) */
    .contacts{
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 10px);
      padding: 10px 18px;
      border-radius: 999px;
      border: 0;
      cursor:pointer;
      background: rgba(255, 192, 203, 0.35);
      color:#7a2d4b;
      font-weight: 700;
      letter-spacing: 0.2px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.12);
      animation: flash 1.2s ease-in-out infinite;
      text-decoration:none;
    }
    @keyframes flash{
      0%,100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="rows">
      <div class="row top">
        <div class="track" id="trackTop" aria-hidden="true"></div>
      </div>
      <div class="row bottom">
        <div class="track" id="trackBottom" aria-hidden="true"></div>
      </div>
    </div>

    <div class="logo-area">
      <img src="background.png" alt="Little Things" />
      <a class="contacts" href="https://www.littlethings.events/qr_contact/">Contactos / Contacts</a>
    </div>

  </div>

  <script>
    // ✅ usa SEMPRE photo01..photo14 (em ambas as linhas)
    const photos = [
      "assets/photo01.jpg","assets/photo02.jpg","assets/photo03.jpg","assets/photo04.jpg",
      "assets/photo05.jpg","assets/photo06.jpg","assets/photo07.jpg","assets/photo08.jpg",
      "assets/photo09.jpg","assets/photo10.jpg","assets/photo11.jpg","assets/photo12.jpg",
      "assets/photo13.jpg","assets/photo14.jpg"
    ];

    function buildTrack(trackEl, list){
      // duplicar para loop infinito perfeito
      const loop = list.concat(list);

      trackEl.innerHTML = loop.map(src => `
        <div class="tile"><img src="${src}" alt=""></div>
      `).join("");

      // garantir que o "to -50%" é correto (largura total duplicada)
      // (não mexe no layout, só evita saltos em alguns browsers)
      requestAnimationFrame(() => {
        const half = trackEl.scrollWidth / 2;
        trackEl.style.width = (half * 2) + "px";
      });
    }

    buildTrack(document.getElementById("trackTop"), photos);
    buildTrack(document.getElementById("trackBottom"), photos);
  </script>
</body>
</html>
