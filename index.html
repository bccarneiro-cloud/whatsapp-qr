<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    :root{
      --glass: rgba(255,255,255,.10);
      --glassBorder: rgba(255,255,255,.18);
      --shadow: 0 18px 55px rgba(0,0,0,.22);
      --shadow2: 0 12px 40px rgba(0,0,0,.18);
      --glowA: rgba(255, 80, 170, .18);
      --glowB: rgba(60, 210, 255, .16);
      --text: rgba(20,20,20,.92);
    }

    html { height: -webkit-fill-available; }
    body{
      margin:0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow:hidden;
      background:#fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
    }

    /* fundo suave */
    .bg{
      position: fixed;
      inset: 0;
      z-index: -6;
      background:
        radial-gradient(1200px 700px at 20% 25%, rgba(255,110,180,.14), transparent 60%),
        radial-gradient(900px 600px at 80% 30%, rgba(90,220,255,.12), transparent 58%),
        radial-gradient(900px 700px at 50% 85%, rgba(255,255,255,.22), transparent 60%),
        #ffffff;
    }

    /* watermark (mantém sempre visível) */
    .brand{
      position: fixed;
      inset: 0;
      z-index: -5;
      background: url("./background.png") center/contain no-repeat;
      opacity: .80;
      pointer-events:none;
      filter: saturate(1.02);
    }

    .overlay{
      position: fixed;
      inset:0;
      z-index:-4;
      background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.05), rgba(0,0,0,.10));
      pointer-events:none;
    }

    .stage{
      position: relative;
      width: 100%;
      height: 100%;
      padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
      box-sizing: border-box;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* container transparente (sem tapar logo) */
    .deck{
      width: min(1200px, 96vw);
      height: min(860px, 92svh);
      position: relative;
      border-radius: 28px;
      /* NÃO usar fundo opaco aqui para não apagar o logo */
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      overflow:hidden;
    }

    /* brilho futurista */
    .deck::before{
      content:"";
      position:absolute;
      inset:-60px;
      background:
        radial-gradient(520px 260px at 18% 20%, var(--glowA), transparent 65%),
        radial-gradient(540px 280px at 84% 30%, var(--glowB), transparent 65%);
      filter: blur(10px);
      opacity:.9;
      pointer-events:none;
    }

    /* centro — reserva espaço para o logo e garante que fotos não passam por cima */
    .centerZone{
      position:absolute;
      left:50%;
      top:50%;
      width: min(420px, 70vw);
      height: min(420px, 70vw);
      transform: translate(-50%, -50%);
      border-radius: 999px;
      z-index: 5;
      pointer-events:none;
      /* efeito “vidro” no centro mas transparente */
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 18px 60px rgba(0,0,0,.10);
    }

    /* anéis (orbitas) */
    .ring{
      position:absolute;
      left:50%;
      top:50%;
      width: var(--size);
      height: var(--size);
      transform: translate(-50%, -50%);
      border-radius: 999px;
      border: 1px dashed rgba(255,255,255,.16);
      opacity: .55;
      z-index: 1;
      pointer-events:none;
    }

    /* orbit container */
    .orbit{
      position:absolute;
      left:50%;
      top:50%;
      width: var(--size);
      height: var(--size);
      transform: translate(-50%, -50%);
      border-radius: 999px;
      z-index: 2;
      pointer-events:none;
      /* rotação contínua */
      animation: spin var(--dur) linear infinite;
    }
    @keyframes spin{
      from{ transform: translate(-50%, -50%) rotate(0deg); }
      to  { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* cada item na órbita */
    .orb{
      position:absolute;
      left:50%;
      top:50%;
      width: var(--w);
      height: var(--w);
      transform: rotate(var(--angle)) translateX(calc(var(--size) / 2)) rotate(calc(var(--angle) * -1));
      border-radius: 999px;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.08);
      box-shadow: var(--shadow2);
      pointer-events:auto;
      will-change: transform;
      animation: floaty var(--floatDur) ease-in-out infinite;
    }

    /* “respiração” suave em cima da rotação */
    @keyframes floaty{
      0%{ filter: saturate(1.03); transform: translateZ(0) scale(1.00); }
      50%{ filter: saturate(1.12); transform: translateZ(0) scale(1.05); }
      100%{ filter: saturate(1.03); transform: translateZ(0) scale(1.00); }
    }

    .orb img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
      transform: scale(1.08);
      transition: transform .35s ease, filter .35s ease;
      filter: contrast(1.02);
    }
    .orb:hover img{
      transform: scale(1.16);
      filter: contrast(1.06) saturate(1.12);
    }

    /* pequeno texto discreto (opcional) */
    .hint{
      position:absolute;
      left: 16px;
      bottom: 14px;
      font-size: 12px;
      opacity: .75;
      z-index: 6;
      background: rgba(255,255,255,.22);
      border: 1px solid rgba(255,255,255,.25);
      padding: 8px 10px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events:none;
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.58);
      display:none;
      align-items:center;
      justify-content:center;
      z-index: 50;
      padding: 16px;
    }
    .modal.open{ display:flex; }

    .modalBox{
      width: min(980px, 96vw);
      border-radius: 18px;
      overflow:hidden;
      background: rgba(255,255,255,.96);
      box-shadow: 0 24px 80px rgba(0,0,0,.40);
    }
    .modalBar{
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 10px 12px;
      font-weight: 900;
    }
    .close{
      border:none;
      background: rgba(0,0,0,.07);
      padding: 8px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 900;
    }
    .modalBox img{
      width:100%;
      height:auto;
      display:block;
    }

    /* mobile: diminuir zona central para ver mais orbitas */
    @media (max-width: 520px){
      .centerZone{
        width: min(320px, 70vw);
        height: min(320px, 70vw);
      }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="brand" aria-hidden="true"></div>
  <div class="overlay" aria-hidden="true"></div>

  <div class="stage">
    <div class="deck" id="deck">

      <!-- zonas/anéis -->
      <div class="centerZone" aria-hidden="true"></div>
      <div class="ring" style="--size: min(520px, 90vw);" aria-hidden="true"></div>
      <div class="ring" style="--size: min(760px, 120vw);" aria-hidden="true"></div>
      <div class="ring" style="--size: min(980px, 150vw);" aria-hidden="true"></div>

      <!-- orbitas geradas por JS -->
      <div id="orbits"></div>

      <div class="hint">Toca numa imagem para ampliar ✨</div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modalBox">
      <div class="modalBar">
        <span>Preview</span>
        <button class="close" id="closeBtn">Fechar</button>
      </div>
      <img id="modalImg" alt="Preview">
    </div>
  </div>

  <script>
    // 14 fotos (em /assets/)
    const photos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg"
    ];

    const deck = document.getElementById("deck");
    const orbitsWrap = document.getElementById("orbits");

    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const closeBtn = document.getElementById("closeBtn");

    closeBtn.addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => { if(e.target === modal) modal.classList.remove("open"); });

    // --- Config: 3 anéis (distribui 14 fotos)
    const rings = [
      { size: "min(520px, 90vw)",  dur: 34, count: 5,  w: "min(86px, 18vw)"  },
      { size: "min(760px, 120vw)", dur: 46, count: 5,  w: "min(80px, 16vw)"  },
      { size: "min(980px, 150vw)", dur: 62, count: 4,  w: "min(74px, 14vw)"  }
    ];

    let photoIndex = 0;

    rings.forEach((cfg, ringIdx) => {
      const orbit = document.createElement("div");
      orbit.className = "orbit";
      orbit.style.setProperty("--size", cfg.size);
      orbit.style.setProperty("--dur", cfg.dur + "s");

      // alterna sentido para ficar mais “tech”
      if (ringIdx % 2 === 1) orbit.style.animationDirection = "reverse";

      // coloca os itens distribuídos
      for(let i=0; i<cfg.count; i++){
        const angle = (360 / cfg.count) * i + (ringIdx * 14);
        const src = photos[photoIndex % photos.length];
        photoIndex++;

        const orb = document.createElement("div");
        orb.className = "orb";
        orb.style.setProperty("--size", cfg.size);
        orb.style.setProperty("--angle", angle + "deg");
        orb.style.setProperty("--w", cfg.w);

        // respiração diferente por item
        const floatDur = 4.6 + (i * 0.55) + (ringIdx * 0.3);
        orb.style.setProperty("--floatDur", floatDur + "s");

        orb.innerHTML = `<img src="${src}" alt="Work">`;

        // click abre modal
        orb.addEventListener("click", () => {
          modalImg.src = src;
          modal.classList.add("open");
        });

        orbit.appendChild(orb);
      }

      orbitsWrap.appendChild(orbit);
    });

    // --- Parallax suave (move orbitas sem tapar o centro)
    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;

    function setTargetFromEvent(clientX, clientY){
      const rect = deck.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      targetX = (clientX - cx) / (rect.width / 2);
      targetY = (clientY - cy) / (rect.height / 2);

      targetX = Math.max(-1, Math.min(1, targetX));
      targetY = Math.max(-1, Math.min(1, targetY));
    }

    deck.addEventListener("mousemove", (e) => setTargetFromEvent(e.clientX, e.clientY), { passive:true });
    deck.addEventListener("touchmove", (e) => {
      if(!e.touches || !e.touches[0]) return;
      setTargetFromEvent(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive:true });

    function animate(){
      curX += (targetX - curX) * 0.06;
      curY += (targetY - curY) * 0.06;

      // pequeno deslocamento “tech”
      const moveX = curX * 10;
      const moveY = curY * 10;

      orbitsWrap.style.transform = `translate3d(${moveX}px, ${moveY}px, 0)`;

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
