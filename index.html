<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Things</title>

<style>
:root{
  --speed: 52s; /* +15% velocidade */
}

/* RESET */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont}

/* LAYOUT */
.page{
  display:grid;
  grid-template-rows: 2fr 1fr;
  height:100vh;
  background:#000;
}

/* ================= SLIDES ================= */
.slides{
  overflow:hidden;
  background:#000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:0;
}

.row{
  overflow:hidden;
  white-space:nowrap;
}

.track{
  display:flex;
  width:max-content;
  animation: scroll var(--speed) linear infinite;
}

.row.reverse .track{
  animation-direction: reverse;
}

.track img{
  height:100%;
  width:auto;
  display:block;
  object-fit:contain;
}

/* altura das linhas */
.row{height:50%;}
.row img{height:100%;}

/* animação */
@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* ================= LOGO ================= */
.logoWrap{
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:0;
}

.logoWrap img{
  max-height:100%;
  max-width:100%;
  object-fit:contain;
}

/* BOTÃO CONTACTOS */
.cta{
  margin-top:10px;
  border:0;
  border-radius:999px;
  padding:14px 22px;
  font-size:18px;
  font-weight:800;
  letter-spacing:.3px;
  color:#0f3d2e;
  background:#ffd6e6;
  box-shadow:0 18px 45px rgba(0,0,0,.12);
  text-decoration:none;
  animation:flash 1.2s infinite;
}

@keyframes flash{
  0%,100%{opacity:1}
  50%{opacity:.55}
}

/* ================= MOBILE ================= */
@media (max-width:768px){
  .page{
    grid-template-rows: 2.2fr 0.8fr;
  }

  .logoWrap{
    padding-bottom:6vh; /* evita corte no fundo */
  }
}
</style>
</head>

<body>

<div class="page">

  <!-- SLIDES -->
  <div class="slides">

    <!-- LINHA 1 -->
    <div class="row">
      <div class="track">
        <!-- DUPLICADO PARA LOOP INFINITO -->
        <img src="assets/photo01.jpg">
        <img src="assets/photo02.jpg">
        <img src="assets/photo03.jpg">
        <img src="assets/photo04.jpg">
        <img src="assets/photo05.jpg">
        <img src="assets/photo06.jpg">
        <img src="assets/photo07.jpg">

        <img src="assets/photo01.jpg">
        <img src="assets/photo02.jpg">
        <img src="assets/photo03.jpg">
        <img src="assets/photo04.jpg">
        <img src="assets/photo05.jpg">
        <img src="assets/photo06.jpg">
        <img src="assets/photo07.jpg">
      </div>
    </div>

    <!-- LINHA 2 (MESMO CÓDIGO, OUTRAS FOTOS) -->
    <div class="row reverse">
      <div class="track">
        <img src="assets/photo08.jpg">
        <img src="assets/photo09.jpg">
        <img src="assets/photo10.jpg">
        <img src="assets/photo11.jpg">
        <img src="assets/photo12.jpg">
        <img src="assets/photo13.jpg">
        <img src="assets/photo14.jpg">

        <img src="assets/photo08.jpg">
        <img src="assets/photo09.jpg">
        <img src="assets/photo10.jpg">
        <img src="assets/photo11.jpg">
        <img src="assets/photo12.jpg">
        <img src="assets/photo13.jpg">
        <img src="assets/photo14.jpg">
      </div>
    </div>

  </div>

  <!-- LOGO -->
  <div class="logoWrap">
    <img src="background.png" alt="Little Things">
    <a class="cta" href="https://www.littlethings.events/qr_contact/">
      Contactos / Contacts
    </a>
  </div>

</div>

</body>
</html>
