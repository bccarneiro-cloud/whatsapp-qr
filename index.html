<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    *{ box-sizing:border-box; }
    html{ height:-webkit-fill-available; }

    body{
      margin:0;
      height:100vh;
      height:100svh;
      height:100dvh;
      height:-webkit-fill-available;
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#fff;
    }

    /* subtle background */
    .bg{
      position:fixed;
      inset:0;
      background:
        radial-gradient(circle at 25% 10%, rgba(255,192,203,0.18), transparent 55%),
        radial-gradient(circle at 80% 70%, rgba(255,182,193,0.14), transparent 60%),
        #ffffff;
      z-index:-1;
    }

    .page{
      position:fixed;
      inset:0;
      display:grid;
      grid-template-rows: 2fr 1fr;
      padding:
        calc(10px + env(safe-area-inset-top))
        0
        calc(10px + env(safe-area-inset-bottom))
        0;
    }

    /* ===== SLIDESHOW ===== */
    .slideshow{
      display:grid;
      grid-template-rows:1fr 1fr;
      overflow:hidden;
    }

    .lane{
      position:relative;
      overflow:hidden;
    }

    .track{
      position:absolute;
      top:0;
      left:0;
      height:100%;
      display:flex;
      width:max-content;
      will-change:transform;
    }

    .lane.top .track{
      animation: moveLeft 30s linear infinite;
    }
    .lane.bottom .track{
      animation: moveRight 36s linear infinite;
    }

    @keyframes moveLeft{
      from{ transform:translateX(0); }
      to{ transform:translateX(calc(-1 * var(--shift))); }
    }
    @keyframes moveRight{
      from{ transform:translateX(calc(-1 * var(--shift))); }
      to{ transform:translateX(0); }
    }

    /* images = continuous strip */
    .slide{
      flex:0 0 auto;
      height:100%;
    }

    .slide img{
      height:100%;
      width:auto;
      display:block;
      object-fit:contain;
    }

    /* ===== BOTTOM (FULL WHITE) ===== */
    .bottomBar{
      background:#fff;
      display:grid;
      grid-template-rows:1fr auto;
      align-items:center;
    }

    .logoWrap{
      width:100%;
      height:100%;
    }

    .logoWrap img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .contactRow{
      padding:0 16px 12px;
      display:flex;
      justify-content:center;
    }

    .contactBtn{
      width:min(520px,100%);
      text-align:center;
      padding:14px 16px;
      border-radius:999px;
      text-decoration:none;
      font-weight:900;
      color:#111;
      background:#fff;
      box-shadow:
        inset 0 2px 6px rgba(0,0,0,0.08),
        0 10px 24px rgba(0,0,0,0.10);
    }

    .contactBtn:active{ transform:scale(.98); }

    @media (max-height:700px){
      .contactBtn{ padding:12px 14px; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <div class="page">

    <!-- Slideshow -->
    <section class="slideshow">
      <div class="lane top">
        <div class="track" id="trackTop"></div>
      </div>
      <div class="lane bottom">
        <div class="track" id="trackBottom"></div>
      </div>
    </section>

    <!-- Bottom -->
    <section class="bottomBar">
      <div class="logoWrap">
        <img src="./background.png" alt="Little Things">
      </div>

      <div class="contactRow">
        <a class="contactBtn" href="./qr_contact/">Contactos / Contacts</a>
      </div>
    </section>

  </div>

  <script>
    const topPhotos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg"
    ];

    const bottomPhotos = [
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg"
    ];

    function createSlide(src){
      const d = document.createElement("div");
      d.className = "slide";
      const i = document.createElement("img");
      i.src = src;
      d.appendChild(i);
      return d;
    }

    function setup(track, photos){
      track.innerHTML = "";
      const sequence = photos.concat(photos); // duplicate for seamless loop
      sequence.forEach(p => track.appendChild(createSlide(p)));

      requestAnimationFrame(()=>{
        const shift = track.scrollWidth / 2;
        track.style.setProperty("--shift", shift + "px");
      });
    }

    function init(){
      setup(document.getElementById("trackTop"), topPhotos);
      setup(document.getElementById("trackBottom"), bottomPhotos);
    }

    init();
    window.addEventListener("resize", init);
  </script>
</body>
</html>
