<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Contact via WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --wa: #25D366;
      --glass: rgba(255,255,255,.16);     /* muito transparente */
      --glass-border: rgba(255,255,255,.22);
      --shadow: 0 16px 40px rgba(0,0,0,.15);
      --text: rgba(10,10,10,.85);
    }

    /* BACKGROUND */
    body{
      margin:0;
      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:flex-start;

      padding-top: 58vh; /* 👈 posição da caixa (ajusta se quiseres) */

      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);

      background: url("background.png") center / cover no-repeat fixed;
      position: relative;
    }

    /* overlay MUITO leve (não tapa o logo) */
    body::before{
      content:"";
      position:absolute;
      inset:0;
      background: rgba(0,0,0,.05);
      pointer-events:none;
    }

    /* CAIXA */
    .card{
      position:relative;
      width: min(300px, 88vw);   /* caixa mais pequena */
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 14px 12px 12px;
    }

    .header{
      text-align:center;
      margin-bottom: 8px;
    }

    .title{
      font-weight: 700;
      font-size: 15px;
      line-height: 1.2;
      margin: 0 0 6px;
    }

    .title .line{
      display:flex;
      gap:8px;
      justify-content:center;
      margin: 3px 0;
    }

    .subtitle{
      font-size: 12px;
      opacity: .7;
      margin: 0;
    }

    /* BOTÕES */
    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;

      margin: 8px 0;
      padding: 11px;

      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;

      background: rgba(37,211,102,.85);
      border: 1px solid rgba(255,255,255,.35);
      color: white;

      box-shadow: 0 8px 18px rgba(37,211,102,.20);
      text-decoration:none;
      transition: transform .08s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:active{
      transform: scale(.985);
    }

    .footer-note{
      text-align:center;
      font-size: 11px;
      opacity: .65;
      margin-top: 6px;
    }

    /* TELEFONES MUITO PEQUENOS */
    @media (max-height: 640px){
      body{ padding-top: 52vh; }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="header">
      <div class="title">
        <div class="line">🇵🇹 <span>Escolhe o teu idioma</span></div>
        <div class="line">🇪🇸 <span>Elige tu idioma</span></div>
        <div class="line">🇬🇧 <span>Choose your language</span></div>
      </div>
      <p class="subtitle">WhatsApp</p>
    </div>

    <a class="btn" href="https://wa.me/351918373423?text=Ol%C3%A1%2C%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es.">
      🇵🇹 Português
    </a>

    <a class="btn" href="https://wa.me/351918373423?text=Hola%2C%20me%20gustar%C3%ADa%20recibir%20m%C3%A1s%20informaci%C3%B3n.">
      🇪🇸 Español
    </a>

    <a class="btn" href="https://wa.me/351918373423?text=Hello%2C%20I%20would%20like%20more%20information.">
      🇬🇧 English
    </a>

    <div class="footer-note">Tap to open WhatsApp</div>
  </div>

</body>
</html>
