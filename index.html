<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Things</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* 2/3 topo (faixas) + 1/3 logo */
    .page {
      height: 100vh;
      display: grid;
      grid-template-rows: 2fr 1fr;
    }

    /* TOP: duas faixas */
    .strips {
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .strip {
      height: 50%;
      overflow: hidden;
      position: relative;
    }

    .track {
      height: 100%;
      display: flex;
      flex-wrap: nowrap;
      gap: 0;
      will-change: transform;
      transform: translate3d(0,0,0);
      backface-visibility: hidden;

      /* +20% velocidade (40s -> 32s) */
      animation: scrollLeft 32s linear infinite;
    }

    .track.reverse {
      /* +20% velocidade (44s -> 35.2s) */
      animation: scrollRight 35.2s linear infinite;
    }

    .item {
      height: 100%;
      flex: 0 0 auto;
    }

    .item img {
      height: 100%;
      width: auto;
      display: block;
      object-fit: cover;
    }

    /* Loop “infinito” suave: Set A + Set B idênticos e desloca exatamente metade do track */
    @keyframes scrollLeft {
      from { transform: translate3d(0,0,0); }
      to   { transform: translate3d(-50%,0,0); }
    }

    @keyframes scrollRight {
      from { transform: translate3d(-50%,0,0); }
      to   { transform: translate3d(0,0,0); }
    }

    /* BOTTOM: logo 1/3 */
    .logoArea {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;

      /* evita corte em iPhone (safe area) */
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    }

    .logoArea img {
      height: 100%;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* MOBILE tweaks (só para garantir que não corta em baixo) */
    @media (max-width: 768px) {
      .page { grid-template-rows: 2fr 1fr; }

      .logoArea {
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
      }

      /* ligeiro ajuste para garantir que nunca toca no limite inferior */
      .logoArea img {
        height: 92%;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="strips">
      <!-- STRIP 1 (normal) -->
      <div class="strip">
        <div class="track">
          <!-- conjunto A -->
          <div class="item"><img src="assets/photo01.jpg" alt=""></div>
          <div class="item"><img src="assets/photo02.jpg" alt=""></div>
          <div class="item"><img src="assets/photo03.jpg" alt=""></div>
          <div class="item"><img src="assets/photo04.jpg" alt=""></div>
          <div class="item"><img src="assets/photo05.jpg" alt=""></div>
          <div class="item"><img src="assets/photo06.jpg" alt=""></div>
          <div class="item"><img src="assets/photo07.jpg" alt=""></div>

          <!-- conjunto B (duplicado igual para loop perfeito) -->
          <div class="item"><img src="assets/photo01.jpg" alt=""></div>
          <div class="item"><img src="assets/photo02.jpg" alt=""></div>
          <div class="item"><img src="assets/photo03.jpg" alt=""></div>
          <div class="item"><img src="assets/photo04.jpg" alt=""></div>
          <div class="item"><img src="assets/photo05.jpg" alt=""></div>
          <div class="item"><img src="assets/photo06.jpg" alt=""></div>
          <div class="item"><img src="assets/photo07.jpg" alt=""></div>
        </div>
      </div>

      <!-- STRIP 2 (reverse) -->
      <div class="strip">
        <div class="track reverse">
          <!-- conjunto A -->
          <div class="item"><img src="assets/photo08.jpg" alt=""></div>
          <div class="item"><img src="assets/photo09.jpg" alt=""></div>
          <div class="item"><img src="assets/photo10.jpg" alt=""></div>
          <div class="item"><img src="assets/photo11.jpg" alt=""></div>
          <div class="item"><img src="assets/photo12.jpg" alt=""></div>
          <div class="item"><img src="assets/photo13.jpg" alt=""></div>
          <div class="item"><img src="assets/photo14.jpg" alt=""></div>

          <!-- conjunto B (duplicado igual — loop perfeito) -->
          <div class="item"><img src="assets/photo08.jpg" alt=""></div>
          <div class="item"><img src="assets/photo09.jpg" alt=""></div>
          <div class="item"><img src="assets/photo10.jpg" alt=""></div>
          <div class="item"><img src="assets/photo11.jpg" alt=""></div>
          <div class="item"><img src="assets/photo12.jpg" alt=""></div>
          <div class="item"><img src="assets/photo13.jpg" alt=""></div>
          <div class="item"><img src="assets/photo14.jpg" alt=""></div>
        </div>
      </div>
    </div>

    <div class="logoArea">
      <img src="background.png" alt="Little Things logo">
    </div>

  </div>
</body>
</html>
