<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      touch-action: none;
    }

    .page {
      height: 100svh;
      height: 100dvh;
      display: grid;
      grid-template-rows: 2fr 1fr;
    }

    /* ===== SLIDESHOW ===== */
    .strips {
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .strip {
      height: 50%;
      overflow: hidden;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-x;
      background: #000;
    }

    .track {
      height: 100%;
      display: flex;
      gap: 0;
      will-change: transform;
      transform: translate3d(0,0,0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .item {
      height: 100%;
      flex: 0 0 auto;
    }

    .item img {
      height: 100%;
      width: auto;
      display: block;
      object-fit: cover;
      transform: translateZ(0);
      -webkit-transform: translateZ(0);
    }

    /* ===== LOGO + BOTÃO ===== */
    .logoArea {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      background: #fff;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
      padding-top: 10px;
      gap: 14px;
      overflow: hidden;
    }

    .logoArea img {
      max-height: 78%;
      width: auto;
      object-fit: contain;
      display: block;
    }

    .contactBtn {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 10px 22px;
      border: 1px solid currentColor;
      background: transparent;
      color: #000;
      text-decoration: none;
      animation: flash 2.5s ease-in-out infinite;
    }

    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @media (max-width: 768px) {
      .logoArea {
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 38px);
      }
      .logoArea img {
        max-height: 72%;
      }
      .contactBtn {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
<div class="page">

  <div class="strips">

    <!-- STRIP 1 (esquerda) -->
    <div class="strip" data-strip="0">
      <div class="track" id="track1">
        <!-- A -->
        <div class="item"><img src="assets/photo01.jpg" alt=""></div>
        <div class="item"><img src="assets/photo02.jpg" alt=""></div>
        <div class="item"><img src="assets/photo03.jpg" alt=""></div>
        <div class="item"><img src="assets/photo04.jpg" alt=""></div>
        <div class="item"><img src="assets/photo05.jpg" alt=""></div>
        <div class="item"><img src="assets/photo06.jpg" alt=""></div>
        <div class="item"><img src="assets/photo07.jpg" alt=""></div>

        <!-- B (duplicado) -->
        <div class="item"><img src="assets/photo01.jpg" alt=""></div>
        <div class="item"><img src="assets/photo02.jpg" alt=""></div>
        <div class="item"><img src="assets/photo03.jpg" alt=""></div>
        <div class="item"><img src="assets/photo04.jpg" alt=""></div>
        <div class="item"><img src="assets/photo05.jpg" alt=""></div>
        <div class="item"><img src="assets/photo06.jpg" alt=""></div>
        <div class="item"><img src="assets/photo07.jpg" alt=""></div>
      </div>
    </div>

    <!-- STRIP 2 (direita) -->
    <div class="strip" data-strip="1">
      <div class="track" id="track2">
        <!-- A -->
        <div class="item"><img src="assets/photo08.jpg" alt=""></div>
        <div class="item"><img src="assets/photo09.jpg" alt=""></div>
        <div class="item"><img src="assets/photo10.jpg" alt=""></div>
        <div class="item"><img src="assets/photo11.jpg" alt=""></div>
        <div class="item"><img src="assets/photo12.jpg" alt=""></div>
        <div class="item"><img src="assets/photo13.jpg" alt=""></div>
        <div class="item"><img src="assets/photo14.jpg" alt=""></div>

        <!-- B (duplicado) -->
        <div class="item"><img src="assets/photo08.jpg" alt=""></div>
        <div class="item"><img src="assets/photo09.jpg" alt=""></div>
        <div class="item"><img src="assets/photo10.jpg" alt=""></div>
        <div class="item"><img src="assets/photo11.jpg" alt=""></div>
        <div class="item"><img src="assets/photo12.jpg" alt=""></div>
        <div class="item"><img src="assets/photo13.jpg" alt=""></div>
        <div class="item"><img src="assets/photo14.jpg" alt=""></div>
      </div>
    </div>

  </div>

  <div class="logoArea">
    <img src="background.png" alt="Little Things logo">
    <a class="contactBtn" href="https://www.littlethings.events/qr_contact/">
      Contactos / Contacts
    </a>
  </div>

</div>

<script>
  // ===== Movimento contínuo + drag + retoma ao fim de 1s =====
  // Fix principal: sem arredondamentos no wrap/transform e medir depois das imagens carregarem.

  const tracks = [
    { el: document.getElementById('track1'), speed:  60, x: 0, wrap: 0, dragging: false, lastX: 0, lastUserTs: 0 },
    { el: document.getElementById('track2'), speed: -60, x: 0, wrap: 0, dragging: false, lastX: 0, lastUserTs: 0 } // negativo => move para a direita
  ];

  function measureWrap(el) {
    const items = Array.from(el.children);
    const half = items.length / 2; // A e B iguais em count
    let w = 0;
    for (let i = 0; i < half; i++) {
      w += items[i].getBoundingClientRect().width; // float (sem round)
    }
    return w;
  }

  function render(t) {
    // translateX(-x) => x aumenta -> move para a esquerda
    t.el.style.transform = `translate3d(${-t.x}px, 0, 0)`;
  }

  function normalizeX(t) {
    if (!t.wrap || t.wrap <= 0) return;
    t.x = t.x % t.wrap;
    if (t.x < 0) t.x += t.wrap;
  }

  async function waitForImages(container) {
    const imgs = Array.from(container.querySelectorAll('img'));
    await Promise.all(imgs.map(img => {
      if (img.complete && img.naturalWidth > 0) return Promise.resolve();
      return new Promise(res => img.addEventListener('load', res, { once: true }));
    }));
  }

  async function measureAll() {
    // Espera mesmo pelas imagens -> evita medições “a meio” (causa clássica do buraco no desktop)
    await Promise.all(tracks.map(t => waitForImages(t.el)));
    tracks.forEach(t => {
      t.wrap = measureWrap(t.el);
      normalizeX(t);
      render(t);
    });
  }

  let last = performance.now();
  function loop(now) {
    const dt = (now - last) / 1000;
    last = now;

    tracks.forEach(t => {
      const userRecentlyMoved = (now - t.lastUserTs) < 1000;

      if (!t.dragging && !userRecentlyMoved && t.wrap > 0) {
        t.x += t.speed * dt;
        normalizeX(t);
        render(t);
      }
    });

    requestAnimationFrame(loop);
  }

  // Drag por faixa
  document.querySelectorAll('.strip').forEach((strip, idx) => {
    const t = tracks[idx];

    strip.addEventListener('pointerdown', (e) => {
      t.dragging = true;
      t.lastX = e.clientX;
      t.lastUserTs = performance.now();
      strip.setPointerCapture(e.pointerId);
    });

    strip.addEventListener('pointermove', (e) => {
      if (!t.dragging) return;
      const dx = e.clientX - t.lastX;
      t.lastX = e.clientX;

      // dedo para a direita => dx>0 => queremos mover conteúdo para a direita => x diminui
      t.x -= dx;
      normalizeX(t);

      t.lastUserTs = performance.now();
      render(t);
    });

    strip.addEventListener('pointerup', () => {
      t.dragging = false;
      t.lastUserTs = performance.now();
    });

    strip.addEventListener('pointercancel', () => {
      t.dragging = false;
      t.lastUserTs = performance.now();
    });
  });

  window.addEventListener('load', async () => {
    await measureAll();
    requestAnimationFrame(loop);
  });

  window.addEventListener('resize', () => {
    // re-medir para desktop/mobile sem buracos
    setTimeout(() => { measureAll(); }, 80);
  });
</script>
</body>
</html>
