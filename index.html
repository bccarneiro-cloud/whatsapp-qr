<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      touch-action: none;
    }

    .page {
      height: 100svh;
      height: 100dvh;
      display: grid;
      grid-template-rows: 2fr 1fr;
    }

    .strips {
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .strip {
      height: 50%;
      overflow: hidden;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-x;
      background: #000;
    }

    .track {
      height: 100%;
      display: flex;
      flex-wrap: nowrap;
      gap: 0;
      will-change: transform;
      transform: translate3d(0,0,0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .item {
      height: 100%;
      flex: 0 0 auto;
    }

    .item img {
      height: 100%;
      width: auto;
      display: block;
      object-fit: cover;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    .logoArea {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      background: #fff;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
      padding-top: 10px;
    }

    .logoArea img {
      max-height: 100%;
      max-width: 100%;
      height: auto;
      width: auto;
      object-fit: contain;
      display: block;
    }

    @media (max-width: 768px) {
      .logoArea {
        padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 38px);
        padding-top: 12px;
      }
      .logoArea img {
        max-height: 92%;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="strips">
      <!-- STRIP 1 (move para a esquerda) -->
      <div class="strip" data-strip="0">
        <div class="track" id="track1">
          <!-- conjunto A -->
          <div class="item"><img src="assets/photo01.jpg" alt=""></div>
          <div class="item"><img src="assets/photo02.jpg" alt=""></div>
          <div class="item"><img src="assets/photo03.jpg" alt=""></div>
          <div class="item"><img src="assets/photo04.jpg" alt=""></div>
          <div class="item"><img src="assets/photo05.jpg" alt=""></div>
          <div class="item"><img src="assets/photo06.jpg" alt=""></div>
          <div class="item"><img src="assets/photo07.jpg" alt=""></div>

          <!-- conjunto B (duplicado) -->
          <div class="item"><img src="assets/photo01.jpg" alt=""></div>
          <div class="item"><img src="assets/photo02.jpg" alt=""></div>
          <div class="item"><img src="assets/photo03.jpg" alt=""></div>
          <div class="item"><img src="assets/photo04.jpg" alt=""></div>
          <div class="item"><img src="assets/photo05.jpg" alt=""></div>
          <div class="item"><img src="assets/photo06.jpg" alt=""></div>
          <div class="item"><img src="assets/photo07.jpg" alt=""></div>
        </div>
      </div>

      <!-- STRIP 2 (move para a direita) -->
      <div class="strip" data-strip="1">
        <div class="track" id="track2">
          <!-- conjunto A -->
          <div class="item"><img src="assets/photo08.jpg" alt=""></div>
          <div class="item"><img src="assets/photo09.jpg" alt=""></div>
          <div class="item"><img src="assets/photo10.jpg" alt=""></div>
          <div class="item"><img src="assets/photo11.jpg" alt=""></div>
          <div class="item"><img src="assets/photo12.jpg" alt=""></div>
          <div class="item"><img src="assets/photo13.jpg" alt=""></div>
          <div class="item"><img src="assets/photo14.jpg" alt=""></div>

          <!-- conjunto B (duplicado) -->
          <div class="item"><img src="assets/photo08.jpg" alt=""></div>
          <div class="item"><img src="assets/photo09.jpg" alt=""></div>
          <div class="item"><img src="assets/photo10.jpg" alt=""></div>
          <div class="item"><img src="assets/photo11.jpg" alt=""></div>
          <div class="item"><img src="assets/photo12.jpg" alt=""></div>
          <div class="item"><img src="assets/photo13.jpg" alt=""></div>
          <div class="item"><img src="assets/photo14.jpg" alt=""></div>
        </div>
      </div>
    </div>

    <div class="logoArea">
      <img src="background.png" alt="Little Things logo">
    </div>

  </div>

  <script>
    // ===== Movimento contínuo SEM salto + drag com retoma após 1s =====

    const strips = [
      {
        el: document.getElementById('track1'),
        speed: 60, // px/seg
        dir: -1,    // esquerda
        x: 0,
        halfW: 0,
        dragging: false,
        lastPointerX: 0,
        lastUserMoveTs: 0
      },
      {
        el: document.getElementById('track2'),
        speed: 60,
        dir: 1,     // direita
        x: 0,
        halfW: 0,
        dragging: false,
        lastPointerX: 0,
        lastUserMoveTs: 0
      }
    ];

    function measureHalfWidth(trackEl) {
      // ✅ Medir a largura EXATA do 1º conjunto (metade dos items)
      const children = Array.from(trackEl.children);
      const halfCount = Math.floor(children.length / 2);
      let w = 0;
      for (let i = 0; i < halfCount; i++) {
        w += children[i].getBoundingClientRect().width;
      }
      return Math.round(w);
    }

    function measure() {
      strips.forEach(s => {
        s.halfW = measureHalfWidth(s.el);

        // garante que halfW é válido
        if (!s.halfW || s.halfW < 10) {
          // fallback
          s.halfW = Math.round(s.el.scrollWidth / 2);
        }

        s.x = ((s.x % s.halfW) + s.halfW) % s.halfW;
        applyTransform(s);
      });
    }

    function applyTransform(s) {
      // Usa px inteiros para eliminar gaps por sub-pixel no desktop
      const tx = (s.dir === -1) ? -s.x : -(s.halfW - s.x);
      s.el.style.transform = `translate3d(${Math.round(tx)}px, 0, 0)`;
    }

    let lastTs = performance.now();

    function tick(ts) {
      const dt = (ts - lastTs) / 1000;
      lastTs = ts;

      strips.forEach(s => {
        const now = performance.now();
        const userRecentlyMoved = (now - s.lastUserMoveTs) < 1000;

        if (!s.dragging && !userRecentlyMoved) {
          s.x += s.speed * dt;
          if (s.x >= s.halfW) s.x -= s.halfW;
          applyTransform(s);
        }
      });

      requestAnimationFrame(tick);
    }

    // Drag por faixa
    document.querySelectorAll('.strip').forEach(stripEl => {
      const idx = Number(stripEl.getAttribute('data-strip'));
      const s = strips[idx];

      stripEl.addEventListener('pointerdown', (e) => {
        s.dragging = true;
        s.lastPointerX = e.clientX;
        s.lastUserMoveTs = performance.now();
        stripEl.setPointerCapture(e.pointerId);
      });

      stripEl.addEventListener('pointermove', (e) => {
        if (!s.dragging) return;
        const dx = e.clientX - s.lastPointerX;
        s.lastPointerX = e.clientX;

        s.x -= dx * s.dir;
        s.x = ((s.x % s.halfW) + s.halfW) % s.halfW;

        s.lastUserMoveTs = performance.now();
        applyTransform(s);
      });

      stripEl.addEventListener('pointerup', () => {
        s.dragging = false;
        s.lastUserMoveTs = performance.now();
      });

      stripEl.addEventListener('pointercancel', () => {
        s.dragging = false;
        s.lastUserMoveTs = performance.now();
      });
    });

    // Re-medidas quando imagens carregam / resize
    window.addEventListener('load', () => {
      // mede depois de tudo renderizar
      setTimeout(() => {
        measure();
        requestAnimationFrame(tick);
      }, 120);
    });

    window.addEventListener('resize', () => {
      setTimeout(measure, 80);
    });
  </script>
</body>
</html>
