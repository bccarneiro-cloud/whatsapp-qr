<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Things</title>

  <style>
    :root{
      /* Mantive o speed que pediste (60) */
      --speed: 60s;

      /* Largura fixa para não haver "espaços" entre fotos */
      --tileW: 340px;
      --tileWMobile: 250px;

      /* Alturas: slideshow 2/3 + logo 1/3 */
      --topH: 67vh;
      --bottomH: 33vh;
    }

    *{ margin:0; padding:0; box-sizing:border-box; }
    html,body{ width:100%; height:100%; overflow:hidden; font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial; }

    .page{
      height:100vh;
      display:flex;
      flex-direction:column;
      background:#fff;
    }

    /* ========== SLIDESHOW (TOP 2/3) ========== */
    .slides{
      height: var(--topH);
      display:flex;
      flex-direction:column;
      overflow:hidden;

      /* IMPORTANTE: fundo branco para nunca aparecer preto */
      background:#fff;
    }

    .row{
      height:50%;
      overflow:hidden;

      /* fundo branco (em vez de preto) */
      background:#fff;
    }

    .track{
      display:flex;
      width:max-content;
      animation: scroll var(--speed) linear infinite;
      will-change: transform;
    }

    .row.reverse .track{
      animation-direction: reverse;
    }

    .tile{
      width: var(--tileW);
      height:100%;
      flex: 0 0 var(--tileW);

      display:flex;
      align-items:center;
      justify-content:center;

      /* CRÍTICO: remover preto */
      background: transparent;
    }

    .tile img{
      /* SEM ZOOM: não uso cover */
      width: 100%;
      height: 100%;
      object-fit: contain;  /* mantém foto inteira, sem zoom */
      display:block;
      background: transparent;
    }

    @keyframes scroll{
      from{ transform: translateX(0); }
      to{ transform: translateX(-50%); }
    }

    /* ========== LOGO (BOTTOM 1/3) ========== */
    .logoWrap{
      height: var(--bottomH);
      background:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
      padding: 10px 10px;
    }

    .logoWrap img{
      max-height: calc(100% - 70px);
      max-width: 100%;
      object-fit: contain;
      display:block;
    }

    /* Botão (mantido simples e igual ao tema) */
    .cta{
      margin-top: 10px;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 800;
      background: #ffd6e6;
      color: #6a1b4d;
      text-decoration: none;
      animation: flash 1.2s infinite;
    }

    @keyframes flash{
      0%,100%{ opacity:1; }
      50%{ opacity:.55; }
    }

    /* Mobile: tiles menores */
    @media (max-width: 768px){
      .tile{
        width: var(--tileWMobile);
        flex-basis: var(--tileWMobile);
      }

      /* Se no telemóvel o logo ficar cortado em baixo,
         esta padding ajuda sem mexer na estrutura */
      .logoWrap{
        padding-bottom: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- TOP: 2 linhas -->
    <div class="slides">

      <!-- LINHA 1 (exemplo: 1..7) -->
      <div class="row">
        <div class="track">
          <!-- ORIGINAL -->
          <div class="tile"><img src="assets/photo01.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo02.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo03.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo04.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo05.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo06.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo07.jpg" alt=""></div>

          <!-- DUPLICADO IGUAL (para loop infinito) -->
          <div class="tile"><img src="assets/photo01.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo02.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo03.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo04.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo05.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo06.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo07.jpg" alt=""></div>
        </div>
      </div>

      <!-- LINHA 2 (exemplo: 8..14) -->
      <div class="row reverse">
        <div class="track">
          <!-- ORIGINAL -->
          <div class="tile"><img src="assets/photo08.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo09.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo10.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo11.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo12.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo13.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo14.jpg" alt=""></div>

          <!-- DUPLICADO IGUAL (evita preto no fim) -->
          <div class="tile"><img src="assets/photo08.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo09.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo10.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo11.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo12.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo13.jpg" alt=""></div>
          <div class="tile"><img src="assets/photo14.jpg" alt=""></div>
        </div>
      </div>

    </div>

    <!-- BOTTOM: logo + botão -->
    <div class="logoWrap">
      <img src="background.png" alt="Little Things">
      <a class="cta" href="https://www.littlethings.events/qr_contact/">
        Contactos / Contacts
      </a>
    </div>

  </div>
</body>
</html>
