<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Little Things</title>

  <style>
    :root{
      --speed: 60s;     /* velocidade do loop */
      --topH: 67vh;     /* slideshow 2/3 */
      --bottomH: 33vh;  /* logo 1/3 */
    }

    *{ margin:0; padding:0; box-sizing:border-box; }
    html,body{ width:100%; height:100%; overflow:hidden; background:#fff; }

    .page{
      height:100vh;
      display:flex;
      flex-direction:column;
      background:#fff;
    }

    /* ================= TOP (2 linhas) ================= */
    .slides{
      height: var(--topH);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:#fff;
    }

    .row{
      height:50%;
      overflow:hidden;
      background:#fff;
    }

    .track{
      display:flex;
      width:max-content;
      gap:0;                          /* sem espaçamento */
      animation: scroll var(--speed) linear infinite;
      will-change: transform;
    }

    .row.reverse .track{
      animation-direction: reverse;
    }

    /* tile sem fundos/cores para nunca aparecer “quadrado” */
    .tile{
      height:100%;
      flex: 0 0 auto;
      display:flex;
      align-items:stretch;
      justify-content:flex-start;
      background: transparent;
      line-height:0;                 /* remove “gaps”/baseline */
    }

    /* ✅ FIX DEFINITIVO DO ZOOM:
       - object-fit: contain -> nunca corta (sem crop)
       - transform: none -> impede zoom por scale antigo
       - width:auto + height:100% -> mantém proporção
    */
    .tile img{
      height:100%;
      width:auto;
      display:block;
      background: transparent;

      object-fit: contain !important;
      transform: none !important;
      filter: none !important;
    }

    @keyframes scroll{
      from{ transform: translateX(0); }
      to{ transform: translateX(-50%); }
    }

    /* ================= BOTTOM (logo + botão) ================= */
    .logoWrap{
      height: var(--bottomH);
      background:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      padding: 10px 10px 18px; /* extra em baixo p/ não cortar no telemóvel */
    }

    .logoWrap img{
      max-height: calc(100% - 70px);
      max-width: 100%;
      object-fit: contain;
      display:block;
    }

    .cta{
      margin-top: 10px;
      padding: 14px 22px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 800;
      background: #ffd6e6;
      color: #6a1b4d;
      text-decoration: none;
      animation: flash 1.2s infinite;
    }

    @keyframes flash{
      0%,100%{ opacity:1; }
      50%{ opacity:.55; }
    }
  </style>
</head>
