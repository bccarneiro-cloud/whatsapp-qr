<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Little Things</title>
  <style>
    :root{
      --bg: #ffffff;
      --shadow: 0 18px 45px rgba(0,0,0,.12);
      --radius: 18px;

      /* Ajustes pedidos */
      --speed: 60;          /* <-- VELOCIDADE (quanto menor, mais rápido). Ex: 50 mais rápido, 80 mais lento */
      --row-gap: 0px;       /* <-- distância entre as 2 linhas */
      --img-gap: 0px;       /* <-- distância entre fotos (0 = sem espaços) */
      --logo-part: 34vh;    /* ~1/3 do ecrã para o logo */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      overflow: hidden;
    }

    .page{
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    /* TOP: 2/3 (aprox) */
    .top{
      flex: 1 1 auto;
      min-height: calc(100dvh - var(--logo-part));
      display: flex;
      flex-direction: column;
      gap: var(--row-gap);
      overflow: hidden;
      background: #fff; /* evita “pretos” */
    }

    .row{
      position: relative;
      flex: 1 1 50%;
      overflow: hidden;
      background: #fff; /* evita “pretos” */
      touch-action: pan-y; /* permite scroll vertical da página (mas aqui está fixed), e drag horizontal controlado */
    }

    .track{
      position: absolute;
      inset: 0;
      display: flex;
      align-items: stretch;
      gap: var(--img-gap);
      will-change: transform;
      transform: translate3d(0,0,0);
      background: transparent;
    }

    .tile{
      flex: 0 0 auto;
      height: 100%;
      display: block;
      background: transparent;
    }

    .tile img{
      height: 100%;
      width: auto;
      display: block;
      object-fit: contain;    /* ver a foto “completa” (sem cortes) */
      background: #fff;       /* se a imagem tiver transparência */
    }

    /* BOTTOM: logo ~1/3 */
    .bottom{
      flex: 0 0 auto;
      height: var(--logo-part);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
      background: #fff;
    }

    .logoWrap{
      width: 100%;
      height: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .logoWrap img{
      width: 100%;
      height: 100%;
      object-fit: contain;   /* logo inteiro, sem deturpar */
      display: block;
    }

    .cta{
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(8px + env(safe-area-inset-bottom));
      width: min(520px, 92%);
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .2px;
      color: #0f3d2e;
      background: #ffd6e6; /* tom rosado */
      box-shadow: var(--shadow);
      text-decoration: none;
      text-align: center;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      animation: flash 1.2s infinite;
    }

    .cta::before{
      content:"";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #27c167; /* verde que combina com o tema */
      box-shadow: 0 0 0 0 rgba(39,193,103,.65);
      animation: pulse 1.2s infinite;
    }

    @keyframes flash{
      0%, 100% { filter: brightness(1); transform: translateX(-50%) scale(1); }
      50% { filter: brightness(1.08); transform: translateX(-50%) scale(1.02); }
    }
    @keyframes pulse{
      0%   { box-shadow: 0 0 0 0 rgba(39,193,103,.55); }
      70%  { box-shadow: 0 0 0 14px rgba(39,193,103,0); }
      100% { box-shadow: 0 0 0 0 rgba(39,193,103,0); }
    }

    /* Melhoras para desktop */
    @media (min-width: 900px){
      :root{
        --logo-part: 32vh;
      }
      .cta{ font-size: 18px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="top">
      <div class="row" id="row1"><div class="track" id="track1"></div></div>
      <div class="row" id="row2"><div class="track" id="track2"></div></div>
    </div>

    <div class="bottom">
      <div class="logoWrap">
        <img src="background.png" alt="Little Things logo" />
        <a class="cta" href="https://www.littlethings.events/qr_contact/">
          Contactos / Contacts
        </a>
      </div>
    </div>
  </div>

  <script>
    /**
     * CONFIG
     * - fotos em /assets/photo01.jpg ... photo14.jpg
     * - 2 linhas em sentidos contrários
     * - velocidade: usa --speed (60) como base (px/seg calculado pela largura)
     */
    const IMG_BASE = "assets/";
    const ALL = Array.from({length: 14}, (_, i) => `photo${String(i+1).padStart(2,"0")}.jpg`);

    // Mantém “random”, mas estável por sessão:
    function shuffled(arr){
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Linha 1 e linha 2 com fotos diferentes (mas podes trocar)
    const row1Imgs = shuffled(ALL);
    const row2Imgs = shuffled(ALL); // random também (não repete “buracos”)

    // Helpers
    function makeTile(src){
      const wrap = document.createElement("div");
      wrap.className = "tile";

      const img = document.createElement("img");
      img.src = IMG_BASE + src;
      img.alt = src;

      // Se falhar (imagem inexistente / path errado), remove para nunca deixar “quadrado”
      img.onerror = () => {
        wrap.remove();
      };

      wrap.appendChild(img);
      return wrap;
    }

    /**
     * Motor de “marquee” em JS
     * - sem saltos: 2 cópias do mesmo conjunto e fazemos modulo pela largura da 1ª cópia
     * - permite drag e retoma após 1s
     */
    function setupMarquee(trackEl, images, direction /* 1 = esquerda, -1 = direita */){
      // constrói 2 cópias
      const build = () => {
        trackEl.innerHTML = "";

        const frag1 = document.createDocumentFragment();
        const frag2 = document.createDocumentFragment();

        images.forEach(name => frag1.appendChild(makeTile(name)));
        images.forEach(name => frag2.appendChild(makeTile(name)));

        trackEl.appendChild(frag1);
        trackEl.appendChild(frag2);
      };

      build();

      let oneSetWidth = 0;
      let pos = 0;                 // posição atual (px)
      let lastT = performance.now();
      let running = true;
      let resumeTimer = null;

      // drag
      let dragging = false;
      let startX = 0;
      let startPos = 0;

      function measure(){
        // largura total da 1ª cópia = metade dos children
        const kids = Array.from(trackEl.children);
        const half = Math.floor(kids.length / 2);
        oneSetWidth = 0;
        for (let i = 0; i < half; i++){
          oneSetWidth += kids[i].getBoundingClientRect().width;
          // gap é 0, mas se mudares no CSS, tens de somar o gap aqui
        }

        // fallback: se ainda não há widths (imagens não carregaram), tenta de novo
        if (!oneSetWidth || oneSetWidth < 10){
          requestAnimationFrame(measure);
        }
      }

      // espera um pouco para imagens carregarem e mede
      setTimeout(measure, 80);

      function tick(t){
        const dt = (t - lastT) / 1000;
        lastT = t;

        if (running && oneSetWidth > 0){
          // velocidade baseada em --speed
          const speedBase = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--speed")) || 60;

          // px/s: quanto menor o --speed, mais rápido queremos => invertendo:
          // usamos uma velocidade proporcional à largura / speedBase
          const pxPerSec = oneSetWidth / speedBase;

          pos += (direction * pxPerSec * dt);

          // normaliza para [0, oneSetWidth)
          // (para a direita, pos pode ficar negativo)
          pos = ((pos % oneSetWidth) + oneSetWidth) % oneSetWidth;

          // aplica
          trackEl.style.transform = `translate3d(${-pos}px,0,0)`;
        }

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      // Pointer events para drag (mobile e desktop)
      const rowEl = trackEl.parentElement;

      function onDown(e){
        dragging = true;
        running = false;
        if (resumeTimer) clearTimeout(resumeTimer);

        rowEl.setPointerCapture?.(e.pointerId);
        startX = e.clientX;
        startPos = pos;
      }

      function onMove(e){
        if (!dragging || oneSetWidth <= 0) return;
        const dx = e.clientX - startX;
        // arrastar para a direita deve “puxar” imagens para a direita => diminuir pos
        pos = startPos - dx;
        pos = ((pos % oneSetWidth) + oneSetWidth) % oneSetWidth;
        trackEl.style.transform = `translate3d(${-pos}px,0,0)`;
      }

      function onUp(e){
        if (!dragging) return;
        dragging = false;

        // retoma ao fim de 1s
        resumeTimer = setTimeout(() => {
          running = true;
          lastT = performance.now();
        }, 1000);
      }

      rowEl.addEventListener("pointerdown", onDown, {passive:true});
      rowEl.addEventListener("pointermove", onMove, {passive:true});
      rowEl.addEventListener("pointerup", onUp, {passive:true});
      rowEl.addEventListener("pointercancel", onUp, {passive:true});

      // Se o ecrã mudar (rotate), re-mede para não criar “saltos”
      window.addEventListener("resize", () => {
        setTimeout(measure, 120);
      });
    }

    // Inicializa
    setupMarquee(document.getElementById("track1"), row1Imgs, 1);   // esquerda
    setupMarquee(document.getElementById("track2"), row2Imgs, -1);  // direita
  </script>
</body>
</html>
