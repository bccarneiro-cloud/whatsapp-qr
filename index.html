<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    html { height: -webkit-fill-available; }
    body{
      margin:0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#fff;
    }

    /* Layout 50/50 */
    .app{
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: 1fr 1fr;
    }

    /* ---------------- TOP (slideshow) ---------------- */
    .top{
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .slideshow{
      position:absolute;
      inset:0;
    }

    .slide{
      position:absolute;
      inset:0;
      opacity: 0;
      transition: opacity 1.2s ease;
      will-change: opacity;
    }
    .slide.active{ opacity: 1; }

    /* Fundo blur usando a própria imagem (evita barras brancas feias) */
    .slide .bg{
      position:absolute;
      inset:-20px;               /* margem para o blur não cortar */
      background-position: center;
      background-size: cover;
      filter: blur(18px);
      transform: scale(1.08);     /* evita bordas do blur */
      opacity: 0.95;
    }

    /* Camada por cima para escurecer um pouco e dar contraste */
    .slide .shade{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,0.18);
    }

    /* ✅ Foto completa na metade do ecrã */
    .slide img{
      position: relative;
      z-index: 1;
      width:100%;
      height:100%;
      object-fit: contain;        /* mostra a foto toda */
      object-position: center;
      display:block;
      transform:none !important;
      animation:none !important;
      filter:none !important;
    }

    /* ---------------- BOTTOM (logo) ---------------- */
    .bottom{
      position: relative;
      overflow: hidden;
      background: #fff;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ✅ Logo toca no topo e fundo da metade inferior */
    .logo{
      position:absolute;
      inset: 0;
      background-image: url("./background.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;  /* inteiro */
      /* ocupar a área toda */
      width: 100%;
      height: 100%;
    }

    /* Botão topo */
    .corner{
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      z-index: 10;
    }

    .corner a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 12px 14px;
      border-radius: 999px;
      text-decoration:none;
      font-weight: 900;
      font-size: 13px;
      color: rgba(10,10,10,.92);
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 14px 40px rgba(0,0,0,.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .corner a:active{ transform: scale(.98); }

    /* Evitar flash inicial */
    .loadingCover{
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events:none;
    }
    .loadingCover.show{ opacity: 1; }
  </style>
</head>

<body>
  <div class="corner">
    <a href="./qr_contact/">Contactos / Contacts</a>
  </div>

  <div class="app">
    <section class="top">
      <div class="slideshow" id="slideshow" aria-hidden="true"></div>
    </section>

    <section class="bottom">
      <div class="logo" aria-hidden="true"></div>
    </section>
  </div>

  <div class="loadingCover" id="loadingCover"></div>

  <script>
    const photos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg"
    ];

    const container = document.getElementById("slideshow");
    const loadingCover = document.getElementById("loadingCover");

    function preload(src){
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(src);
        img.onerror = () => reject(src);
        img.src = src;
      });
    }

    function createSlides(list){
      return list.map((src, idx) => {
        const s = document.createElement("div");
        s.className = "slide";

        // background blur layer
        const bg = document.createElement("div");
        bg.className = "bg";
        bg.style.backgroundImage = `url("${src}")`;

        const shade = document.createElement("div");
        shade.className = "shade";

        const img = document.createElement("img");
        img.src = src;
        img.alt = "Work " + (idx + 1);

        s.appendChild(bg);
        s.appendChild(shade);
        s.appendChild(img);

        container.appendChild(s);
        return s;
      });
    }

    function startSlideshow(slides){
      let idx = 0;
      const INTERVAL = 4500;

      const show = (i) => {
        slides.forEach(s => s.classList.remove("active"));
        slides[i].classList.add("active");
      };

      show(idx);

      setInterval(() => {
        idx = (idx + 1) % slides.length;
        show(idx);
      }, INTERVAL);
    }

    (async function init(){
      loadingCover.classList.add("show");

      try{
        await preload(photos[0]);
      }catch(e){
        for (let i = 1; i < photos.length; i++){
          try{
            await preload(photos[i]);
            const ok = photos.splice(i,1)[0];
            photos.unshift(ok);
            break;
          }catch(_){}
        }
      }

      const slides = createSlides(photos);
      Promise.allSettled([preload(photos[1]), preload(photos[2])]);

      loadingCover.classList.remove("show");
      startSlideshow(slides);
    })();
  </script>
</body>
</html>
