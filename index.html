<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Things</title>

<style>
:root{
  --speed: 52s;
  --tileW: 320px;
  --tileWMobile: 240px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui}

.page{
  display:grid;
  grid-template-rows: 2fr 1fr;
  height:100vh;
  background:#000;
}

.slides{
  display:flex;
  flex-direction:column;
  height:100%;
}

.row{
  height:50%;
  overflow:hidden;
}

.track{
  display:flex;
  width:max-content;
  animation: scroll var(--speed) linear infinite;
}

.row.reverse .track{
  animation-direction: reverse;
}

.tile{
  width:var(--tileW);
  height:100%;
  flex:0 0 var(--tileW);
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
}

.tile img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
}

@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

.logoWrap{
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.logoWrap img{
  max-height:100%;
  max-width:100%;
  object-fit:contain;
}

.cta{
  margin-top:10px;
  padding:14px 22px;
  border-radius:999px;
  font-size:18px;
  font-weight:800;
  background:#ffd6e6;
  color:#6a1b4d;
  text-decoration:none;
  animation:flash 1.2s infinite;
}

@keyframes flash{
  0%,100%{opacity:1}
  50%{opacity:.55}
}

@media(max-width:768px){
  .tile{
    width:var(--tileWMobile);
    flex-basis:var(--tileWMobile);
  }
  .logoWrap{padding-bottom:6vh}
}
</style>
</head>

<body>
<div class="page">

<!-- SLIDES -->
<div class="slides">

<!-- LINHA 1 -->
<div class="row">
<div class="track">
  <!-- ORIGINAL -->
  <div class="tile"><img src="assets/photo01.jpg"></div>
  <div class="tile"><img src="assets/photo02.jpg"></div>
  <div class="tile"><img src="assets/photo03.jpg"></div>
  <div class="tile"><img src="assets/photo04.jpg"></div>
  <div class="tile"><img src="assets/photo05.jpg"></div>
  <div class="tile"><img src="assets/photo06.jpg"></div>
  <div class="tile"><img src="assets/photo07.jpg"></div>

  <!-- DUPLICADO IDENTICO -->
  <div class="tile"><img src="assets/photo01.jpg"></div>
  <div class="tile"><img src="assets/photo02.jpg"></div>
  <div class="tile"><img src="assets/photo03.jpg"></div>
  <div class="tile"><img src="assets/photo04.jpg"></div>
  <div class="tile"><img src="assets/photo05.jpg"></div>
  <div class="tile"><img src="assets/photo06.jpg"></div>
  <div class="tile"><img src="assets/photo07.jpg"></div>
</div>
</div>

<!-- LINHA 2 -->
<div class="row reverse">
<div class="track">
  <!-- ORIGINAL -->
  <div class="tile"><img src="assets/photo08.jpg"></div>
  <div class="tile"><img src="assets/photo09.jpg"></div>
  <div class="tile"><img src="assets/photo10.jpg"></div>
  <div class="tile"><img src="assets/photo11.jpg"></div>
  <div class="tile"><img src="assets/photo12.jpg"></div>
  <div class="tile"><img src="assets/photo13.jpg"></div>
  <div class="tile"><img src="assets/photo14.jpg"></div>

  <!-- DUPLICADO IDENTICO -->
  <div class="tile"><img src="assets/photo08.jpg"></div>
  <div class="tile"><img src="assets/photo09.jpg"></div>
  <div class="tile"><img src="assets/photo10.jpg"></div>
  <div class="tile"><img src="assets/photo11.jpg"></div>
  <div class="tile"><img src="assets/photo12.jpg"></div>
  <div class="tile"><img src="assets/photo13.jpg"></div>
  <div class="tile"><img src="assets/photo14.jpg"></div>
</div>
</div>

</div>

<!-- LOGO -->
<div class="logoWrap">
  <img src="background.png" alt="Little Things">
  <a class="cta" href="https://www.littlethings.events/qr_contact/">
    Contactos / Contacts
  </a>
</div>

</div>
</body>
</html>
