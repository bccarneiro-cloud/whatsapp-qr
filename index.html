<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    :root{
      --speed-top: 60s;
      --speed-bottom: 60s;
      --logo-height: 33vh;
      --rows-height: 67vh;
    }

    *{ box-sizing:border-box; }
    html, body {
      height:100%;
      margin:0;
      background:#fff;
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    .page{
      height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* ================= SLIDES (2/3) ================= */
    .rows{
      height: var(--rows-height);
      display:flex;
      flex-direction:column;
    }

    .row{
      flex:1;
      overflow:hidden;
      background:#fff;
    }

    .track{
      height:100%;
      display:flex;
      gap:0;
      will-change: transform;
    }

    .row.top .track{
      animation: scroll-left var(--speed-top) linear infinite;
    }

    .row.bottom .track{
      animation: scroll-right var(--speed-bottom) linear infinite;
    }

    @keyframes scroll-left{
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    @keyframes scroll-right{
      from { transform: translateX(-50%); }
      to   { transform: translateX(0); }
    }

    .tile{
      height:100%;
      flex:0 0 auto;
      width:33.333vw;
      min-width:240px;
      max-width:520px;
      overflow:hidden;
      background:#fff;
    }

    @media (max-width:900px){
      .tile{ width:50vw; min-width:180px; }
    }

    @media (max-width:520px){
      .tile{ width:70vw; min-width:160px; }
    }

    .tile img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center;
      transform:none !important;
      animation:none !important;
    }

    /* ================= LOGO + CONTACTOS (1/3) ================= */
    .logoWrap{
      height: var(--logo-height);
      background:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .logoWrap img{
      height:100%;
      max-height: calc(100% - 60px);
      width:auto;
      max-width:100%;
      object-fit:contain;
      display:block;
    }

    /* ✅ BOTÃO CORRETO: SEM position:absolute */
    .cta{
      margin-top:10px;

      padding:14px 22px;
      border-radius:999px;
      font-size:18px;
      font-weight:800;
      background:#ffd6e6;
      color:#6a1b4d;
      text-decoration:none;

      animation: flash 1.2s infinite;
      box-shadow:0 8px 20px rgba(0,0,0,.12);
      white-space:nowrap;
    }

    @keyframes flash{
      0%,100%{ opacity:1; }
      50%{ opacity:.65; }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- SLIDES -->
    <div class="rows">
      <div class="row top">
        <div class="track" id="trackTop"></div>
      </div>
      <div class="row bottom">
        <div class="track" id="trackBottom"></div>
      </div>
    </div>

    <!-- LOGO + CONTACTOS -->
    <div class="logoWrap">
      <img src="background.png" alt="Little Things">
      <a class="cta" href="https://www.littlethings.events/qr_contact/">
        Contactos / Contacts
      </a>
    </div>

  </div>

  <script>
    // TODAS as fotos, SEM filtros
    const photos = [
      "assets/photo01.jpg","assets/photo02.jpg","assets/photo03.jpg","assets/photo04.jpg",
      "assets/photo05.jpg","assets/photo06.jpg","assets/photo07.jpg","assets/photo08.jpg",
      "assets/photo09.jpg","assets/photo10.jpg","assets/photo11.jpg","assets/photo12.jpg",
      "assets/photo13.jpg","assets/photo14.jpg"
    ];

    function buildTrack(trackEl, list){
      const loop = list.concat(list);
      trackEl.innerHTML = loop.map(src =>
        `<div class="tile"><img src="${src}" alt=""></div>`
      ).join("");
    }

    buildTrack(document.getElementById("trackTop"), photos);
    buildTrack(document.getElementById("trackBottom"), photos);
  </script>
</body>
</html>
