<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    :root{
      --gap: 14px;
      --radius: 18px;
      --cardBg: rgba(255,255,255,0.50);
      --cardBorder: rgba(255,255,255,0.60);
      --shadow: 0 18px 55px rgba(0,0,0,0.18);
    }

    * { box-sizing: border-box; }
    html { height: -webkit-fill-available; }
    body{
      margin:0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow:hidden;
      background: #fff;
    }

    /* Fundo suave (opcional) */
    .bg{
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 10%, rgba(255,192,203,0.22), transparent 55%),
                  radial-gradient(circle at 80% 60%, rgba(255,182,193,0.18), transparent 60%),
                  #ffffff;
      z-index: -2;
    }

    /* Container geral (mosaico em 3 faixas) */
    .wrap{
      position: fixed;
      inset: 0;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom)) 16px;
      display: grid;
      grid-template-rows: 0.95fr 0.75fr 1.30fr; /* parecido com o teu sketch */
      gap: var(--gap);
    }

    /* Cada faixa com “cartão” tipo vidro */
    .laneCard{
      border-radius: 28px;
      background: var(--cardBg);
      border: 1px solid var(--cardBorder);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      position: relative;
    }

    /* Rolo horizontal */
    .marquee{
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .track{
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      width: max-content;
      will-change: transform;
      animation: scroll var(--duration, 28s) linear infinite;
    }

    /* Direção invertida quando necessário */
    .reverse .track{
      animation-name: scrollReverse;
    }

    @keyframes scroll{
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-1 * var(--shift))); }
    }
    @keyframes scrollReverse{
      from { transform: translateX(calc(-1 * var(--shift))); }
      to   { transform: translateX(0); }
    }

    /* Tile (cada foto no mosaico) */
    .tile{
      position: relative;
      flex: 0 0 auto;
      width: var(--tileW, 220px);
      height: var(--tileH, 140px);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
      background: #000;
    }

    /* Blur por trás para não haver “barras brancas” */
    .tile .blur{
      position: absolute;
      inset: -20px;
      background-position: center;
      background-size: cover;
      filter: blur(14px);
      transform: scale(1.08);
      opacity: 0.90;
    }

    /* Foto inteira (sem cortar) */
    .tile img{
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;   /* ✅ foto completa */
      object-position: center;
      display: block;
    }

    /* Topo: 2 tiles “grandes” (mosaico mais largo) */
    .lane1 { --tileH: 150px; }
    .lane1 .tile{ --tileW: 260px; }

    /* Meio: tiles mais compactos */
    .lane2 { --tileH: 130px; }
    .lane2 .tile{ --tileW: 210px; }

    /* Fundo: tiles maiores (como no desenho) */
    .lane3 { --tileH: 190px; }
    .lane3 .tile{ --tileW: 300px; }

    /* Ajustes mobile */
    @media (max-width: 520px){
      .wrap{
        padding: calc(14px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom)) 12px;
        gap: 12px;
        grid-template-rows: 0.95fr 0.75fr 1.35fr;
      }
      .lane1 .tile{ --tileW: 240px; }
      .lane2 .tile{ --tileW: 190px; }
      .lane3 .tile{ --tileW: 270px; }
    }

    /* Botão Contactos */
    .corner{
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      z-index: 10;
    }
    .corner a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 12px 14px;
      border-radius: 999px;
      text-decoration:none;
      font-weight: 900;
      font-size: 13px;
      color: rgba(10,10,10,.92);
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 14px 40px rgba(0,0,0,.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .corner a:active{ transform: scale(.98); }

    /* Pequena etiqueta opcional por faixa */
    .label{
      position:absolute;
      left: 14px;
      top: 12px;
      z-index: 2;
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      color: rgba(10,10,10,.85);
      background: rgba(255,255,255,0.65);
      border: 1px solid rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="corner">
    <a href="./qr_contact/">Contactos / Contacts</a>
  </div>

  <main class="wrap">
    <section class="laneCard lane1" id="lane1">
      <div class="label">Decoração ✨</div>
      <div class="marquee">
        <div class="track" id="track1"></div>
      </div>
    </section>

    <section class="laneCard lane2 reverse" id="lane2">
      <div class="label">Detalhes 🎀</div>
      <div class="marquee">
        <div class="track" id="track2"></div>
      </div>
    </section>

    <section class="laneCard lane3" id="lane3">
      <div class="label">Eventos 🎉</div>
      <div class="marquee">
        <div class="track" id="track3"></div>
      </div>
    </section>
  </main>

  <script>
    // ✅ Mete as 14 fotos nesta pasta: /assets/photo01.jpg ... photo14.jpg
    const photos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg"
    ];

    function makeTile(src){
      const tile = document.createElement("div");
      tile.className = "tile";

      const blur = document.createElement("div");
      blur.className = "blur";
      blur.style.backgroundImage = `url("${src}")`;

      const img = document.createElement("img");
      img.src = src;
      img.alt = "Little Things";

      tile.appendChild(blur);
      tile.appendChild(img);
      return tile;
    }

    // Cria uma sequência longa e duplica para rolar “sem cortes”
    function fillTrack(trackEl, list, repeatTimes){
      trackEl.innerHTML = "";
      const seq = [];
      for(let r=0; r<repeatTimes; r++){
        for(const src of list){
          const t = makeTile(src);
          trackEl.appendChild(t);
          seq.push(t);
        }
      }
      return seq;
    }

    function shuffle(arr){
      const a = [...arr];
      for(let i=a.length-1; i>0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function setupMarquee(trackId, speedSeconds, list){
      const track = document.getElementById(trackId);

      // baralhar para cada faixa ter ordem diferente
      const shuffled = shuffle(list);

      // repetir algumas vezes para ficar comprido
      fillTrack(track, shuffled, 2);

      // depois de renderizar, medimos largura para definir "shift"
      requestAnimationFrame(() => {
        const fullWidth = track.scrollWidth;

        // Queremos rolar metade do conteúdo (porque duplicámos 2x)
        const shift = fullWidth / 2;

        track.style.setProperty("--shift", shift + "px");
        track.style.setProperty("--duration", speedSeconds + "s");
      });
    }

    // 3 faixas com velocidades diferentes (efeito futurista mas clássico)
    setupMarquee("track1", 34, photos);
    setupMarquee("track2", 28, photos);
    setupMarquee("track3", 40, photos);

    // Recalcular ao mudar o tamanho (orientação/desktop)
    window.addEventListener("resize", () => {
      setupMarquee("track1", 34, photos);
      setupMarquee("track2", 28, photos);
      setupMarquee("track3", 40, photos);
    });
  </script>
</body>
</html>
