<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Things</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:#000; /* evita flashes brancos */
}

/* ===== LAYOUT ===== */
.wrap{
  width:100%;
  height:100vh;
  display:grid;
  grid-template-rows: 2fr 1fr; /* 2/3 slideshow | 1/3 logo */
}

/* ===== SLIDESHOW ===== */
.slideshow{
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:#000;
}

.lane{
  flex:1;
  display:flex;
  align-items:stretch;
  overflow:hidden;
}

.track{
  display:flex;
  gap:0; /* SEM ESPAÇOS */
  animation: scroll linear infinite;
}

.track.reverse{
  animation-direction: reverse;
}

.slide{
  height:100%;
  width:auto;
  aspect-ratio: 4 / 3;
  flex-shrink:0;
  overflow:hidden;
}

.slide img{
  width:100%;
  height:100%;
  object-fit: cover;   /* 🔥 ISTO REMOVE OS ESPAÇOS */
  display:block;
}

/* ===== ANIMAÇÃO ===== */
@keyframes scroll{
  from{ transform: translateX(0); }
  to{ transform: translateX(-50%); }
}

/* VELOCIDADE */
.lane:nth-child(1) .track{ animation-duration: 45s; }
.lane:nth-child(2) .track{ animation-duration: 55s; }

/* ===== LOGO ===== */
.logoArea{
  position:relative;
  width:100%;
  height:100%;
  background:#fff;
}

.logoInner{
  position:absolute;
  inset:0;
  display:flex;
  align-items:stretch;
  justify-content:center;
}

.logoInner img{
  height:100%;
  width:auto;
  max-width:100%;
  object-fit:contain;
}

/* ===== MOBILE ===== */
@media (max-width:768px){

  .logoInner{
    padding-bottom: 6vh; /* sobe o logo */
    padding-top: 2vh;
  }

  .logoInner img{
    height: 92%; /* evita corte em baixo */
  }

}
</style>
</head>

<body>

<div class="wrap">

  <!-- SLIDESHOW -->
  <section class="slideshow">

    <div class="lane">
      <div class="track">
        <div class="slide"><img src="./assets/photo01.jpg"></div>
        <div class="slide"><img src="./assets/photo02.jpg"></div>
        <div class="slide"><img src="./assets/photo03.jpg"></div>
        <div class="slide"><img src="./assets/photo04.jpg"></div>
        <div class="slide"><img src="./assets/photo05.jpg"></div>

        <!-- duplicação -->
        <div class="slide"><img src="./assets/photo01.jpg"></div>
        <div class="slide"><img src="./assets/photo02.jpg"></div>
        <div class="slide"><img src="./assets/photo03.jpg"></div>
        <div class="slide"><img src="./assets/photo04.jpg"></div>
        <div class="slide"><img src="./assets/photo05.jpg"></div>
      </div>
    </div>

    <div class="lane">
      <div class="track reverse">
        <div class="slide"><img src="./assets/photo06.jpg"></div>
        <div class="slide"><img src="./assets/photo07.jpg"></div>
        <div class="slide"><img src="./assets/photo08.jpg"></div>
        <div class="slide"><img src="./assets/photo09.jpg"></div>
        <div class="slide"><img src="./assets/photo10.jpg"></div>

        <div class="slide"><img src="./assets/photo06.jpg"></div>
        <div class="slide"><img src="./assets/photo07.jpg"></div>
        <div class="slide"><img src="./assets/photo08.jpg"></div>
        <div class="slide"><img src="./assets/photo09.jpg"></div>
        <div class="slide"><img src="./assets/photo10.jpg"></div>
      </div>
    </div>

  </section>

  <!-- LOGO -->
  <section class="logoArea">
    <div class="logoInner">
      <img src="./background.png" alt="Little Things Logo">
    </div>
  </section>

</div>

</body>
</html>
