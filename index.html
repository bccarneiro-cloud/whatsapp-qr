<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    :root{
      --gap: 14px;
      --radius: 18px;
      --glass: rgba(255,255,255,0.55);
      --glassBorder: rgba(255,255,255,0.60);
      --shadow: 0 18px 55px rgba(0,0,0,0.18);
    }

    *{ box-sizing: border-box; }
    html{ height: -webkit-fill-available; }
    body{
      margin:0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fff;
      overflow: hidden;
    }

    /* Fundo suave */
    .bg{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,192,203,0.22), transparent 55%),
        radial-gradient(circle at 80% 60%, rgba(255,182,193,0.18), transparent 60%),
        #ffffff;
      z-index: -2;
    }

    /* Botão Contactos */
    .corner{
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      z-index: 10;
    }
    .corner a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 12px 14px;
      border-radius: 999px;
      text-decoration:none;
      font-weight: 900;
      font-size: 13px;
      color: rgba(10,10,10,.92);
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 14px 40px rgba(0,0,0,.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .corner a:active{ transform: scale(.98); }

    /* Layout: topo (2/3) + fundo (1/3) */
    .wrap{
      position: fixed;
      inset: 0;
      padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)) 16px;
      display: grid;
      grid-template-rows: 2fr 1fr; /* ✅ 2/3 e 1/3 */
      gap: var(--gap);
    }

    /* Topo tem 2 linhas */
    .top{
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: var(--gap);
      min-height: 0;
    }

    .laneCard{
      border-radius: 28px;
      background: var(--glass);
      border: 1px solid var(--glassBorder);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    .marquee{
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .track{
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      width: max-content;
      will-change: transform;
      animation: scroll var(--duration, 60s) linear infinite;
    }

    .reverse .track{
      animation-name: scrollReverse;
    }

    @keyframes scroll{
      from { transform: translateX(0); }
      to   { transform: translateX(calc(-1 * var(--shift))); }
    }
    @keyframes scrollReverse{
      from { transform: translateX(calc(-1 * var(--shift))); }
      to   { transform: translateX(0); }
    }

    /* Tiles */
    .tile{
      position: relative;
      flex: 0 0 auto;
      width: var(--tileW, 240px);
      height: var(--tileH, 170px);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0,0,0,0.18);
      background: #000;
    }

    /* blur para preencher atrás (sem barras brancas) */
    .tile .blur{
      position: absolute;
      inset: -22px;
      background-position: center;
      background-size: cover;
      filter: blur(14px);
      transform: scale(1.08);
      opacity: 0.92;
    }

    /* Foto completa (sem cortar) */
    .tile img{
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain; /* ✅ foto inteira */
      object-position: center;
      display: block;
    }

    /* Ajustes por tamanho */
    .laneA .tile{ --tileW: 280px; --tileH: 190px; }
    .laneB .tile{ --tileW: 240px; --tileH: 170px; }

    @media (max-width: 520px){
      .wrap{
        padding: calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom)) 12px;
        gap: 12px;
      }
      .laneA .tile{ --tileW: 250px; --tileH: 180px; }
      .laneB .tile{ --tileW: 220px; --tileH: 160px; }
    }

    /* Logo em baixo (1/3) */
    .logoCard{
      border-radius: 28px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.60);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      position: relative;
      display: grid;
      place-items: center;
    }

    /* O logo deve tocar “por dentro” sem margem extra */
    .logoInner{
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 0; /* ✅ sem margem */
    }

    .logoInner img{
      width: 100%;
      height: 100%;
      object-fit: contain; /* ✅ não deturpa */
      object-position: center;
      display:block;
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true"></div>

  <div class="corner">
    <a href="./qr_contact/">Contactos / Contacts</a>
  </div>

  <main class="wrap">
    <section class="top">
      <div class="laneCard laneA" id="lane1">
        <div class="marquee">
          <div class="track" id="track1"></div>
        </div>
      </div>

      <div class="laneCard laneB reverse" id="lane2">
        <div class="marquee">
          <div class="track" id="track2"></div>
        </div>
      </div>
    </section>

    <section class="logoCard" aria-label="Logo Little Things">
      <div class="logoInner">
        <img src="./background.png" alt="Little Things logo" />
      </div>
    </section>
  </main>

  <script>
    // ✅ Mete as 14 fotos nesta pasta: /assets/photo01.jpg ... photo14.jpg
    const photos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg"
    ];

    function makeTile(src){
      const tile = document.createElement("div");
      tile.className = "tile";

      const blur = document.createElement("div");
      blur.className = "blur";
      blur.style.backgroundImage = `url("${src}")`;

      const img = document.createElement("img");
      img.src = src;
      img.alt = "Little Things";

      tile.appendChild(blur);
      tile.appendChild(img);
      return tile;
    }

    function shuffle(arr){
      const a = [...arr];
      for(let i=a.length-1; i>0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function fillTrack(trackEl, list, repeatTimes){
      trackEl.innerHTML = "";
      for(let r=0; r<repeatTimes; r++){
        for(const src of list){
          trackEl.appendChild(makeTile(src));
        }
      }
    }

    function setupMarquee(trackId, speedSeconds, list){
      const track = document.getElementById(trackId);

      const shuffled = shuffle(list);
      // duplicar 2x para scroll contínuo
      fillTrack(track, shuffled, 2);

      requestAnimationFrame(() => {
        const fullWidth = track.scrollWidth;
        const shift = fullWidth / 2; // metade porque duplicámos
        track.style.setProperty("--shift", shift + "px");
        track.style.setProperty("--duration", speedSeconds + "s");
      });
    }

    // ✅ Devagar + sentidos contrários
    setupMarquee("track1", 70, photos); // mais lento
    setupMarquee("track2", 70, photos); // mais lento

    window.addEventListener("resize", () => {
      setupMarquee("track1", 70, photos);
      setupMarquee("track2", 70, photos);
    });
  </script>
</body>
</html>
