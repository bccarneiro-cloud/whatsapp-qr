<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Little Things</title>

  <style>
    html { height: -webkit-fill-available; }
    body{
      margin:0;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      overflow:hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#fff;
    }

    /* Slideshow a ocupar tudo (sem zoom / sem corte) */
    .slideshow{
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      background:#fff;
    }

    .slide{
      position:absolute;
      inset:0;
      opacity: 0;
      transition: opacity 1.2s ease;
      will-change: opacity;
      background:#fff;
    }
    .slide.active{ opacity: 1; }

    /* ✅ sem zoom: não corta a foto, mostra-a inteira */
    .slide img{
      width:100%;
      height:100%;
      object-fit: contain;   /* <-- isto remove o “zoom/corte” */
      object-position: center;
      display:block;
      transform:none !important;
      animation:none !important;
      filter:none !important;
      background:#fff;
    }

    /* Banda inferior para o logo ocupar o bottom todo */
    .logo-band{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: min(34vh, 320px);
      z-index: 3;
      pointer-events: none;

      /* fundo branco (para o logo nunca ficar “solto”) */
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);

      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: calc(env(safe-area-inset-bottom) + 10px);
    }

    /* O logo ocupa toda a largura da banda */
    .logo{
      width: min(92vw, 900px);
      height: 100%;
      background-image: url("./background.png");
      background-repeat: no-repeat;

      /* ✅ aqui o segredo: ocupa a largura, encostado ao fundo */
      background-position: center bottom;
      background-size: 100% auto; /* <-- full width; mantém proporção */
    }

    /* Um fade por cima da banda para transição bonita */
    .logo-fade{
      position: fixed;
      left: 0;
      right: 0;
      bottom: min(34vh, 320px);
      height: 14vh;
      z-index: 2;
      pointer-events:none;
      background: linear-gradient(
        to top,
        rgba(255,255,255,0.00),
        rgba(255,255,255,0.55),
        rgba(255,255,255,0.92)
      );
    }

    /* Botão topo */
    .corner{
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      z-index: 10;
    }

    .corner a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 12px 14px;
      border-radius: 999px;
      text-decoration:none;
      font-weight: 900;
      font-size: 13px;
      color: rgba(10,10,10,.92);
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 14px 40px rgba(0,0,0,.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .corner a:active{ transform: scale(.98); }

    /* Evitar flash inicial */
    .loadingCover{
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #fff;
      opacity: 0;
      transition: opacity .2s ease;
      pointer-events:none;
    }
    .loadingCover.show{ opacity: 1; }
  </style>
</head>

<body>
  <div class="slideshow" id="slideshow" aria-hidden="true"></div>

  <div class="logo-fade" aria-hidden="true"></div>
  <div class="logo-band" aria-hidden="true">
    <div class="logo"></div>
  </div>

  <div class="corner">
    <a href="./qr_contact/">Contactos / Contacts</a>
  </div>

  <div class="loadingCover" id="loadingCover"></div>

  <script>
    const photos = [
      "./assets/photo01.jpg",
      "./assets/photo02.jpg",
      "./assets/photo03.jpg",
      "./assets/photo04.jpg",
      "./assets/photo05.jpg",
      "./assets/photo06.jpg",
      "./assets/photo07.jpg",
      "./assets/photo08.jpg",
      "./assets/photo09.jpg",
      "./assets/photo10.jpg",
      "./assets/photo11.jpg",
      "./assets/photo12.jpg",
      "./assets/photo13.jpg",
      "./assets/photo14.jpg"
    ];

    const container = document.getElementById("slideshow");
    const loadingCover = document.getElementById("loadingCover");

    function preload(src){
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(src);
        img.onerror = () => reject(src);
        img.src = src;
      });
    }

    function createSlides(list){
      return list.map((src, idx) => {
        const s = document.createElement("div");
        s.className = "slide";

        const img = document.createElement("img");
        img.src = src;
        img.alt = "Work " + (idx + 1);

        s.appendChild(img);
        container.appendChild(s);
        return s;
      });
    }

    function startSlideshow(slides){
      let idx = 0;
      const INTERVAL = 4500;

      const show = (i) => {
        slides.forEach(s => s.classList.remove("active"));
        slides[i].classList.add("active");
      };

      show(idx);

      setInterval(() => {
        idx = (idx + 1) % slides.length;
        show(idx);
      }, INTERVAL);
    }

    (async function init(){
      loadingCover.classList.add("show");

      try{
        await preload(photos[0]);
      }catch(e){
        for (let i = 1; i < photos.length; i++){
          try{
            await preload(photos[i]);
            const ok = photos.splice(i,1)[0];
            photos.unshift(ok);
            break;
          }catch(_){}
        }
      }

      const slides = createSlides(photos);
      Promise.allSettled([preload(photos[1]), preload(photos[2])]);

      loadingCover.classList.remove("show");
      startSlideshow(slides);
    })();
  </script>
</body>
</html>
