<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Little Things</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  overflow: hidden;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

/* ===== LAYOUT ===== */
.page {
  height: 100vh;
  display: grid;
  grid-template-rows: 2fr 1fr; /* 2/3 slideshow | 1/3 logo */
  background: #000;
}

/* ===== SLIDESHOW ===== */
.slideshow {
  overflow: hidden;
}

.row {
  height: 50%;
  display: flex;
  overflow: hidden;
}

.track {
  display: flex;
  width: max-content;
  animation: scroll 18s linear infinite;
}

.track.reverse {
  animation-direction: reverse;
}

.slide {
  flex-shrink: 0;
}

.slide img {
  height: 100%;
  display: block;
}

/* animação */
@keyframes scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* ===== LOGO ===== */
.logoArea {
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.logoArea img {
  height: 100%;
  width: auto;
  object-fit: contain;
}

/* ===== MOBILE FIX ===== */
@media (max-width: 768px) {
  .page {
    grid-template-rows: 2.2fr 1.2fr;
  }

  .logoArea {
    padding-bottom: 6vh;
  }

  .logoArea img {
    height: 90%;
  }
}
</style>
</head>

<body>

<div class="page">

  <!-- SLIDESHOW -->
  <div class="slideshow">

    <!-- LINHA 1 -->
    <div class="row">
      <div class="track">
        <div class="slide"><img src="assets/photo01.jpg"></div>
        <div class="slide"><img src="assets/photo02.jpg"></div>
        <div class="slide"><img src="assets/photo03.jpg"></div>
        <div class="slide"><img src="assets/photo04.jpg"></div>
        <div class="slide"><img src="assets/photo05.jpg"></div>
        <div class="slide"><img src="assets/photo06.jpg"></div>
        <div class="slide"><img src="assets/photo07.jpg"></div>

        <!-- duplicação para loop perfeito -->
        <div class="slide"><img src="assets/photo01.jpg"></div>
        <div class="slide"><img src="assets/photo02.jpg"></div>
        <div class="slide"><img src="assets/photo03.jpg"></div>
        <div class="slide"><img src="assets/photo04.jpg"></div>
        <div class="slide"><img src="assets/photo05.jpg"></div>
        <div class="slide"><img src="assets/photo06.jpg"></div>
        <div class="slide"><img src="assets/photo07.jpg"></div>
      </div>
    </div>

    <!-- LINHA 2 (sentido contrário) -->
    <div class="row">
      <div class="track reverse">
        <div class="slide"><img src="assets/photo08.jpg"></div>
        <div class="slide"><img src="assets/photo09.jpg"></div>
        <div class="slide"><img src="assets/photo10.jpg"></div>
        <div class="slide"><img src="assets/photo11.jpg"></div>
        <div class="slide"><img src="assets/photo12.jpg"></div>
        <div class="slide"><img src="assets/photo13.jpg"></div>
        <div class="slide"><img src="assets/photo14.jpg"></div>

        <!-- duplicação -->
        <div class="slide"><img src="assets/photo08.jpg"></div>
        <div class="slide"><img src="assets/photo09.jpg"></div>
        <div class="slide"><img src="assets/photo10.jpg"></div>
        <div class="slide"><img src="assets/photo11.jpg"></div>
        <div class="slide"><img src="assets/photo12.jpg"></div>
        <div class="slide"><img src="assets/photo13.jpg"></div>
        <div class="slide"><img src="assets/photo14.jpg"></div>
      </div>
    </div>

  </div>

  <!-- LOGO -->
  <div class="logoArea">
    <img src="background.png" alt="Little Things logo">
  </div>

</div>

</body>
</html>
