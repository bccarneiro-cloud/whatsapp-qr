<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Meus pedidos</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px}
    .sub{font-size:12px;opacity:.75;margin-top:2px}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
    .readonly input,.readonly textarea{background:rgba(255,255,255,.04)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(max-width:760px){.grid2{grid-template-columns:1fr}}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:14px;vertical-align:top}
    .btnTiny{padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:transparent;color:#eaf1ff;cursor:pointer}
  </style>
</head>
<body>
  <div class="container">
    <div class="row" style="justify-content:space-between; margin-bottom:12px;">
      <h1>Meus pedidos</h1>
      <div class="row">
        <a class="link" href="new-request.html">Novo pedido</a>
        <button class="btn secondary" id="btnOut">Sair</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <button class="btn secondary" id="btnRefresh">Atualizar</button>
        <div class="small" id="count">0 pedidos</div>
      </div>

      <div style="margin-top:10px;overflow:auto">
        <table>
          <thead>
            <tr>
              <th style="min-width:170px">Criado</th>
              <th style="min-width:170px">Evento</th>
              <th style="min-width:120px">Data</th>
              <th style="min-width:120px">Estado</th>
              <th style="min-width:90px"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="small" id="msgList"></div>
    </div>

    <div class="card readonly">
      <h2 style="margin-top:0">Pedido (leitura)</h2>

      <div class="grid2">
        <div>
          <label>ID</label>
          <input id="rid" readonly />
        </div>
        <div>
          <label>Estado</label>
          <input id="rstatus" readonly />
        </div>
      </div>

      <div class="grid2">
        <div>
          <label>Tipo de evento</label>
          <input id="revent" readonly />
        </div>
        <div>
          <label>Data do evento</label>
          <input id="rdate" readonly />
          <div class="sub">DD/MM/AAAA</div>
        </div>
      </div>

      <div class="grid2">
        <div>
          <label>Local</label>
          <input id="rloc" readonly />
        </div>
        <div>
          <label>Nº convidados</label>
          <input id="rguests" readonly />
        </div>
      </div>

      <div>
        <label>Detalhes</label>
        <textarea id="rdetails" readonly></textarea>
      </div>

      <div class="grid2">
        <div>
          <label>Preço final (€)</label>
          <input id="rprice" readonly />
        </div>
        <div>
          <label>Notas do admin</label>
          <textarea id="rnotes" readonly></textarea>
        </div>
      </div>

      <div class="small" id="msgDetail"></div>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>

  <script>
    function $(id){ return document.getElementById(id); }

    // debug para não ficar "silencioso"
    window.addEventListener("error", function(e){ console.error("JS ERROR:", e.message, e); });
    window.addEventListener("unhandledrejection", function(e){ console.error("PROMISE ERROR:", e.reason || e); });

    const rows = $("rows");
    const msgList = $("msgList");
    const msgDetail = $("msgDetail");

    $("btnOut").onclick = LT.signOut;
    $("btnRefresh").onclick = loadMy;

    function fmtDatePT(dateISO){
      if(!dateISO) return "—";
      const d = new Date(dateISO);
      if (isNaN(d.getTime())) return "—";
      return d.toLocaleDateString("pt-PT");
    }

    function setDetail(r){
      msgDetail.textContent = "";
      $("rid").value = r.id || "";
      $("rstatus").value = r.status || "—";
      $("revent").value = r.event_type || "—";
      $("rdate").value = fmtDatePT(r.event_date);
      $("rloc").value = r.location || "—";
      $("rguests").value = (r.guests == null ? "—" : String(r.guests));
      $("rdetails").value = r.details || "—";
      $("rprice").value = (r.final_price == null ? "—" : Number(r.final_price).toFixed(2));
      $("rnotes").value = r.admin_notes || "—";
    }

    async function loadMy(){
      msgList.textContent = "";
      rows.innerHTML = "";
      $("count").textContent = "a carregar...";

      const me = await LT.requireAuth();

      const res = await LT.sb
        .from("quote_requests")
        .select("id, created_at, event_type, event_date, status, location, guests, details, final_price, admin_notes")
        .eq("user_id", me.id)
        .order("created_at", { ascending: false })
        .limit(100);

      if(res.error){
        msgList.textContent = "Erro: " + res.error.message;
        $("count").textContent = "0 pedidos";
        return;
      }

      const data = res.data || [];
      $("count").textContent = data.length + " pedidos";

      if(data.length === 0){
        msgList.textContent = "Ainda não tens pedidos.";
        setDetail({
          id:"", status:"", event_type:"", event_date:null, location:"", guests:null, details:"",
          final_price:null, admin_notes:""
        });
        return;
      }

      data.forEach(function(r){
        const tr = document.createElement("tr");
        const created = r.created_at ? new Date(r.created_at).toLocaleString("pt-PT") : "—";

        tr.innerHTML =
          "<td>" + created + "</td>" +
          "<td>" + (r.event_type || "—") + "</td>" +
          "<td>" + fmtDatePT(r.event_date) + "</td>" +
          "<td><span class='pill'>" + (r.status || "—") + "</span></td>" +
          "<td><button type='button' class='btnTiny' data-id='" + r.id + "'>Ver</button></td>";

        rows.appendChild(tr);
      });

      // mostra o primeiro automaticamente
      setDetail(data[0]);
    }

    // ✅ event delegation: clique no "Ver" funciona sempre
    rows.addEventListener("click", async function(e){
      const btn = e.target.closest("button[data-id]");
      if(!btn) return;

      const id = btn.getAttribute("data-id");
      if(!id) return;

      msgDetail.textContent = "";

      const one = await LT.sb
        .from("quote_requests")
        .select("id, created_at, event_type, event_date, status, location, guests, details, final_price, admin_notes")
        .eq("id", id)
        .single();

      if(one.error){
        console.error(one.error);
        msgDetail.textContent = "Erro a abrir: " + one.error.message;
        return;
      }

      setDetail(one.data);
    });

    (async function init(){
      await LT.requireAuth();
      await loadMy();
    })();
  </script>
</body>
</html>
