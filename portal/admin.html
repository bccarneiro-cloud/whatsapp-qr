<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Pedidos</title>
  <style>
    body{margin:0;font-family:system-ui;background:#071225;color:#eaf1ff}
    .wrap{max-width:1100px;margin:0 auto;padding:28px 16px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .btn{padding:10px 14px;border-radius:12px;border:0;background:#7c5cff;color:#fff;cursor:pointer}
    .btn2{padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:transparent;color:#eaf1ff;cursor:pointer}
    .card{background:#0b1b35;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-top:16px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:14px;vertical-align:top}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:860px){.grid{grid-template-columns:1fr}}
    label{display:block;margin:12px 0 6px;font-size:13px;opacity:.9}
    input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#071225;color:#eaf1ff}
    textarea{min-height:84px;resize:vertical}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .pill{display:inline-block;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.08);font-size:12px}
    .msg{margin-top:10px;font-size:13px;opacity:.95;white-space:pre-wrap}
    .right{display:flex;gap:10px;align-items:center}
    .sub{font-size:12px;opacity:.75;margin-top:2px}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
    .ro textarea,.ro input{background:rgba(255,255,255,.04)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1 style="margin:0">Admin — Pedidos</h1>
      <div class="right">
        <span id="who" class="pill">…</span>
        <button id="btnLogout" class="btn2">Sair</button>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <button id="btnRefresh" class="btn2">Atualizar</button>
        <span class="pill" id="count">0 pedidos</span>
      </div>

      <div style="margin-top:10px;overflow:auto">
        <table>
          <thead>
            <tr>
              <th style="min-width:170px">Criado</th>
              <th style="min-width:260px">Cliente</th>
              <th style="min-width:160px">Evento</th>
              <th style="min-width:120px">Data</th>
              <th style="min-width:120px">Estado</th>
              <th style="min-width:120px">Ações</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="msg" id="msgList"></div>
    </div>

    <div class="card ro">
      <h2 style="margin:0 0 8px">Pedido (leitura)</h2>

      <div class="grid">
        <div>
          <label>ID</label>
          <input id="id" type="text" readonly />
        </div>
        <div>
          <label>Cliente</label>
          <input id="client_ro" type="text" readonly />
          <div class="sub mono" id="client_email_ro"></div>
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Tipo de evento</label>
          <input id="event_type_ro" type="text" readonly />
        </div>
        <div>
          <label>Data do evento</label>
          <input id="event_date_ro" type="text" readonly />
          <div class="sub">DD/MM/AAAA</div>
        </div>
      </div>

      <div class="grid">
        <div>
          <label>Local</label>
          <input id="location_ro" type="text" readonly />
        </div>
        <div>
          <label>Nº convidados</label>
          <input id="guests_ro" type="text" readonly />
        </div>
      </div>

      <div>
        <label>Detalhes do pedido</label>
        <textarea id="details_ro" readonly></textarea>
      </div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px">Aprovação / orçamento</h2>

      <div class="grid">
        <div>
          <label>Preço final (€)</label>
          <input id="final_price" type="number" step="0.01" placeholder="Ex.: 450.00" />
        </div>
        <div>
          <label>Estado</label>
          <select id="status">
            <option value="submetido">submetido</option>
            <option value="em_analise">em_analise</option>
            <option value="aprovado">aprovado</option>
            <option value="rejeitado">rejeitado</option>
            <option value="enviado">enviado</option>
          </select>
        </div>
      </div>

      <div>
        <label>Notas/condições (para o email)</label>
        <textarea id="admin_notes" placeholder="Ex.: validade 7 dias, sinal 30%..."></textarea>
      </div>

      <div class="row" style="margin-top:12px">
        <button id="btnSave" class="btn2">Guardar</button>
        <button id="btnSend" class="btn">Aprovar e enviar (PDF)</button>
      </div>

      <div class="msg" id="msgEdit"></div>
    </div>
  </div>

  <script src="./supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    function $(id){ return document.getElementById(id); }
    function setMsg(el, t){ if(el) el.textContent = t || ""; }

    window.addEventListener("error", function(e){ console.error("JS ERROR:", e.message, e); });
    window.addEventListener("unhandledrejection", function(e){ console.error("PROMISE ERROR:", e.reason || e); });

    if(!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY){
      alert("Falta SUPABASE_URL / SUPABASE_ANON_KEY no supabase-config.js");
    }
    if(!window.supabase){
      alert("SDK Supabase nao carregou. Verifica o script do CDN.");
    }

    var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    var current = null;

    function fmtDatePT(dateISO){
      if(!dateISO) return "—";
      var d = new Date(dateISO);
      if(isNaN(d.getTime())) return "—";
      return d.toLocaleDateString("pt-PT");
    }

    function renderClientCell(r){
      var name = (r.client_name && String(r.client_name).trim()) ? String(r.client_name).trim() : "—";
      var email = (r.client_email && String(r.client_email).trim()) ? String(r.client_email).trim() : "—";
      return "<div>" + name + "</div><div class='sub mono'>" + email + "</div>";
    }

    async function requireSession(){
      var r = await sb.auth.getSession();
      var session = r && r.data ? r.data.session : null;
      if(!session){
        window.location.href = "./login.html";
        return null;
      }
      return session;
    }

    async function ensureAdmin(session){
      var profRes = await sb
        .from("profiles")
        .select("role, name")
        .eq("id", session.user.id)
        .single();

      if(profRes.error){
        setMsg($("msgList"), "Erro perfil: " + profRes.error.message);
        return false;
      }

      var prof = profRes.data || {};
      $("who").textContent = (prof.name ? prof.name + " — " : "") + (prof.role || "user");

      if(prof.role !== "admin"){
        alert("Sem permissões de admin.");
        await sb.auth.signOut();
        window.location.href = "./login.html";
        return false;
      }
      return true;
    }

    function fillForm(row){
      current = row;

      // leitura
      $("id").value = row.id || "";
      $("client_ro").value = (row.client_name && String(row.client_name).trim()) ? String(row.client_name).trim() : "—";
      $("client_email_ro").textContent = (row.client_email && String(row.client_email).trim()) ? String(row.client_email).trim() : "—";
      $("event_type_ro").value = row.event_type || "—";
      $("event_date_ro").value = fmtDatePT(row.event_date);
      $("location_ro").value = row.location || "—";
      $("guests_ro").value = (row.guests == null ? "—" : String(row.guests));
      $("details_ro").value = row.details || "—";

      // edição
      $("final_price").value = (row.final_price == null ? "" : row.final_price);
      $("status").value = row.status || "submetido";
      $("admin_notes").value = (row.admin_notes == null ? "" : row.admin_notes);

      setMsg($("msgEdit"), "");
    }

    async function loadList(){
      setMsg($("msgList"), "");
      $("rows").innerHTML = "";
      $("count").textContent = "a carregar...";

      var res = await sb
        .from("quote_requests")
        .select("id, created_at, client_name, client_email, event_type, event_date, status, final_price")
        .order("created_at", { ascending: false })
        .limit(50);

      if(res.error){
        setMsg($("msgList"), "Erro a carregar: " + res.error.message);
        $("count").textContent = "0 pedidos";
        return;
      }

      var data = res.data || [];
      $("count").textContent = data.length + " pedidos";

      for(var i=0;i<data.length;i++){
        var r = data[i];
        var tr = document.createElement("tr");
        var created = r.created_at ? new Date(r.created_at).toLocaleString("pt-PT") : "—";

        tr.innerHTML =
          "<td>" + created + "</td>" +
          "<td>" + renderClientCell(r) + "</td>" +
          "<td>" + (r.event_type || "—") + "</td>" +
          "<td>" + fmtDatePT(r.event_date) + "</td>" +
          "<td><span class='pill'>" + (r.status || "—") + "</span></td>" +
          "<td><button class='btn2' data-id='" + r.id + "'>Abrir</button></td>";

        $("rows").appendChild(tr);
      }

      var btns = document.querySelectorAll("button[data-id]");
      for(var b=0;b<btns.length;b++){
        btns[b].onclick = async function(){
          var id = this.getAttribute("data-id");
          var one = await sb
            .from("quote_requests")
            .select("id, created_at, user_id, client_name, client_email, event_type, event_date, location, guests, details, status, final_price, admin_notes")
            .eq("id", id)
            .single();

          if(one.error){
            setMsg($("msgList"), "Erro a abrir: " + one.error.message);
            return;
          }
          fillForm(one.data);
        };
      }
    }

    async function saveCurrent(){
      setMsg($("msgEdit"), "");
      if(!current || !current.id){
        setMsg($("msgEdit"), "Seleciona um pedido primeiro.");
        return false;
      }

      var fp = $("final_price").value;
      var patch = {
        final_price: (fp === "" ? null : Number(fp)),
        status: $("status").value,
        admin_notes: ($("admin_notes").value || null)
      };

      var up = await sb.from("quote_requests").update(patch).eq("id", current.id);
      if(up.error){
        setMsg($("msgEdit"), "Erro a guardar: " + up.error.message);
        return false;
      }

      setMsg($("msgEdit"), "Guardado.");
      await loadList();
      return true;
    }

    async function approveAndSend(){
      setMsg($("msgEdit"), "");

      if(!current || !current.id){
        setMsg($("msgEdit"), "Seleciona um pedido primeiro.");
        return;
      }
      if($("final_price").value === ""){
        setMsg($("msgEdit"), "Define o preço final antes de enviar.");
        return;
      }

      var ok = await saveCurrent();
      if(!ok) return;

      try{
        var resp = await sb.functions.invoke("send-quote", { body: { quote_request_id: current.id } });

        if(resp.error){
          console.error("invoke error:", resp.error);
          var bodyText = (resp.error.context && resp.error.context.responseText) ? resp.error.context.responseText : resp.error.message;
          setMsg($("msgEdit"), bodyText || "Erro ao enviar.");
          return;
        }

        setMsg($("msgEdit"), "Email enviado com PDF.");

        await sb.from("quote_requests").update({ status: "enviado" }).eq("id", current.id);
        await loadList();

      }catch(e){
        console.error(e);
        setMsg($("msgEdit"), "Erro inesperado: " + (e && e.message ? e.message : e));
      }
    }

    $("btnLogout").onclick = async function(){
      await sb.auth.signOut();
      window.location.href = "./login.html";
    };

    $("btnRefresh").onclick = loadList;
    $("btnSave").onclick = saveCurrent;
    $("btnSend").onclick = approveAndSend;

    (async function init(){
      var session = await requireSession();
      if(!session) return;

      var isAdmin = await ensureAdmin(session);
      if(!isAdmin) return;

      await loadList();
    })();
  </script>
</body>
</html>
