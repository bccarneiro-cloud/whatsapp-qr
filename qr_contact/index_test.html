<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <style>
    :root{
      --wa: #25D366;

      /* glass */
      --glass: rgba(255,255,255,.30);
      --glass-border: rgba(255,255,255,.35);
      --shadow: 0 18px 50px rgba(0,0,0,.18);
      --text: rgba(10,10,10,.90);

      /* overlay leve */
      --overlay1: rgba(255,255,255,.04);
      --overlay2: rgba(0,0,0,.10);
    }

    html{ height: -webkit-fill-available; }

    body{
      margin:0;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      min-height: -webkit-fill-available;

      display:flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;

      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);

      background: url("./background.png") center / cover no-repeat;

      padding-top:    calc(10px + env(safe-area-inset-top));
      padding-left:   calc(14px + env(safe-area-inset-left));
      padding-right:  calc(14px + env(safe-area-inset-right));
      padding-bottom: calc(22px + env(safe-area-inset-bottom));

      position: relative;
      overflow-x: hidden;
    }

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(
        circle at 50% 40%,
        var(--overlay1),
        rgba(255,255,255,.02) 40%,
        var(--overlay2) 100%
      );
      pointer-events:none;
    }

    .card{
      position:relative;
      width:min(420px, 92vw);
      padding: 12px 14px 14px;

      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border-radius: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 6px;
    }

    /* ---------- BOTÕES ---------- */

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      margin: 10px 0;
      padding: 12px 12px;

      border-radius: 12px;
      text-decoration:none;
      font-weight: 800;

      background: rgba(37, 211, 102, .88);
      border: 1px solid rgba(255,255,255,.35);
      color: white;

      box-shadow: 0 10px 22px rgba(37, 211, 102, .22);
      transition: transform .08s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      cursor: pointer;
    }

    .btn:hover{ filter: brightness(1.03); }
    .btn:active{ transform: scale(.985); }

    /* Email & Instagram (estilo igual) */
    .btn-email,
    .btn-instagram{
      margin-top: 0;
      background: rgba(255,255,255,.50);
      color: rgba(10,10,10,.92);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 10px 22px rgba(0,0,0,.10);
      font-weight: 900;
    }

    .btn-instagram{ margin-bottom: 12px; }
    .btn-email{ margin-bottom: 10px; }

    .ig-icon{
      width: 22px;
      height: 22px;
      object-fit: contain;
      border-radius: 6px;
      animation: igspin 2.8s linear infinite;
    }

    @keyframes igspin{
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ---------- HEADER ---------- */

    .header{
      text-align:center;
      margin-bottom: 10px;
    }

    .lang-row{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      align-items:center;
      margin-bottom: 6px;
    }

    .lang-row .item{
      display:flex;
      justify-content:center;
    }

    .lang-row .wrap{
      display:inline-flex;
      align-items:center;
      gap:6px;
    }

    .lang-row img{
      width: 18px;
      border-radius: 3px;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
    }

    .lang-row .wrap span{
      font-weight: 800;
      font-size: 12px;
      max-width: 120px;
      text-align:center;
    }

    .subtitle{
      font-size: 12px;
      opacity: .78;
      margin: 0;
      text-align:center;
    }

    @media (min-width: 900px){
      body{
        justify-content: center;
        background:
          radial-gradient(circle at center, rgba(255,255,255,.25), rgba(255,255,255,.08)),
          url("./background.png") center / contain no-repeat;
      }

      .card{
        width: 520px;
        transform: translateY(270px);
      }

      .btn{
        padding: 14px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <div class="card">

    <!-- ✅ BOTÃO EMAIL (copia para clipboard) -->
    <button class="btn btn-email" id="emailBtn">
      info@littlethings.events
    </button>

    <a class="btn btn-instagram"
       href="https://www.instagram.com/little.things.artdecor"
       target="_blank">
      <img class="ig-icon" src="./instagram.gif" alt="Instagram">
      <span>Instagram</span>
    </a>

    <div class="header">
      <div class="lang-row">
        <div class="item">
          <div class="wrap">
            <img src="./flag-pt.png" alt="PT">
            <span>Escolhe o teu idioma</span>
          </div>
        </div>
        <div class="item">
          <div class="wrap">
            <img src="./flag-es.png" alt="ES">
            <span>Elige tu idioma</span>
          </div>
        </div>
        <div class="item">
          <div class="wrap">
            <img src="./flag-gb.png" alt="EN">
            <span>Choose your language</span>
          </div>
        </div>
      </div>

      <p class="subtitle">WhatsApp</p>
    </div>

    <a class="btn" href="https://wa.me/351918373423?text=Ol%C3%A1%2C%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es.">Português</a>
    <a class="btn" href="https://wa.me/351918373423?text=Hola%2C%20me%20gustar%C3%ADa%20recibir%20m%C3%A1s%20informaci%C3%B3n.">Español</a>
    <a class="btn" href="https://wa.me/351918373423?text=Hello%2C%20I%20would%20like%20more%20information.">English</a>

  </div>

  <script>
    const emailBtn = document.getElementById("emailBtn");
    const email = "info@littlethings.events";
    const originalText = emailBtn.textContent;

    emailBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(email);
        emailBtn.textContent = "Copiado / Copied";
        setTimeout(() => {
          emailBtn.textContent = originalText;
        }, 1500);
      } catch {
        emailBtn.textContent = "Erro";
      }
    });
  </script>
</body>
</html>
