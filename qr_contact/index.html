<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root{
      --wa: #25D366;
      --glass: rgba(255,255,255,.38);
      --glass-border: rgba(255,255,255,.35);
      --shadow: 0 18px 50px rgba(0,0,0,.18);
      --text: rgba(10,10,10,.88);
    }

    html, body { height: 100%; }

    body{
      margin:0;

      /* iOS friendly viewport */
      min-height: 100vh;
      min-height: 100dvh;

      display:flex;
      align-items:flex-end;   /* anchor card near bottom */
      justify-content:center;

      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);

      /* Background image (as requested) */
      background-image: url("background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: scroll;

      /* Safe areas for iPhone notch/home bar */
      padding:
        calc(14px + env(safe-area-inset-top))
        calc(14px + env(safe-area-inset-right))
        calc(14px + env(safe-area-inset-bottom))
        calc(14px + env(safe-area-inset-left));

      position: relative;
      overflow-x: hidden;
    }

    /* very light overlay to keep readability without hiding the logo */
    body::before{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(
        circle at 50% 40%,
        rgba(255,255,255,.08),
        rgba(255,255,255,.04) 35%,
        rgba(0,0,0,.10) 100%
      );
      pointer-events:none;
    }

    .card{
      position:relative;
      width:min(420px, 92vw);

      /* smaller card */
      padding: 14px 14px 12px;

      /* glass effect */
      background: var(--glass);
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);

      border-radius: 18px;
      box-shadow: var(--shadow);

      /* keep it close to the bottom but safe for iPhone home bar */
      margin-bottom: calc(18px + env(safe-area-inset-bottom));
    }

    .header{
      text-align:center;
      margin-bottom: 10px;
    }

    .title{
      font-weight: 800;
      letter-spacing: .2px;
      font-size: 17px;
      line-height: 1.25;
      margin: 0 0 6px;
    }

    .title .line{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      margin: 4px 0;
    }

    .subtitle{
      font-size: 13px;
      opacity: .78;
      margin: 2px 0 0;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      margin: 8px 0;
      padding: 12px 12px;

      border-radius: 12px;
      text-decoration:none;
      font-weight: 800;

      background: rgba(37, 211, 102, .88);
      border: 1px solid rgba(255,255,255,.35);
      color: white;

      box-shadow: 0 10px 22px rgba(37, 211, 102, .22);
      transition: transform .08s ease, filter .12s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover{ filter: brightness(1.03); }
    .btn:active{ transform: scale(.985); }

    /* optional: hidden footer for a cleaner look */
    .footer-note{ display:none; }

    /* Small screens */
    @media (max-width: 360px){
      .title{ font-size: 16px; }
      .btn{ padding: 11px 11px; border-radius: 11px; }
    }

    /* Landscape (less height): center it and avoid bottom anchoring */
    @media (orientation: landscape) and (max-height: 430px){
      body{ align-items:center; }
      .card{ margin-bottom: 0; }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <div class="title">
        <div class="line">🇵🇹 <span>Escolhe o teu idioma</span></div>
        <div class="line">🇪🇸 <span>Elige tu idioma</span></div>
        <div class="line">🇬🇧 <span>Choose your language</span></div>
      </div>
      <p class="subtitle">WhatsApp</p>
    </div>

    <a class="btn" href="https://wa.me/351918373423?text=Ol%C3%A1%2C%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es.">🇵🇹 Português</a>
    <a class="btn" href="https://wa.me/351918373423?text=Hola%2C%20me%20gustar%C3%ADa%20recibir%20m%C3%A1s%20informaci%C3%B3n.">🇪🇸 Español</a>
    <a class="btn" href="https://wa.me/351918373423?text=Hello%2C%20I%20would%20like%20more%20information.">🇬🇧 English</a>
  </div>
</body>
</html>
