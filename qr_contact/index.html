<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <style>
    :root{
      --wa: #25D366;
      --glass: rgba(255,255,255,.34);
      --glass-border: rgba(255,255,255,.35);
      --shadow: 0 18px 50px rgba(0,0,0,.18);
      --text: rgba(10,10,10,.90);
    }

    html{ height: -webkit-fill-available; }

    body{
      margin:0;

      height: 100vh;
      height: 100svh;
      height: 100dvh;
      min-height: -webkit-fill-available;

      display:flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;

      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);

      background: url("./background.png") center / cover no-repeat;

      padding-top:    calc(10px + env(safe-area-inset-top));
      padding-left:   calc(14px + env(safe-area-inset-left));
      padding-right:  calc(14px + env(safe-area-inset-right));
      padding-bottom: calc(22px + env(safe-area-inset-bottom));

      position: relative;
      overflow-x: hidden;
    }

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(
        circle at 50% 40%,
        rgba(255,255,255,.06),
        rgba(255,255,255,.03) 35%,
        rgba(0,0,0,.10) 100%
      );
      pointer-events:none;
    }

    .card{
      position:relative;
      width:min(420px, 92vw);
      padding: 12px 14px 14px;

      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      border-radius: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 6px;
    }

    /* Instagram bar no topo */
    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      margin: 10px 0;
      padding: 12px 12px;

      border-radius: 12px;
      text-decoration:none;
      font-weight: 800;

      background: rgba(37, 211, 102, .88);
      border: 1px solid rgba(255,255,255,.35);
      color: white;

      box-shadow: 0 10px 22px rgba(37, 211, 102, .22);
      transition: transform .08s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    .btn:active{ transform: scale(.985); }
    .btn:hover{ filter: brightness(1.03); }

    .btn-instagram{
      margin-top: 0;        /* topo */
      margin-bottom: 10px;  /* separação do header */

      background: rgba(255,255,255,.70);
      color: rgba(10,10,10,.92);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 10px 22px rgba(0,0,0,.10);
    }

    .ig-icon{
      width: 22px;
      height: 22px;
      object-fit: contain;
      border-radius: 6px;
      animation: igspin 2.8s linear infinite;
    }

    @keyframes igspin{
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Header com frases completas e SEM cortar */
    .header{
      text-align:center;
      margin-bottom: 10px;
    }

    .lang-row{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      align-items:start;
      justify-items:center;
      margin-bottom: 6px;
    }

    .lang-row .item{
      display:flex;
      gap:6px;
      align-items:flex-start;
      justify-content:center;
      text-align:center;

      font-weight: 800;
      font-size: 12px;          /* pequeno */
      line-height: 1.15;
      white-space: normal;       /* deixa quebrar */
      word-break: break-word;    /* evita cortar feio */
    }

    .subtitle{
      font-size: 12px;
      opacity: .78;
      margin: 0;
    }

    /* Ajustes pequenos em ecrãs estreitos (iPhone) */
    @media (max-width: 380px){
      .lang-row{ gap: 8px; }
      .lang-row .item{ font-size: 11px; }
      .btn{ padding: 11px 11px; }
    }

    /* Landscape: se faltar altura, recentra */
    @media (orientation: landscape) and (max-height: 430px){
      body{ justify-content: center; }
      .card{ margin-bottom: 0; }
    }
  </style>
</head>

<body>
  <div class="card">

    <!-- Instagram no topo -->
    <a class="btn btn-instagram"
       href="https://www.instagram.com/little.things.artdecor"
       target="_blank"
       aria-label="Instagram">
      <img class="ig-icon" src="./instagram.gif" alt="Instagram">
      <span>Instagram</span>
    </a>

    <!-- Header com frases completas -->
    <div class="header">
      <div class="lang-row">
        <div class="item">🇵🇹 <span>Escolhe o teu idioma</span></div>
        <div class="item">🇪🇸 <span>Elige tu idioma</span></div>
        <div class="item">🇬🇧 <span>Choose your language</span></div>
      </div>
      <p class="subtitle">WhatsApp</p>
    </div>

    <!-- Botões de língua -->
    <a class="btn" href="https://wa.me/351918373423?text=Ol%C3%A1%2C%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es.">🇵🇹 Português</a>
    <a class="btn" href="https://wa.me/351918373423?text=Hola%2C%20me%20gustar%C3%ADa%20recibir%20m%C3%A1s%20informaci%C3%B3n.">🇪🇸 Español</a>
    <a class="btn" href="https://wa.me/351918373423?text=Hello%2C%20I%20would%20like%20more%20information.">🇬🇧 English</a>

  </div>
</body>
</html>
