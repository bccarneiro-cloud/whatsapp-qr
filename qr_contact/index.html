<!DOCTYPE html>
<html lang="pt">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YQN46F71DS"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-YQN46F71DS');
  </script>

  <meta charset="UTF-8" />
  <title>WhatsApp Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">

  <style>
    :root{
      --wa: #25D366;

      --glass: rgba(255,255,255,.30);
      --glass-border: rgba(255,255,255,.35);
      --shadow: 0 18px 50px rgba(0,0,0,.18);

      --text: rgba(0,0,0,.92);

      --overlay1: rgba(255,255,255,.04);
      --overlay2: rgba(0,0,0,.10);

      --font: "Caveat Brush", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    html{
      height: -webkit-fill-available;
    }

    body{
      margin:0;

      height: 100vh;
      height: 100svh;
      height: 100dvh;
      min-height: -webkit-fill-available;

      display:flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;

      font-family: var(--font);
      color: var(--text);

      background: url("./background.png") center / cover no-repeat;

      padding-top:    calc(10px + env(safe-area-inset-top));
      padding-left:   calc(14px + env(safe-area-inset-left));
      padding-right:  calc(14px + env(safe-area-inset-right));
      padding-bottom: calc(22px + env(safe-area-inset-bottom));

      position: relative;
      overflow-x: hidden;
    }

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(
        circle at 50% 40%,
        var(--overlay1),
        rgba(255,255,255,.02) 40%,
        var(--overlay2) 100%
      );
      pointer-events:none;
    }

    .card{
      position:relative;
      width:min(420px, 92vw);
      padding: 12px 14px 14px;

      background: var(--glass);
      border: 1px solid var(--glass-border);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border-radius: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 6px;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      margin: 10px 0;
      padding: 12px 12px;

      border-radius: 12px;
      text-decoration:none;

      font-family: var(--font);
      font-weight: 400;
      letter-spacing: .2px;
      font-size: clamp(20px, 2.6vw, 26px);
      line-height: 1.05;

      background: rgba(37, 211, 102, .88);
      border: 1px solid rgba(255,255,255,.35);
      color: white;

      box-shadow: 0 10px 22px rgba(37, 211, 102, .22);
      transition: transform .08s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      cursor:pointer;
    }

    .btn:hover{
      filter: brightness(1.03);
    }

    .btn:active{
      transform: scale(.985);
    }

    button.btn{
      -webkit-appearance: none;
      appearance: none;
      font: inherit;
      text-align: center;
      width: 100%;
    }

    .btn-homepage,
    .btn-email,
    .btn-instagram{
      margin-top: 0;
      margin-bottom: 12px;

      background: rgba(255,255,255,.50);
      color: rgba(0,0,0,.92);
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 10px 22px rgba(0,0,0,.10);
    }

    .btn-homepage{
      margin-bottom: 10px;
    }

    .btn-email{
      margin-bottom: 10px;

      width: 100%;
      justify-content: center;
      text-align: center;
    }

    .btn-email span{
      display:inline-block;
      text-align:center;
    }

    .ig-icon{
      width: 22px;
      height: 22px;
      object-fit: contain;
      border-radius: 6px;
      animation: igspin 2.8s linear infinite;
    }

    @keyframes igspin{
      from{
        transform: rotate(0deg);
      }

      to{
        transform: rotate(360deg);
      }
    }

    .header{
      text-align:center;
      margin-bottom: 10px;
      font-family: var(--font);
    }

    .lang-row{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      align-items:center;
      margin-bottom: 6px;
    }

    .lang-row .item{
      display:flex;
      justify-content:center;
    }

    .lang-row .wrap{
      display:inline-flex;
      align-items:center;
      gap:6px;
    }

    .lang-row img{
      width: 18px;
      height: auto;
      flex-shrink: 0;
      border-radius: 3px;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
    }

    .lang-row .wrap span{
      display:inline-block;
      font-family: var(--font);
      font-weight: 400;
      font-size: clamp(16px, 2.2vw, 20px);
      line-height: 1.05;
      color: rgba(0,0,0,.92);
      text-align:center;
      white-space: normal;
      max-width: 140px;
    }

    .subtitle{
      font-family: var(--font);
      font-weight: 400;
      font-size: clamp(18px, 2.2vw, 22px);
      opacity: .72;
      margin: 2px 0 0;
      text-align:center;
      color: rgba(0,0,0,.85);
    }

    @media (max-width: 380px){
      .lang-row{
        gap: 8px;
      }

      .lang-row .wrap span{
        max-width: 120px;
      }

      .btn{
        padding: 11px 11px;
      }

      .ig-icon{
        width: 20px;
        height: 20px;
      }
    }

    @media (min-width: 900px){
      body{
        justify-content: center;

        background:
          radial-gradient(circle at center, rgba(255,255,255,.25), rgba(255,255,255,.08)),
          url("./background.png") center / contain no-repeat;
      }

      :root{
        --glass: rgba(255,255,255,.22);
        --glass-border: rgba(255,255,255,.32);
        --overlay1: rgba(255,255,255,.02);
        --overlay2: rgba(0,0,0,.08);
      }

      .card{
        width: 520px;
        padding: 16px 16px 16px;
        transform: translateY(270px);
      }

      .lang-row img{
        width: 20px;
      }

      .ig-icon{
        width: 24px;
        height: 24px;
      }
    }

    @media (orientation: landscape) and (max-height: 430px){
      body{
        justify-content: center;
      }

      .card{
        margin-bottom: 0;
      }
    }
  </style>
</head>

<body>
  <div class="card">

    <a class="btn btn-homepage"
       href="https://www.littlethings.events/index.html">
      <span>Homepage</span>
    </a>

    <button class="btn btn-email" id="emailBtn" type="button">
      <span>info@littlethings.events</span>
    </button>

    <a class="btn btn-instagram"
       href="https://www.instagram.com/little.things.artdecor"
       target="_blank"
       rel="noopener">
      <img class="ig-icon" src="./instagram.gif" alt="Instagram">
      <span>Instagram</span>
    </a>

    <div class="header">
      <div class="lang-row">
        <div class="item">
          <div class="wrap">
            <img src="./flag-pt.png" alt="PT">
            <span>Escolhe o teu idioma</span>
          </div>
        </div>

        <div class="item">
          <div class="wrap">
            <img src="./flag-es.png" alt="ES">
            <span>Elige tu idioma</span>
          </div>
        </div>

        <div class="item">
          <div class="wrap">
            <img src="./flag-gb.png" alt="EN">
            <span>Choose your language</span>
          </div>
        </div>
      </div>

      <p class="subtitle">WhatsApp</p>
    </div>

    <a class="btn" href="https://wa.me/351918373423?text=Ol%C3%A1%2C%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es.">Português</a>

    <a class="btn" href="https://wa.me/351918373423?text=Hola%2C%20me%20gustar%C3%ADa%20recibir%20m%C3%A1s%20informaci%C3%B3n.">Español</a>

    <a class="btn" href="https://wa.me/351918373423?text=Hello%2C%20I%20would%20like%20more%20information.">English</a>

  </div>

  <script>
    const emailBtn = document.getElementById("emailBtn");
    const email = "info@littlethings.events";
    const originalHTML = emailBtn.innerHTML;

    emailBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(email);

        emailBtn.innerHTML = "<span>Copiado / Copied</span>";

        setTimeout(() => {
          emailBtn.innerHTML = originalHTML;
        }, 1500);

      } catch {
        emailBtn.innerHTML = "<span>Erro</span>";
      }
    });
  </script>
</body>
</html>
