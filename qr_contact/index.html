<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Contact via WhatsApp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
  :root{
    --wa: #25D366;
    --glass: rgba(255,255,255,.38);
    --glass-border: rgba(255,255,255,.35);
    --shadow: 0 18px 50px rgba(0,0,0,.18);
    --text: rgba(10,10,10,.88);
  }

  html, body { height: 100%; }

  body{
    margin:0;

    /* iOS fix: usar dvh e fallback */
    min-height: 100vh;
    min-height: 100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: var(--text);

    /* iOS fix: evitar background fixed */
    background-image: url("background.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: scroll;

    /* iOS safe areas */
    padding:
      calc(18px + env(safe-area-inset-top))
      calc(14px + env(safe-area-inset-right))
      calc(18px + env(safe-area-inset-bottom))
      calc(14px + env(safe-area-inset-left));

    position: relative;
    overflow-x: hidden;
  }

  body::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(
      circle at 50% 40%,
      rgba(255,255,255,.08),
      rgba(255,255,255,.04) 35%,
      rgba(0,0,0,.10) 100%
    );
    pointer-events:none;
  }

  .card{
    position:relative;
    width:min(420px, 92vw);

    background: var(--glass);
    border: 1px solid var(--glass-border);

    /* iOS: blur funciona melhor com isto */
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);

    border-radius: 18px;
    box-shadow: var(--shadow);

    padding: 18px 16px 16px;
  }

  .header{
    text-align:center;
    margin-bottom: 12px;
  }

  .title{
    font-weight: 800;
    font-size: 18px;
    line-height: 1.25;
    margin: 0 0 10px;
  }

  .title .line{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    margin: 4px 0;
  }

  .subtitle{
    font-size: 13px;
    opacity: .78;
    margin: 0;
  }

  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    margin: 10px 0;
    padding: 14px 14px;

    border-radius: 14px;
    text-decoration:none;
    font-weight: 800;

    background: rgba(37, 211, 102, .88);
    border: 1px solid rgba(255,255,255,.35);
    color: white;

    box-shadow: 0 10px 22px rgba(37, 211, 102, .22);
    transition: transform .08s ease, filter .12s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active{ transform: scale(.985); }

  .footer-note{
    text-align:center;
    font-size: 12px;
    opacity: .70;
    margin-top: 10px;
  }

  /* iPhone landscape: menos altura -> reduzir e permitir scroll */
  @media (orientation: landscape) and (max-height: 430px){
    body{ align-items: flex-start; }
    .card{ margin-top: 10px; }
    .title{ font-size: 16px; }
    .btn{ padding: 12px 12px; margin: 8px 0; }
  }
</style>
</head>

<body>

  <div class="card">
    <div class="header">
      <div class="title">
        <div class="line">🇵🇹 <span>Escolhe o teu idioma</span></div>
        <div class="line">🇪🇸 <span>Elige tu idioma</span></div>
        <div class="line">🇬🇧 <span>Choose your language</span></div>
      </div>
      <p class="subtitle">WhatsApp</p>
    </div>

    <a class="btn" href="https://wa.me/351918373423?text=Ol%C3%A1%2C%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es.">
      🇵🇹 Português
    </a>

    <a class="btn" href="https://wa.me/351918373423?text=Hola%2C%20me%20gustar%C3%ADa%20recibir%20m%C3%A1s%20informaci%C3%B3n.">
      🇪🇸 Español
    </a>

    <a class="btn" href="https://wa.me/351918373423?text=Hello%2C%20I%20would%20like%20more%20information.">
      🇬🇧 English
    </a>
  </div>

</body>
</html>
