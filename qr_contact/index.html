<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>WhatsApp Contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <style>
    :root{
      --wa: #25D366;
      --glass: rgba(255,255,255,.34);
      --glass-border: rgba(255,255,255,.35);
      --shadow: 0 18px 50px rgba(0,0,0,.18);
      --text: rgba(10,10,10,.90);
    }

    html{
      height: -webkit-fill-available;
    }

    body{
      margin:0;

      height: 100vh;
      height: 100svh;
      height: 100dvh;
      min-height: -webkit-fill-available;

      display:flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;

      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);

      background-image: url("background.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      padding-top:    calc(10px + env(safe-area-inset-top));
      padding-left:   calc(14px + env(safe-area-inset-left));
      padding-right:  calc(14px + env(safe-area-inset-right));
      padding-bottom: calc(22px + env(safe-area-inset-bottom));

      position: relative;
      overflow-x: hidden;
    }

    body::before{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(
        circle at 50% 40%,
        rgba(255,255,255,.06),
        rgba(255,255,255,.03) 35%,
        rgba(0,0,0,.10) 100%
      );
      pointer-events:none;
    }

    .card{
      position:relative;
      width:min(420px, 92vw);

      padding: 14px 14px 12px;

      background: var(--glass);
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);

      border-radius: 18px;
      box-shadow: var(--shadow);

      margin-bottom: 6px;
    }

    /* Instagram icon */
    .ig-link{
      position:absolute;
      top:10px;
      right:10px;

      width:34px;
      height:34px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:50%;
      text-decoration:none;
      font-size:18px;

      background: rgba(255,255,255,.55);
      color:#000;

      border:1px solid rgba(255,255,255,.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      box-shadow: 0 6px 16px rgba(0,0,0,.18);
      transition: transform .12s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .ig-link:hover{ filter: brightness(1.05); }
    .ig-link:active{ transform: scale(.94); }

    .header{
      text-align:center;
      margin-bottom: 10px;
    }

    .title{
      font-weight: 800;
      font-size: 17px;
      line-height: 1.25;
      margin: 0 0 6px;
    }

    .title .line{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:center;
      margin: 4px 0;
    }

    .subtitle{
      font-size: 13px;
      opacity: .78;
      margin: 2px 0 0;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      margin: 8px 0;
      padding: 12px 12px;

      border-radius: 12px;
      text-decoration:none;
      font-weight: 800;

      background: rgba(37, 211, 102, .88);
      border: 1px solid rgba(255,255,255,.35);
      color: white;

      box-shadow: 0 10px 22px rgba(37, 211, 102, .22);
      transition: transform .08s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }

    .btn:active{ transform: scale(.985); }
    .btn:hover{ filter: brightness(1.03); }

    @media (max-width: 360px){
      .title{ font-size: 16px; }
      .btn{ padding: 11px 11px; border-radius: 11px; }
    }

    @media (orientation: landscape) and (max-height: 430px){
      body{ justify-content: center; }
      .card{ margin-bottom: 0; }
    }
  </style>
</head>

<body>
  <div class="card">

    <!-- Instagram -->
    <a href="https://www.instagram.com/little.things.artdecor"
       class="ig-link"
       target="_blank"
       aria-label="Instagram">
      📸
    </a>

    <div class="header">
      <div class="title">
        <div class="line">🇵🇹 <span>Escolhe o teu idioma</span></div>
        <div class="line">🇪🇸 <span>Elige tu idioma</span></div>
        <div class="line">🇬🇧 <span>Choose your language</span></div>
      </div>
      <p class="subtitle">WhatsApp</p>
    </div>

    <a class="btn" href="https://wa.me/351918373423?text=Ol%C3%A1%2C%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es.">🇵🇹 Português</a>
    <a class="btn" href="https://wa.me/351918373423?text=Hola%2C%20me%20gustar%C3%ADa%20recibir%20m%C3%A1s%20informaci%C3%B3n.">🇪🇸 Español</a>
    <a class="btn" href="https://wa.me/351918373423?text=Hello%2C%20I%20would%20like%20more%20information.">🇬🇧 English</a>

  </div>
</body>
</html>
